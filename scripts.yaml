alle_lichter_aus:
  alias: Beleuchtung - Alle Lichter aus
  icon: mdi:lightbulb-off-outline
  mode: single
  sequence:
    - action: light.turn_off
      target:
        entity_id: all

dashboard_raum_oeffnen:
  alias: Dashboard - Raum öffnen
  icon: mdi:door-open
  mode: single
  fields:
    area:
      name: Bereichs-ID
      description: ID des HA-Bereichs für die Raum-Detailseite (z. B. wohnzimmer)
      required: true
      selector:
        text:
  sequence:
    - action: input_text.set_value
      target:
        entity_id: input_text.dashboard_active_area
      data:
        value: "{{ area | trim }}"
    - delay:
        milliseconds: 300
    - action: browser_mod.navigate
      data:
        path: /home-dashboard/raum
