alle_lichter_aus:
  alias: Alle Lichter aus
  icon: mdi:lightbulb-off-outline
  mode: single
  sequence:
    - action: light.turn_off
      target:
        entity_id: all

dashboard_raum_oeffnen:
  alias: Dashboard Raum öffnen
  icon: mdi:door-open
  mode: queued
  fields:
    entity_id:
      selector:
        entity:
          domain:
            - light
            - climate
            - switch
            - script
            - fan
            - cover
  sequence:
    - variables:
        bereich: "{{ area_name(area_id(entity_id)) }}"
    - condition: template
      value_template: "{{ bereich is string and bereich | length > 0 }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.dashboard_active_area
      data:
        value: "{{ bereich }}"
    - action: browser_mod.navigate
      data:
        path: /test-dashboard/raum
