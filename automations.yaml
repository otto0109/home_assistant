- id: klima_pv_esszimmer
  alias: Klima PV - Esszimmer
  triggers:
  - trigger: state
    entity_id: input_boolean.klima_pv_esszimmer
  - trigger: state
    entity_id: climate.esszimmer_klimaanlage
    attribute: current_temperature
  - trigger: time_pattern
    minutes: /10
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_state(freigabe, ''on'') }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ aussen_temp > 18 and temp > 21.5 }}'
          sequence:
          - action: climate.set_temperature
            target:
              entity_id: '{{ klima }}'
            data:
              hvac_mode: cool
              temperature: 21
        - conditions:
          - condition: template
            value_template: '{{ aussen_temp <= 18 and temp < 20.5 }}'
          sequence:
          - action: climate.set_temperature
            target:
              entity_id: '{{ klima }}'
            data:
              hvac_mode: heat
              temperature: 21
        default:
        - action: climate.set_temperature
          target:
            entity_id: '{{ klima }}'
          data:
            hvac_mode: '{{ ''cool'' if aussen_temp > 18 else ''heat'' }}'
            temperature: 21
    - conditions:
      - condition: template
        value_template: '{{ is_state(freigabe, ''off'') }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ aussen_temp > 18 and temp > 23.5 }}'
          sequence:
          - action: climate.set_temperature
            target:
              entity_id: '{{ klima }}'
            data:
              hvac_mode: cool
              temperature: 23
        - conditions:
          - condition: template
            value_template: '{{ aussen_temp <= 18 and temp < 19 }}'
          sequence:
          - action: climate.set_temperature
            target:
              entity_id: '{{ klima }}'
            data:
              hvac_mode: heat
              temperature: 19
        default:
        - action: climate.set_temperature
          target:
            entity_id: '{{ klima }}'
          data:
            hvac_mode: '{{ ''cool'' if aussen_temp > 18 else ''heat'' }}'
            temperature: '{{ 23 if aussen_temp > 18 else 19 }}'
    default: []
  mode: single
  variables:
    klima: climate.esszimmer_klimaanlage
    freigabe: input_boolean.klima_pv_esszimmer
    temp: '{{ state_attr(klima, ''current_temperature'') | float(21) }}'
    aussen_temp: '{{ states(''sensor.esszimmer_klimaanlage_aussentemperatur'') | float(25)
      }}'
