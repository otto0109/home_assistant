# Szenen-Kacheln (gleicher Icon-Stil, ohne Unterzeile)
scene_tile_layout:
  show_name: true
  show_icon: true
  show_state: false
  show_label: false
  styles:
    card:
      - border-radius: var(--border-radius)
      - box-shadow: var(--box-shadow)
      - padding: 14px 0 10px
    grid:
      - grid-template-areas: "'i' 'n'"
    name:
      - justify-self: center
      - font-weight: bold
      - font-size: 15px
      - margin-top: 12px
    img_cell:
      - width: 50px
      - height: 50px
      - border-radius: 50%
    icon:
      - width: 24px
      - height: 24px

scene_tile_blue:
  template:
    - scene_tile_layout
    - tile_color_blue
