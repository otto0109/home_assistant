# Status-Kacheln (Solar-Stil): To-dos + Kalender
status_tile:
  show_name: true
  show_icon: true
  show_state: false
  show_label: true
  label: '[[[ return states[entity.entity_id].state + " offen" ]]]'
  styles:
    card:
      - border-radius: var(--border-radius)
      - box-shadow: var(--box-shadow)
      - padding: 14px 0 10px
    grid:
      - grid-template-areas: "'i' 'n' 'l'"
    name:
      - justify-self: center
      - font-weight: bold
      - font-size: 15px
      - margin-top: 12px
    label:
      - justify-self: center
      - font-size: 13px
      - opacity: 0.7
    img_cell:
      - width: 50px
      - height: 50px
      - border-radius: 50%
      - |
        [[[
          const c = variables.ulm_status_color || 'blue';
          return `background-color: rgba(var(--color-${c}), 0.2)`;
        ]]]
    icon:
      - width: 24px
      - height: 24px
      - |
        [[[
          const c = variables.ulm_status_color || 'blue';
          return `color: rgba(var(--color-${c}), 1)`;
        ]]]

status_tile_calendar:
  show_name: true
  show_icon: true
  show_state: false
  show_label: true
  label: '[[[ var s=states["sensor.dashboard_kalender_heute"]; var n=(s&&s.state!=="unavailable"&&s.state!=="unknown")?(parseInt(s.state,10)||0):0; return n+(n===1?" Termin heute":" Termine heute"); ]]]'
  styles:
    card:
      - border-radius: var(--border-radius)
      - box-shadow: var(--box-shadow)
      - padding: 14px 0 10px
    grid:
      - grid-template-areas: "'i' 'n' 'l'"
    name:
      - justify-self: center
      - font-weight: bold
      - font-size: 15px
      - margin-top: 12px
    label:
      - justify-self: center
      - font-size: 13px
      - opacity: 0.7
    img_cell:
      - width: 50px
      - height: 50px
      - border-radius: 50%
      - background-color: rgba(var(--color-purple), 0.2)
    icon:
      - color: rgba(var(--color-purple), 1)
      - width: 24px
      - height: 24px
