# Status-Kacheln (Solar-Stil): To-dos + Kalender
# Farb-Varianten mit statischen ULM-Farben (wie card_room_yellow_no_state).
status_tile_layout:
  show_name: true
  show_icon: true
  show_state: false
  show_label: true
  label: '[[[ return states[entity.entity_id].state + " offen" ]]]'
  styles:
    card:
      - border-radius: var(--border-radius)
      - box-shadow: var(--box-shadow)
      - padding: 14px 0 10px
    grid:
      - grid-template-areas: "'i' 'n' 'l'"
    name:
      - justify-self: center
      - font-weight: bold
      - font-size: 15px
      - margin-top: 12px
    label:
      - justify-self: center
      - font-size: 13px
      - opacity: 0.7
    img_cell:
      - width: 50px
      - height: 50px
      - border-radius: 50%
    icon:
      - width: 24px
      - height: 24px

status_tile_blue:
  template: status_tile_layout
  styles:
    img_cell:
      - background-color: rgba(var(--color-blue), 0.2)
    icon:
      - color: rgba(var(--color-blue), 1)

