# Außenbeleuchtung — Zeitplan + Heimkehr nachts (nicht im Sicherheitsmodus).

automation:
  - id: aussenbeleuchtung_sonnenuntergang_an
    alias: Außenbeleuchtung — Sonnenuntergang an
    mode: single
    triggers:
      - trigger: sun
        event: sunset
    actions:
      - action: light.turn_on
        target:
          entity_id: light.draussen_aussenbeleuchtung_haus

  - id: aussenbeleuchtung_mitternacht_aus
    alias: Außenbeleuchtung — Mitternacht aus
    mode: single
    triggers:
      - trigger: time
        at: "00:00:00"
    actions:
      - action: light.turn_off
        target:
          entity_id: light.draussen_aussenbeleuchtung_haus

  - id: aussenbeleuchtung_frueh_an
    alias: Außenbeleuchtung — 06:00 an
    mode: single
    triggers:
      - trigger: time
        at: "06:00:00"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.draussen_aussenbeleuchtung_haus

  - id: aussenbeleuchtung_sonnenaufgang_aus
    alias: Außenbeleuchtung — Sonnenaufgang aus
    mode: single
    triggers:
      - trigger: sun
        event: sunrise
    actions:
      - action: light.turn_off
        target:
          entity_id: light.draussen_aussenbeleuchtung_haus

  - id: aussenbeleuchtung_heimkehr_nachts
    alias: Außenbeleuchtung — Home-Zone nachts
    mode: single
    triggers:
      - trigger: zone
        entity_id: person.thorge
        zone: zone.home
        event: enter
      - trigger: zone
        entity_id: person.laura
        zone: zone.home
        event: enter
    conditions:
      - condition: sun
        after: sunset
        before: sunrise
    actions:
      - action: light.turn_on
        target:
          entity_id: light.draussen_aussenbeleuchtung_haus

  - id: aussenbeleuchtung_startup
    alias: Außenbeleuchtung — Status nach Neustart
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {% set h = now().hour %}
                  {{ is_state('sun.sun', 'below_horizon')
                     and not (h >= 0 and h < 6) }}
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.draussen_aussenbeleuchtung_haus
        default:
          - action: light.turn_off
            target:
              entity_id: light.draussen_aussenbeleuchtung_haus
