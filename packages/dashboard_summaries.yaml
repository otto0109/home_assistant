# Zählt Kalender-Termine für heute (Dashboard-Status-Kachel).
template:
  - trigger:
      - platform: time_pattern
        minutes: "/5"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: calendar.thorge_3_laura
    action:
      - action: calendar.get_events
        target:
          entity_id: >
            {{ states.calendar
               | rejectattr('state', 'in', ['unavailable', 'unknown'])
               | map(attribute='entity_id') | list }}
        data:
          start_date_time: "{{ today_at('00:00:00') }}"
          end_date_time: "{{ today_at('23:59:59') }}"
        response_variable: agenda
    sensor:
      - name: Dashboard Kalender Heute
        unique_id: dashboard_kalender_heute
        icon: mdi:calendar
        state: >
          {% set ns = namespace(count=0) %}
          {% for cal in agenda | default({}, true) %}
            {% set ns.count = ns.count + (agenda[cal].events | default([]) | count) %}
          {% endfor %}
          {{ ns.count }}
