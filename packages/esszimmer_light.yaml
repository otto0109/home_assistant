# Esszimmer: Sonoff-Matter-Schalter (kein Detach-Relay möglich).
# Strategie: Der Schalter wird nach jedem physischen "Aus" sofort wieder
# eingeschaltet (Strom bleibt für die Leuchte), und der Wunschzustand der
# Leuchte wird per Software umgeschaltet.
# Automation liegt in automations.yaml (UI-editierbar): esszimmer_schalter_toggle

input_boolean:
  esszimmer_lampe_gewuenscht:
    name: Esszimmer Lampe gewünscht
    icon: mdi:lightbulb
    initial: true
