# Aggregiert offene To-do-Einträge aller Listen für die Dashboard-Zusammenfassung.
template:
  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: time_pattern
        minutes: "/2"
      - trigger: template
        value_template: >
          {{ states.todo | map(attribute='last_updated') | join(',') }}
    action:
      - variables:
          todo_entities: >
            {% set ns = namespace(ids=[]) %}
            {% for e in states.todo | sort(attribute='name') %}
              {% if e.state not in ['unavailable', 'unknown'] %}
                {% set ns.ids = ns.ids + [e.entity_id] %}
              {% endif %}
            {% endfor %}
            {{ ns.ids }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ todo_entities | length > 0 }}"
            sequence:
              - action: todo.get_items
                target:
                  entity_id: "{{ todo_entities }}"
                data:
                  status:
                    - needs_action
                response_variable: todo_items
          - default:
              - variables:
                  todo_items: {}
    sensor:
      - name: Dashboard Todo Zusammenfassung
        unique_id: dashboard_todo_zusammenfassung
        icon: mdi:format-list-checks
        state: >
          {% set ns = namespace(count=0) %}
          {% for eid in todo_entities %}
            {% if eid in todo_items %}
              {% set ns.count = ns.count + (todo_items[eid]['items'] | length) %}
            {% endif %}
          {% endfor %}
          {{ ns.count }}
        attributes:
          items: >
            {% set ns = namespace(items=[]) %}
            {% for eid in todo_entities %}
              {% if eid in todo_items and ns.items | length < 10 %}
                {% for item in todo_items[eid]['items'] %}
                  {% if ns.items | length < 10 %}
                    {% set ns.items = ns.items + [{
                      'summary': item.summary | default(''),
                      'entity_id': eid,
                      'list_name': state_attr(eid, 'friendly_name') | default(eid)
                    }] %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {{ ns.items }}
          text: >
            {% set ns = namespace(items=[]) %}
            {% for eid in todo_entities %}
              {% if eid in todo_items and ns.items | length < 10 %}
                {% for item in todo_items[eid]['items'] %}
                  {% if ns.items | length < 10 %}
                    {% set ns.items = ns.items + [{
                      'summary': item.summary | default(''),
                      'entity_id': eid,
                      'list_name': state_attr(eid, 'friendly_name') | default(eid)
                    }] %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {% if ns.items | length == 0 %}
            *Keine offenen Aufgaben*
            {% else %}
            {% for item in ns.items %}
            - {{ item.summary }} · _{{ item.list_name }}_
            {% endfor %}
            {% endif %}
