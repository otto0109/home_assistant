# Loads default set of integrations. Do not remove.
default_config:

# YAML-Dashboards: Änderungen hier erfordern einen vollen HA-Neustart
# (nicht „Konfiguration neu laden“). Einstellungen → System → Home Assistant neu starten
lovelace:
  mode: storage
  dashboards: !include dashboards/registry.yaml

homeassistant:
  packages: !include_dir_named packages

alexa:
  smart_home:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.30.33.0/24
    - 192.168.178.30
