# Loads default set of integrations. Do not remove.
default_config:

# YAML-Dashboards: Änderungen hier erfordern einen vollen HA-Neustart
# (nicht „Konfiguration neu laden“). Einstellungen → System → Home Assistant neu starten
lovelace:
  mode: storage
  dashboards: !include dashboards/registry.yaml
  resources:
    - url: /hacsfiles/button-card/button-card.js
      type: module
    - url: /hacsfiles/lovelace-card-mod/card-mod.js
      type: module
    - url: /hacsfiles/lovelace-auto-entities/auto-entities.js
      type: module
    - url: /hacsfiles/mini-graph-card/mini-graph-card-bundle.js
      type: module
    - url: /hacsfiles/lovelace-layout-card/layout-card.js
      type: module
    - url: /hacsfiles/decluttering-card/decluttering-card.js
      type: module
    - url: /hacsfiles/lovelace-mushroom/mushroom.js
      type: module
    - url: /hacsfiles/my-cards/my-cards.js
      type: module
    - url: /hacsfiles/atomic-calendar-revive/atomic-calendar-revive.js
      type: module
    - url: /local/lovelace-expander-card.js
      type: module

homeassistant:
  packages: !include_dir_named packages

alexa:
  smart_home:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    # YAML-Config: www/custom-sidebar-config.yaml
    - /hacsfiles/custom-sidebar/custom-sidebar-plugin.js

automation: !include_dir_merge_list automations/
script: !include_dir_merge_named scripts/
scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.30.33.0/24
    - 192.168.178.30
