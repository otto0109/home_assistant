# Außenbeleuchtung (Timer-Helfer in packages/outdoor_lighting.yaml)

- id: aussenbeleuchtung_sonnenuntergang_an
  alias: Außenbeleuchtung - Sonnenuntergang an
  labels:
    - Außen
    - Beleuchtung
  mode: single
  triggers:
  - trigger: sun
    event: sunset
  conditions: []
  actions:
  - action: light.turn_on
    target:
      entity_id: light.draussen_aussenbeleuchtung_haus
- id: aussenbeleuchtung_mitternacht_aus
  alias: Außenbeleuchtung - Mitternacht aus
  labels:
    - Außen
    - Beleuchtung
  mode: single
  triggers:
  - trigger: time
    at: '00:00:00'
  conditions: []
  actions:
  - action: light.turn_off
    target:
      entity_id: light.draussen_aussenbeleuchtung_haus
- id: aussenbeleuchtung_frueh_an
  alias: Außenbeleuchtung - 06:00 an
  labels:
    - Außen
    - Beleuchtung
  mode: single
  triggers:
  - trigger: time
    at: '06:00:00'
  conditions:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  actions:
  - action: light.turn_on
    target:
      entity_id: light.draussen_aussenbeleuchtung_haus
- id: aussenbeleuchtung_sonnenaufgang_aus
  alias: Außenbeleuchtung - Sonnenaufgang aus
  labels:
    - Außen
    - Beleuchtung
  mode: single
  triggers:
  - trigger: sun
    event: sunrise
  conditions: []
  actions:
  - action: light.turn_off
    target:
      entity_id: light.draussen_aussenbeleuchtung_haus
- id: aussenbeleuchtung_heimkehr_nachts
  alias: Außenbeleuchtung - Home-Zone nachts
  labels:
    - Außen
    - Beleuchtung
  description: Bei Ankunft nachts an. In der 00-06 Uhr Lücke nach 30 min wieder aus.
  mode: single
  triggers:
  - trigger: zone
    entity_id: person.thorge
    zone: zone.home
    event: enter
  - trigger: zone
    entity_id: person.laura
    zone: zone.home
    event: enter
  conditions:
  - condition: sun
    after: sunset
    before: sunrise
  actions:
  - action: light.turn_on
    target:
      entity_id: light.draussen_aussenbeleuchtung_haus
  - if:
    - condition: time
      after: '00:00:00'
      before: '06:00:00'
    then:
    - action: timer.start
      target:
        entity_id: timer.aussenlicht_heimkehr
- id: aussenbeleuchtung_heimkehr_timer_aus
  alias: Außenbeleuchtung - Heimkehr-Timer abgelaufen
  labels:
    - Außen
    - Beleuchtung
  description: Schaltet das Heimkehr-Licht aus, wenn es nicht in der Sowieso-an-Zeit
    ist.
  mode: single
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.aussenlicht_heimkehr
  conditions:
  - condition: time
    after: '00:00:00'
    before: '06:00:00'
  actions:
  - action: light.turn_off
    target:
      entity_id: light.draussen_aussenbeleuchtung_haus
- id: aussenbeleuchtung_startup
  alias: Außenbeleuchtung - Status nach Neustart
  labels:
    - Außen
    - Beleuchtung
  mode: single
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - if:
    - condition: template
      value_template: '{{ is_state(''sun.sun'', ''below_horizon'') and not (now().hour
        < 6) }}'
    then:
    - action: light.turn_on
      target:
        entity_id: light.draussen_aussenbeleuchtung_haus
    else:
    - action: light.turn_off
      target:
        entity_id: light.draussen_aussenbeleuchtung_haus
