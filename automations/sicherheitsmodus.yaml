# Anwesenheitssimulation (Helfer und Skripte in packages/security_mode.yaml)

- id: sicherheitsmodus_sonnenuntergang
  alias: Sicherheitsmodus - Sonnenuntergang
  labels:
    - Sicherheit
  description: Startet Simulation ab Sonnenuntergang, wenn niemand zu Hause ist.
  mode: single
  triggers:
  - trigger: sun
    event: sunset
  conditions:
  - condition: state
    entity_id: input_boolean.sicherheitsmodus_aktiv
    state: 'off'
  - condition: template
    value_template: '{{ is_state(''person.thorge'', ''not_home'') and is_state(''person.laura'',
      ''not_home'') }}'
  - condition: template
    value_template: '{{ (state_attr(''sensor.sicherheitsmodus_lichter'', ''entity_ids'')
      or []) | length > 0 }}'
  actions:
  - action: script.sicherheitsmodus_start
- id: sicherheitsmodus_haus_verlassen
  alias: Sicherheitsmodus - Haus verlassen (nachts)
  labels:
    - Sicherheit
  description: Startet Simulation, wenn nach Sonnenuntergang alle weggehen.
  mode: single
  triggers:
  - trigger: state
    entity_id:
    - person.thorge
    - person.laura
  conditions:
  - condition: state
    entity_id: input_boolean.sicherheitsmodus_aktiv
    state: 'off'
  - condition: sun
    after: sunset
    before: sunrise
  - condition: template
    value_template: '{{ is_state(''person.thorge'', ''not_home'') and is_state(''person.laura'',
      ''not_home'') }}'
  - condition: template
    value_template: '{{ (state_attr(''sensor.sicherheitsmodus_lichter'', ''entity_ids'')
      or []) | length > 0 }}'
  actions:
  - action: script.sicherheitsmodus_start
- id: sicherheitsmodus_heimkehr
  alias: Sicherheitsmodus - Home-Zone
  labels:
    - Sicherheit
  description: Beendet Simulation und schaltet alle Simulations-Lichter aus.
  mode: restart
  triggers:
  - trigger: zone
    entity_id: person.thorge
    zone: zone.home
    event: enter
  - trigger: zone
    entity_id: person.laura
    zone: zone.home
    event: enter
  conditions:
  - condition: state
    entity_id: input_boolean.sicherheitsmodus_aktiv
    state: 'on'
  actions:
  - action: script.sicherheitsmodus_stop
