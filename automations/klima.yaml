# Klima: Grundtemperatur + smarter Bedarf + PV-Offset
# Helfer und Script in packages/klima.yaml

# Hoch/Runter an der Klima = Grundtemperatur-Trend (nicht Automatik pausieren)
- id: klima_grund_esszimmer
  alias: Klima - Grundtemperatur Esszimmer
  labels:
    - Klima
    - Esszimmer
  description: Änderungen am Sollwert verschieben die Grundtemperatur um die gleiche Differenz.
  mode: queued
  max: 5
  triggers:
  - trigger: state
    entity_id: climate.esszimmer_klimaanlage
    attribute: temperature
  conditions:
  - condition: template
    value_template: >
      {{ trigger.from_state is not none
         and trigger.to_state is not none
         and trigger.to_state.attributes.temperature is not none
         and trigger.from_state.attributes.temperature is not none
         and trigger.to_state.attributes.temperature != trigger.from_state.attributes.temperature
         and trigger.to_state.context.parent_id is none }}
  actions:
  - variables:
      delta: "{{ trigger.to_state.attributes.temperature | float(22) - trigger.from_state.attributes.temperature | float(22) }}"
      neu: "{{ (states('input_number.klima_grund_esszimmer') | float(22) + delta) | round(1) }}"
  - action: input_number.set_value
    target:
      entity_id: input_number.klima_grund_esszimmer
    data:
      value: "{{ [16, [30, neu] | min] | max }}"
  - action: script.klima_anwenden
    data:
      klima: climate.esszimmer_klimaanlage
      grund: input_number.klima_grund_esszimmer
      freigabe: input_boolean.klima_pv_esszimmer
      aussen_sensor: sensor.esszimmer_klimaanlage_aussentemperatur

