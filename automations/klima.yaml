# Smarte Anwendung nur bei relevanten Änderungen
- id: klima_steuerung_esszimmer
  alias: Klima - Steuerung Esszimmer
  labels:
    - Klima
    - Esszimmer
  mode: single
  triggers:
  - trigger: state
    entity_id: input_boolean.klima_pv_esszimmer
  - trigger: state
    entity_id: input_number.klima_grund_esszimmer
  - trigger: state
    entity_id: sensor.esszimmer_klimaanlage_aussentemperatur
    for:
      minutes: 5
  - trigger: state
    entity_id: climate.esszimmer_klimaanlage
    attribute: current_temperature
    for:
      minutes: 3
  - trigger: homeassistant
    event: start
  actions:
  - action: script.klima_anwenden
    data:
      klima: climate.esszimmer_klimaanlage
      grund: input_number.klima_grund_esszimmer
      freigabe: input_boolean.klima_pv_esszimmer
      aussen_sensor: sensor.esszimmer_klimaanlage_aussentemperatur

