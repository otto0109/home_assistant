# Esszimmer: Sonoff-Schalter ohne Detach-Relay

- id: esszimmer_schalter_toggle
  alias: Esszimmer - Schalter toggelt Leuchte (Strom bleibt)
  labels:
    - Esszimmer
    - Beleuchtung
  description: Sonoff-Matter-Schalter kann Relais nicht abkoppeln. Deshalb nach jedem
    physischen Aus sofort wieder einschalten und die Leuchte per Software umschalten.
  mode: restart
  triggers:
  - trigger: state
    entity_id: light.esszimmer_lichtschalter_esszimmer
    to: 'off'
  conditions: []
  actions:
  - action: light.turn_on
    target:
      entity_id: light.esszimmer_lichtschalter_esszimmer
  - action: input_boolean.toggle
    target:
      entity_id: input_boolean.esszimmer_lampe_gewuenscht
  - wait_template: '{{ not is_state(''light.esszimmer_lampe_leuchte'', ''unavailable'')
      }}'
    timeout: '00:00:10'
    continue_on_timeout: true
  - if:
    - condition: state
      entity_id: input_boolean.esszimmer_lampe_gewuenscht
      state: 'on'
    then:
    - action: light.turn_on
      target:
        entity_id: light.esszimmer_lampe_leuchte
    else:
    - action: light.turn_off
      target:
        entity_id: light.esszimmer_lampe_leuchte
