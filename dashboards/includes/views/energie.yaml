- type: custom:mod-card
  card_mod:
    style: |
      ha-card {
        margin: 16px auto 24px auto;
        max-width: 920px;
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
      #root {
        gap: 12px;
      }
  card:
    type: vertical-stack
    cards:
      - type: custom:button-card
        template: card_title
        name: Energie
        label: Solar, Speicher & Verbrauch

      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-gap: 12px
          grid-template-columns: repeat(2, 1fr)
          mediaquery:
            "(min-width: 700px)":
              grid-template-columns: repeat(4, 1fr)
        cards: !include ../energie-stats-row.yaml

      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              margin: 4px 0 8px 0;
              border-radius: 20px;
              overflow: hidden;
            }
        card:
          type: custom:power-flow-card-plus
          clickable_entities: true
          use_new_flow_rate_model: true
          min_flow_rate: 0.75
          max_flow_rate: 6
          min_expected_power: 0.01
          max_expected_power: 11000
          w_decimals: 0
          kw_decimals: 2
          display_zero_lines:
            mode: transparency
            transparency: 70
          entities:
            solar:
              entity: sensor.pv_pv_power
              name: Solar
              icon: mdi:solar-power-variant
              color_icon: true
              display_zero: true
            grid:
              entity: sensor.pv_netzleistung
              name: Netz
              icon: mdi:transmission-tower
              display_state: one_way
              color_circle: color_dynamically
            battery:
              entity: sensor.pv_battery_power
              state_of_charge: sensor.pv_battery
              name: Speicher
              display_state: one_way
              color_circle: color_dynamically
              state_of_charge_decimals: 0
            home:
              entity: sensor.pv_activepower_load_sys
              name: Haus
              icon: mdi:home
              color_icon: true
              override_state: true

      - type: custom:button-card
        template: card_title
        name: Verlauf

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:button-card
            entity: input_select.pv_zeitraum
            name: Live
            show_icon: false
            show_state: false
            tap_action:
              action: call-service
              service: input_select.select_option
              target:
                entity_id: input_select.pv_zeitraum
              data:
                option: Live
            styles:
              card:
                - height: 42px
                - border-radius: 12px
            state:
              - value: Live
                styles:
                  card:
                    - background: "rgba(var(--rgb-primary-color), 0.18)"
          - type: custom:button-card
            entity: input_select.pv_zeitraum
            name: 24h
            show_icon: false
            show_state: false
            tap_action:
              action: call-service
              service: input_select.select_option
              target:
                entity_id: input_select.pv_zeitraum
              data:
                option: 24h
            styles:
              card:
                - height: 42px
                - border-radius: 12px
            state:
              - value: 24h
                styles:
                  card:
                    - background: "rgba(var(--rgb-primary-color), 0.18)"
          - type: custom:button-card
            entity: input_select.pv_zeitraum
            name: Woche
            show_icon: false
            show_state: false
            tap_action:
              action: call-service
              service: input_select.select_option
              target:
                entity_id: input_select.pv_zeitraum
              data:
                option: Woche
            styles:
              card:
                - height: 42px
                - border-radius: 12px
            state:
              - value: Woche
                styles:
                  card:
                    - background: "rgba(var(--rgb-primary-color), 0.18)"
          - type: custom:button-card
            entity: input_select.pv_zeitraum
            name: Monat
            show_icon: false
            show_state: false
            tap_action:
              action: call-service
              service: input_select.select_option
              target:
                entity_id: input_select.pv_zeitraum
              data:
                option: Monat
            styles:
              card:
                - height: 42px
                - border-radius: 12px
            state:
              - value: Monat
                styles:
                  card:
                    - background: "rgba(var(--rgb-primary-color), 0.18)"
          - type: custom:button-card
            entity: input_select.pv_zeitraum
            name: Jahr
            show_icon: false
            show_state: false
            tap_action:
              action: call-service
              service: input_select.select_option
              target:
                entity_id: input_select.pv_zeitraum
              data:
                option: Jahr
            styles:
              card:
                - height: 42px
                - border-radius: 12px
            state:
              - value: Jahr
                styles:
                  card:
                    - background: "rgba(var(--rgb-primary-color), 0.18)"
          - type: custom:button-card
            entity: input_select.pv_zeitraum
            name: Gesamt
            show_icon: false
            show_state: false
            tap_action:
              action: call-service
              service: input_select.select_option
              target:
                entity_id: input_select.pv_zeitraum
              data:
                option: Lebenslang
            styles:
              card:
                - height: 42px
                - border-radius: 12px
            state:
              - value: Lebenslang
                styles:
                  card:
                    - background: "rgba(var(--rgb-primary-color), 0.18)"

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.pv_zeitraum
            state: Live
        card:
          type: custom:mod-card
          card_mod:
            style: |
              ha-card {
                margin: 8px 0 0 0;
                border-radius: 20px;
                padding: 8px 4px 4px 4px;
              }
          card:
            type: custom:mini-graph-card
            name: Live
            hours_to_show: 1
            points_per_hour: 12
            height: 280
            line_width: 3
            animate: true
            lower_bound: 0
            show:
              labels: false
              extrema: false
              legend: true
              icon: false
            entities:
              - entity: sensor.pv_pv_power
                name: Solar
                color: "#f4b400"
                show_fill: true
              - entity: sensor.pv_activepower_load_sys
                name: Verbrauch
                color: "#4285f4"
                show_fill: true
              - entity: sensor.pv_battery_power
                name: Batterie
                color: "#34a853"
                y_axis: secondary

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.pv_zeitraum
            state: 24h
        card:
          type: custom:mod-card
          card_mod:
            style: |
              ha-card {
                margin: 8px 0 0 0;
                border-radius: 20px;
                padding: 8px 4px 4px 4px;
              }
          card:
            type: custom:mini-graph-card
            name: 24 Stunden
            hours_to_show: 24
            points_per_hour: 4
            height: 280
            line_width: 2
            lower_bound: 0
            show:
              labels: false
              extrema: false
              legend: true
              icon: false
            entities:
              - entity: sensor.pv_pv_power
                name: Solar
                color: "#f4b400"
                show_fill: true
              - entity: sensor.pv_activepower_load_sys
                name: Verbrauch
                color: "#4285f4"
                show_fill: true
              - entity: sensor.pv_battery_power
                name: Batterie
                color: "#34a853"
                y_axis: secondary

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.pv_zeitraum
            state: Woche
        card:
          type: custom:mod-card
          card_mod:
            style: |
              ha-card {
                margin: 8px 0 0 0;
                border-radius: 20px;
                padding: 8px 4px 4px 4px;
              }
          card:
            type: custom:mini-graph-card
            name: Woche
            hours_to_show: 168
            height: 280
            group_by:
              duration: 1h
              func: avg
            line_width: 2
            lower_bound: 0
            show:
              labels: false
              extrema: false
              legend: true
              icon: false
            entities:
              - entity: sensor.pv_pv_power
                name: Solar
                color: "#f4b400"
              - entity: sensor.pv_activepower_load_sys
                name: Verbrauch
                color: "#4285f4"
              - entity: sensor.pv_battery_power
                name: Batterie
                color: "#34a853"
                y_axis: secondary

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.pv_zeitraum
            state: Monat
        card:
          type: custom:mod-card
          card_mod:
            style: |
              ha-card {
                margin: 8px 0 0 0;
                border-radius: 20px;
                padding: 8px 4px 4px 4px;
              }
          card:
            type: custom:mini-graph-card
            name: Monat
            hours_to_show: 720
            height: 280
            group_by:
              duration: 6h
              func: avg
            line_width: 2
            lower_bound: 0
            show:
              labels: false
              extrema: false
              legend: true
              icon: false
            entities:
              - entity: sensor.pv_pv_power
                name: Solar
                color: "#f4b400"
              - entity: sensor.pv_activepower_load_sys
                name: Verbrauch
                color: "#4285f4"
              - entity: sensor.pv_battery_power
                name: Batterie
                color: "#34a853"
                y_axis: secondary

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.pv_zeitraum
            state: Jahr
        card:
          type: custom:mod-card
          card_mod:
            style: |
              ha-card {
                margin: 8px 0 0 0;
                border-radius: 20px;
                padding: 8px 4px 4px 4px;
              }
          card:
            type: custom:mini-graph-card
            name: Jahr
            hours_to_show: 8760
            height: 280
            group_by:
              duration: 1d
              func: avg
            line_width: 2
            lower_bound: 0
            show:
              labels: false
              extrema: false
              legend: true
              icon: false
            entities:
              - entity: sensor.pv_pv_power
                name: Solar
                color: "#f4b400"
              - entity: sensor.pv_activepower_load_sys
                name: Verbrauch
                color: "#4285f4"
              - entity: sensor.pv_battery_power
                name: Batterie
                color: "#34a853"
                y_axis: secondary

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.pv_zeitraum
            state: Lebenslang
        card:
          type: custom:mod-card
          card_mod:
            style: |
              ha-card {
                margin: 8px 0 0 0;
                border-radius: 20px;
                padding: 8px 4px 4px 4px;
              }
          card:
            type: custom:mini-graph-card
            name: Gesamt
            hours_to_show: 8760
            height: 280
            group_by:
              duration: 1d
              func: avg
            line_width: 2
            lower_bound: 0
            show:
              labels: false
              extrema: false
              legend: true
              icon: false
            entities:
              - entity: sensor.pv_pv_power
                name: Solar
                color: "#f4b400"
              - entity: sensor.pv_activepower_load_sys
                name: Verbrauch
                color: "#4285f4"
              - entity: sensor.pv_battery_power
