- type: vertical-stack
  cards:
    - type: custom:button-card
      template: card_title
      name: Energie
      label: Solar, Speicher & Verbrauch

    - type: custom:power-flow-card-plus
      clickable_entities: true
      use_new_flow_rate_model: true
      min_flow_rate: 0.75
      max_flow_rate: 6
      min_expected_power: 0.01
      max_expected_power: 11000
      w_decimals: 0
      kw_decimals: 2
      display_zero_lines:
        mode: transparency
        transparency: 70
      entities:
        solar:
          entity: sensor.pv_pv_power
          name: Solar
          icon: mdi:solar-power-variant
          color_icon: true
          display_zero: true
        grid:
          entity: sensor.pv_netzleistung
          name: Netz
          icon: mdi:transmission-tower
          display_state: one_way
          color_circle: color_dynamically
        battery:
          entity: sensor.pv_battery_power
          state_of_charge: sensor.pv_battery
          name: Speicher
          display_state: one_way
          color_circle: color_dynamically
          state_of_charge_decimals: 0
        home:
          entity: sensor.pv_activepower_load_sys
          name: Haus
          icon: mdi:home
          color_icon: true
          override_state: true

    - type: grid
      columns: 2
      square: false
      cards:
        - type: custom:button-card
          template: card_graph
          entity: sensor.pv_pv_power
          variables:
            ulm_card_graph_name: Solar
            ulm_card_graph_icon: mdi:solar-power-variant
            ulm_card_graph_color: var(--color-yellow)
            ulm_card_graph_entity: sensor.pv_pv_power
            ulm_card_graph_type: fill
            ulm_card_graph_hours: 24
        - type: custom:button-card
          template: card_graph
          entity: sensor.pv_activepower_load_sys
          variables:
            ulm_card_graph_name: Verbrauch
            ulm_card_graph_icon: mdi:home-lightning-bolt
            ulm_card_graph_color: var(--color-blue)
            ulm_card_graph_entity: sensor.pv_activepower_load_sys
            ulm_card_graph_type: fill
            ulm_card_graph_hours: 24

    - type: grid
      columns: 2
      square: false
      cards:
        - type: custom:button-card
          template: card_generic
          entity: sensor.pv_today_energy_export
          variables:
            ulm_card_generic_name: Einspeisung heute
            ulm_card_generic_icon: mdi:transmission-tower-export
            ulm_card_generic_color: green
        - type: custom:button-card
          template: card_generic
          entity: sensor.pv_today_energy_import
          variables:
            ulm_card_generic_name: Netzbezug heute
            ulm_card_generic_icon: mdi:transmission-tower-import
            ulm_card_generic_color: red
        - type: custom:button-card
          template: card_generic
          entity: sensor.pv_battery
          variables:
            ulm_card_generic_name: Speicher
            ulm_card_generic_icon: mdi:battery-high
            ulm_card_generic_color: blue
        - type: custom:button-card
          template: card_generic
          entity: sensor.pv_battery_power
          variables:
            ulm_card_generic_name: Batterie Leistung
            ulm_card_generic_icon: mdi:battery-charging
            ulm_card_generic_color: purple

    - type: custom:button-card
      template: card_title
      name: Verlauf
      label: "[[[ return states['input_select.pv_zeitraum'].state ]]]"

    - type: entities
      entities:
        - entity: input_select.pv_zeitraum

    - type: conditional
      conditions:
        - condition: state
          entity: input_select.pv_zeitraum
          state: Live
      card:
        type: custom:mini-graph-card
        name: Live
        hours_to_show: 1
        points_per_hour: 12
        height: 200
        line_width: 3
        animate: true
        lower_bound: 0
        show:
          labels: false
          extrema: false
          legend: true
          icon: false
        entities:
          - entity: sensor.pv_pv_power
            name: Solar
            color: "#f4b400"
            show_fill: true
          - entity: sensor.pv_activepower_load_sys
            name: Verbrauch
            color: "#4285f4"
            show_fill: true
          - entity: sensor.pv_battery_power
            name: Batterie
            color: "#34a853"
            y_axis: secondary

    - type: conditional
      conditions:
        - condition: state
          entity: input_select.pv_zeitraum
          state: 24h
      card:
        type: custom:mini-graph-card
        name: 24 Stunden
        hours_to_show: 24
        points_per_hour: 4
        height: 200
        line_width: 2
        lower_bound: 0
        show:
          labels: false
          extrema: false
          legend: true
          icon: false
        entities:
          - entity: sensor.pv_pv_power
            name: Solar
            color: "#f4b400"
            show_fill: true
          - entity: sensor.pv_activepower_load_sys
            name: Verbrauch
            color: "#4285f4"
          - entity: sensor.pv_battery_power
            name: Batterie
            color: "#34a853"
            y_axis: secondary

    - type: conditional
      conditions:
        - condition: state
          entity: input_select.pv_zeitraum
          state: Woche
      card:
        type: custom:mini-graph-card
        name: Woche
        hours_to_show: 168
        height: 200
        group_by:
          duration: 1h
          func: avg
        line_width: 2
        lower_bound: 0
        show:
          labels: false
          extrema: false
          legend: true
          icon: false
        entities:
          - entity: sensor.pv_pv_power
            name: Solar
            color: "#f4b400"
          - entity: sensor.pv_activepower_load_sys
            name: Verbrauch
            color: "#4285f4"
          - entity: sensor.pv_battery_power
            name: Batterie
            color: "#34a853"
            y_axis: secondary

    - type: conditional
      conditions:
        - condition: state
          entity: input_select.pv_zeitraum
          state: Monat
      card:
        type: custom:mini-graph-card
        name: Monat
        hours_to_show: 720
        height: 200
        group_by:
          duration: 6h
          func: avg
        line_width: 2
        lower_bound: 0
        show:
          labels: false
          extrema: false
          legend: true
          icon: false
        entities:
          - entity: sensor.pv_pv_power
            name: Solar
            color: "#f4b400"
          - entity: sensor.pv_activepower_load_sys
            name: Verbrauch
            color: "#4285f4"
          - entity: sensor.pv_battery_power
            name: Batterie
            color: "#34a853"
            y_axis: secondary

    - type: conditional
      conditions:
        - condition: state
          entity: input_select.pv_zeitraum
          state: Jahr
      card:
        type: custom:mini-graph-card
        name: Jahr
        hours_to_show: 8760
        height: 200
        group_by:
          duration: 1d
          func: avg
        line_width: 2
        lower_bound: 0
        show:
          labels: false
          extrema: false
          legend: true
          icon: false
        entities:
          - entity: sensor.pv_pv_power
            name: Solar
            color: "#f4b400"
          - entity: sensor.pv_activepower_load_sys
            name: Verbrauch
            color: "#4285f4"
          - entity: sensor.pv_battery_power
            name: Batterie
            color: "#34a853"
            y_axis: secondary

    - type: conditional
      conditions:
        - condition: state
          entity: input_select.pv_zeitraum
          state: Lebenslang
      card:
        type: custom:mini-graph-card
        name: Gesamt
        hours_to_show: 8760
        height: 200
        group_by:
          duration: 1d
          func: avg
        line_width: 2
        lower_bound: 0
        show:
          labels: false
          extrema: false
          legend: true
          icon: false
        entities:
          - entity: sensor.pv_pv_power
            name: Solar
            color: "#f4b400"
          - entity: sensor.pv_activepower_load_sys
            name: Verbrauch
            color: "#4285f4"
          - entity: sensor.pv_battery_power
            name: Batterie
            color: "#34a853"
            y_axis: secondary
