- type: custom:mod-card
  card_mod:
    style: |
      ha-card {
        margin: 16px auto 24px auto;
        max-width: 720px;
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
      #root {
        gap: 14px;
      }
  card:
    type: vertical-stack
    cards:
      - type: custom:button-card
        template: card_title
        name: Küche
        label: Licht & Klima

      - type: custom:button-card
        template: card_title
        name: Beleuchtung

      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              overflow: hidden;
            }
        card:
          type: custom:auto-entities
          show_empty: false
          sort:
            method: friendly_name
          card:
            type: grid
            columns: 1
            square: false
          card_param: cards
          filter:
            include:
              - domain: light
                name: "*üche*"
                options:
                  type: custom:button-card
                  template: card_light
                  entity: "[[[ return entity.entity_id ]]]"
                  variables:
                    ulm_card_light_enable_slider: true

      - type: custom:button-card
        template: card_title
        name: Klima

      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              overflow: hidden;
            }
        card:
          type: tile
          entity: climate.raum_neben_der_kuche_klimaanlage
          name: Klimaanlage
          icon: mdi:snowflake
          features:
            - type: climate-hvac-modes

      - type: custom:button-card
        template: card_title
        name: Dreame

      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              overflow: hidden;
            }
        card:
          type: custom:button-card
          template: card_vertical_button
          entity: script.dreame_reinigen_kueche
          name: Küche reinigen
          tap_action:
            action: call-service
            service: script.turn_on
            target:
              entity_id: script.dreame_reinigen_kueche
