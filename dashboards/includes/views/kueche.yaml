- type: vertical-stack
  cards:
    - type: custom:button-card
      template: card_title
      name: Küche
      label: Licht & Klima

    - type: custom:auto-entities
      show_empty: false
      sort:
        method: friendly_name
      card:
        type: grid
        columns: 1
        square: false
      card_param: cards
      filter:
        include:
          - domain: light
            name: "*üche*"
            options:
              type: tile
              icon: mdi:ceiling-light
              features:
                - type: light-brightness

    - type: tile
      entity: climate.raum_neben_der_kuche_klimaanlage
      name: Klimaanlage
      icon: mdi:snowflake
      features:
        - type: climate-hvac-modes

    - type: custom:button-card
      template: card_vertical_button
      entity: script.dreame_reinigen_kueche
      name: Küche reinigen
      tap_action:
        action: call-service
        service: script.turn_on
        target:
          entity_id: script.dreame_reinigen_kueche
