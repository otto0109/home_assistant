- type: custom:mod-card
  card_mod:
    style: |
      ha-card {
        margin: 16px auto 24px auto;
        max-width: 720px;
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
      #root {
        gap: 14px;
      }
  card:
    type: vertical-stack
    cards:
      - type: custom:button-card
        template: card_title
        name: Küche
        label: Licht & Klima

      - type: custom:button-card
        template: card_title
        name: Beleuchtung

      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              overflow: hidden;
            }
        card:
          type: custom:auto-entities
          show_empty: false
          sort:
            method: friendly_name
          card:
            type: grid
            columns: 1
            square: false
          card_param: cards
          filter:
            include:
              - domain: light
                name: "*üche*"
                options:
                  type: custom:mushroom-light-card
                  fill_container: true
                  show_brightness_control: true
                  use_light_color: true

      - type: custom:button-card
        template: card_title
        name: Klima

      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              overflow: hidden;
              background: var(--ha-card-background) !important;
            }
        card:
          type: custom:button-card
          template: card_thermostat
          entity: climate.raum_neben_der_kuche_klimaanlage
          name: Klimaanlage
          variables:
            ulm_card_thermostat_enable_collapse: false
            ulm_card_thermostat_enable_controls: true
            ulm_card_thermostat_enable_hvac_modes: true
            ulm_card_thermostat_enable_popup: true
            ulm_card_thermostat_enable_background_color: false
          extra_styles: |
            ha-card {
              background: var(--ha-card-background) !important;
            }

      - type: custom:button-card
        template: card_title
        name: Dreame

      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              overflow: hidden;
            }
        card:
          type: custom:button-card
          template: card_vertical_button
          entity: script.dreame_reinigen_kueche
          name: Küche reinigen
          tap_action:
            action: call-service
            service: script.turn_on
            target:
              entity_id: script.dreame_reinigen_kueche
