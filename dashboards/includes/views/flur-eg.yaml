- type: custom:mod-card
  card_mod:
    style: |
      ha-card {
        margin: 16px auto 24px auto;
        max-width: 720px;
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
      #root {
        gap: 14px;
      }
  card:
    type: vertical-stack
    cards:
      - type: custom:button-card
        template: card_title
        name: Flur EG
        label: Erdgeschoss

      - type: custom:button-card
        template: card_title
        name: Beleuchtung

      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              overflow: hidden;
            }
        card:
          type: custom:button-card
          template: card_power_outlet
          entity: switch.shelly_1_mini_gen4
          name: Flur unten
          icon: mdi:ceiling-light

      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              overflow: hidden;
            }
        card:
          type: custom:button-card
          template: card_power_outlet
          entity: switch.licht_abstellraum_unten_sonoff
          name: Abstellraum unten
          icon: mdi:warehouse

      - type: custom:button-card
        template: card_title
        name: Dreame

      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              overflow: hidden;
            }
        card:
          type: custom:button-card
          template: card_vertical_button
          entity: script.dreame_reinigen_flur_eg
          name: Flur EG reinigen
          tap_action:
            action: call-service
            service: script.turn_on
            target:
              entity_id: script.dreame_reinigen_flur_eg
