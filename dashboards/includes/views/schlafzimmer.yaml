- type: vertical-stack
  cards:
    - type: custom:button-card
      template: card_title
      name: Schlafzimmer
      label: Licht & Klima

    - type: custom:button-card
      template: card_title
      name: Beleuchtung

    - type: custom:auto-entities
      show_empty: false
      sort:
        method: friendly_name
      card:
        type: grid
        columns: 1
        square: false
      card_param: cards
      filter:
        include:
          - domain: light
            name: "*Schlafzimmer*"
            options:
              type: custom:button-card
              template: card_light
              entity: "[[[ return entity.entity_id ]]]"
              variables:
                ulm_card_light_enable_slider: true
          - domain: light
            name: "*schlafzimmer*"
            options:
              type: custom:button-card
              template: card_light
              entity: "[[[ return entity.entity_id ]]]"
              variables:
                ulm_card_light_enable_slider: true

    - type: custom:button-card
      template: card_title
      name: Klima

    - !include fragments/climate-schlafzimmer.yaml
