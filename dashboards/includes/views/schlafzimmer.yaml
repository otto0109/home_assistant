- type: vertical-stack
  cards:
    - type: custom:button-card
      template: card_title
      name: Schlafzimmer
      label: Licht & Klima

    - type: custom:auto-entities
      show_empty: false
      sort:
        method: friendly_name
      card:
        type: grid
        columns: 1
        square: false
      card_param: cards
      filter:
        include:
          - domain: light
            name: "*Schlafzimmer*"
            options:
              type: tile
              icon: mdi:floor-lamp
              features:
                - type: light-brightness
          - domain: light
            name: "*schlafzimmer*"
            options:
              type: tile
              icon: mdi:floor-lamp
              features:
                - type: light-brightness

    - type: tile
      entity: climate.schlafzimmer_klimaanlage
      name: Klimaanlage
      icon: mdi:snowflake
      features:
        - type: climate-hvac-modes
