- type: custom:mod-card
  card_mod:
    style: |
      ha-card {
        margin: 16px auto 24px auto;
        max-width: 720px;
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
      #root {
        gap: 14px;
      }
  card:
    type: vertical-stack
    cards:
      - type: custom:button-card
        template: card_title
        name: Garten
        label: Außen & Bewässerung

      - type: custom:button-card
        template: card_title
        name: Beleuchtung

      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              overflow: hidden;
            }
        card:
          type: custom:auto-entities
          show_empty: false
          sort:
            method: friendly_name
          card:
            type: grid
            columns: 1
            square: false
          card_param: cards
          filter:
            include:
              - domain: light
                name: "*Garten*"
                options:
                  type: custom:mushroom-light-card
                  fill_container: true
                  show_brightness_control: true
                  use_light_color: true
              - domain: light
                name: "*Außen*"
                options:
                  type: custom:mushroom-light-card
                  fill_container: true
                  show_brightness_control: true
                  use_light_color: true

      - type: custom:button-card
        template: card_title
        name: Bewässerung

      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              overflow: hidden;
            }
        card:
          type: custom:button-card
          template: card_power_outlet
          entity: switch.automatisch_bewasserung
          name: Automatisch draußen
          icon: mdi:sprinkler-variant
