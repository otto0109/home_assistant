- type: vertical-stack
  cards:
    - type: custom:button-card
      template: card_title
      name: Garten
      label: Außen & Bewässerung

    - type: custom:button-card
      template: card_title
      name: Beleuchtung

    - type: custom:auto-entities
      show_empty: false
      card:
        type: grid
        columns: 1
        square: false
      card_param: cards
      filter:
        include:
          - domain: light
            name: "*Garten*"
            options:
              type: custom:button-card
              template: card_light
              entity: "[[[ return entity.entity_id ]]]"
              variables:
                ulm_card_light_enable_slider: true
          - domain: light
            name: "*Außen*"
            options:
              type: custom:button-card
              template: card_light
              entity: "[[[ return entity.entity_id ]]]"
              variables:
                ulm_card_light_enable_slider: true

    - type: custom:button-card
      template: card_title
      name: Bewässerung

    - type: custom:button-card
      template: card_power_outlet
      entity: switch.automatisch_bewasserung
      name: Automatisch draußen
      icon: mdi:sprinkler-variant
