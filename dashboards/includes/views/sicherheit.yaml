- type: vertical-stack
  cards:
    - type: custom:button-card
      template: card_title
      name: Sicherheit
      label: Sensoren & Kontakte

    - type: custom:auto-entities
      show_empty: false
      card:
        type: grid
        columns: 2
        square: false
      card_param: cards
      filter:
        include:
          - domain: binary_sensor
            attributes:
              device_class: window
            options:
              type: custom:button-card
              template: card_binary_sensor_alert
              variables:
                ulm_card_binary_sensor_alert: true
          - domain: binary_sensor
            attributes:
              device_class: door
            options:
              type: custom:button-card
              template: card_binary_sensor_alert
              variables:
                ulm_card_binary_sensor_alert: true
          - domain: binary_sensor
            attributes:
              device_class: smoke
            options:
              type: custom:button-card
              template: card_binary_sensor_alert
              variables:
                ulm_card_binary_sensor_alert: true
          - domain: binary_sensor
            attributes:
              device_class: moisture
            options:
              type: custom:button-card
              template: card_binary_sensor_alert
              variables:
                ulm_card_binary_sensor_alert: true
          - domain: binary_sensor
            attributes:
              device_class: motion
            options:
              type: custom:button-card
              template: card_binary_sensor_alert
              variables:
                ulm_card_binary_sensor_alert: true

    - type: custom:button-card
      template: card_title
      name: Batterie niedrig
      label: Geräte unter 20 %

    - type: custom:auto-entities
      show_empty: false
      card:
        type: grid
        columns: 2
        square: false
      card_param: cards
      filter:
        include:
          - domain: sensor
            attributes:
              device_class: battery
            state: "< 20"
            options:
              type: custom:button-card
              template: card_battery
              variables:
                ulm_card_battery_battery_state_entity_id: this.entity_id
                ulm_card_battery_battery_level_danger: 20
                ulm_card_battery_battery_level_warning: 50
