- type: custom:mod-card
  card_mod:
    style: |
      ha-card {
        margin: 16px auto 24px auto;
        max-width: 720px;
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
      #root {
        gap: 14px;
      }
  card:
    type: vertical-stack
    cards:
    - type: custom:button-card
      template: card_title
      name: Sicherheit
      label: Sensoren & Anwesenheitssimulation

    - type: custom:mod-card
      card_mod:
        style: |
          ha-card {
            border-radius: 20px;
            overflow: hidden;
          }
      card:
        type: vertical-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: input_boolean.sicherheitsmodus_aktiv
            name: Anwesenheitssimulation
            icon: mdi:shield-home
            fill_container: true
          - type: custom:mushroom-entity-card
            entity: sensor.sicherheitsmodus_lichter
            name: Sichtbare Lampen
            icon: mdi:lightbulb-group
            fill_container: true
          - type: custom:mushroom-template-card
            primary: Status
            secondary: >-
              {% if is_state('input_boolean.sicherheitsmodus_aktiv', 'on') %}
              Aktiv — zufällige Lampen bis Home-Zone
              {% else %}
              Inaktiv — startet ab Sonnenuntergang wenn niemand da
              {% endif %}
            icon: mdi:information-outline
            fill_container: true
            tap_action:
              action: more-info
              entity: input_boolean.sicherheitsmodus_aktiv

    - type: custom:button-card
      template: card_title
      name: Kontakte & Sensoren
    - type: custom:auto-entities
      show_empty: false
      card:
        type: grid
        columns: 2
        square: false
      card_param: cards
      filter:
        include:
          - domain: binary_sensor
            attributes:
              device_class: window
            options:
              type: custom:button-card
              template: card_binary_sensor_alert
              variables:
                ulm_card_binary_sensor_alert: true
          - domain: binary_sensor
            attributes:
              device_class: door
            options:
              type: custom:button-card
              template: card_binary_sensor_alert
              variables:
                ulm_card_binary_sensor_alert: true
          - domain: binary_sensor
            attributes:
              device_class: smoke
            options:
              type: custom:button-card
              template: card_binary_sensor_alert
              variables:
                ulm_card_binary_sensor_alert: true
          - domain: binary_sensor
            attributes:
              device_class: moisture
            options:
              type: custom:button-card
              template: card_binary_sensor_alert
              variables:
                ulm_card_binary_sensor_alert: true
          - domain: binary_sensor
            attributes:
              device_class: motion
            options:
              type: custom:button-card
              template: card_binary_sensor_alert
              variables:
                ulm_card_binary_sensor_alert: true

    - type: custom:button-card
      template: card_title
      name: Batterie niedrig
      label: Geräte unter 20 %

    - type: custom:auto-entities
      show_empty: false
      card:
        type: grid
        columns: 2
        square: false
      card_param: cards
      filter:
        include:
          - domain: sensor
            attributes:
              device_class: battery
            state: "< 20"
            options:
              type: custom:button-card
              template: card_battery
              variables:
                ulm_card_battery_battery_state_entity_id: this.entity_id
                ulm_card_battery_battery_level_danger: 20
                ulm_card_battery_battery_level_warning: 50
