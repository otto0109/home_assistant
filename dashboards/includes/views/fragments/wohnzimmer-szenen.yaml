# Explizite Szenen-Buttons (auto-entities ohne entity erzeugt Konfigurationsfehler)
- type: grid
  columns: 2
  square: false
  cards:
    - type: custom:button-card
      template: card_vertical_button
      name: Voll
      icon: mdi:ceiling-light
      tap_action:
        action: call-service
        service: scene.turn_on
        target:
          entity_id: scene.wohnzimmer_volle_beluechtung
    - type: custom:button-card
      template: card_vertical_button
      name: TV
      icon: mdi:television
      tap_action:
        action: call-service
        service: scene.turn_on
        target:
          entity_id: scene.wohnzimmer_fehrnsehen
