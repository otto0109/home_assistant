- type: vertical-stack
  cards:
    - type: custom:button-card
      template: card_title
      name: Wohnzimmer
      label: Licht & Szenen

    - type: custom:button-card
      template: card_title
      name: Szenen

    - type: grid
      columns: 2
      square: false
      cards:
        - type: tile
          entity: scene.wohnzimmer_volle_beluechtung
          name: Voll
          icon: mdi:ceiling-light
        - type: tile
          entity: scene.wohnzimmer_fehrnsehen
          name: TV
          icon: mdi:television

    - type: custom:button-card
      template: card_title
      name: Beleuchtung

    - type: tile
      entity: light.licht_wohnzimmer
      name: Licht Wohnzimmer
      icon: mdi:floor-lamp
      features:
        - type: light-brightness
