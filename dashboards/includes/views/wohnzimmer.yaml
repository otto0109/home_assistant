- type: custom:mod-card
  card_mod:
    style: |
      ha-card {
        margin: 16px auto 24px auto;
        max-width: 720px;
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
      #root {
        gap: 14px;
      }
  card:
    type: vertical-stack
    cards:
      - type: custom:button-card
        template: card_title
        name: Wohnzimmer
        label: Licht & Szenen

      - type: custom:button-card
        template: card_title
        name: Szenen

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mod-card
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px;
                  overflow: hidden;
                }
            card:
              type: custom:button-card
              template: card_vertical_button
              entity: scene.wohnzimmer_volle_beluechtung
              name: Voll
              icon: mdi:ceiling-light
              tap_action:
                action: call-service
                service: scene.turn_on
                target:
                  entity_id: scene.wohnzimmer_volle_beluechtung
          - type: custom:mod-card
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px;
                  overflow: hidden;
                }
            card:
              type: custom:button-card
              template: card_vertical_button
              entity: scene.wohnzimmer_fehrnsehen
              name: TV
              icon: mdi:television
              tap_action:
                action: call-service
                service: scene.turn_on
                target:
                  entity_id: scene.wohnzimmer_fehrnsehen

      - type: custom:button-card
        template: card_title
        name: Beleuchtung

      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              overflow: hidden;
            }
        card:
          type: custom:mushroom-light-card
          entity: light.licht_wohnzimmer
          name: Licht Wohnzimmer
          fill_container: true
          show_brightness_control: true
          use_light_color: true

      - type: custom:button-card
        template: card_title
        name: Dreame

      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              overflow: hidden;
            }
        card:
          type: custom:button-card
          template: card_vertical_button
          entity: script.dreame_reinigen_wohnzimmer
          name: Wohnzimmer reinigen
          tap_action:
            action: call-service
            service: script.turn_on
            target:
              entity_id: script.dreame_reinigen_wohnzimmer
