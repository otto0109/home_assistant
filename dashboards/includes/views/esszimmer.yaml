- type: custom:mod-card
  card_mod:
    style: |
      ha-card {
        margin: 16px auto 24px auto;
        max-width: 720px;
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
      #root {
        gap: 14px;
      }
  card:
    type: vertical-stack
    cards:
      - type: custom:button-card
        template: card_title
        name: Esszimmer
        label: Licht & Klima

      - type: custom:button-card
        template: card_title
        name: Beleuchtung

      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              overflow: hidden;
            }
        card:
          type: custom:mushroom-light-card
          entity: light.beleuchtung_bett_leuchte
          name: Lampe
          fill_container: true
          show_brightness_control: true
          use_light_color: true

      - type: custom:button-card
        template: card_title
        name: Klima

      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              overflow: hidden;
            }
        card:
          type: custom:button-card
          template: card_thermostat
          entity: climate.esszimmer_klimaanlage
          name: Klimaanlage
          variables:
            ulm_card_thermostat_enable_collapse: false
            ulm_card_thermostat_enable_controls: true
            ulm_card_thermostat_enable_hvac_modes: true
            ulm_card_thermostat_enable_popup: true
            ulm_card_thermostat_enable_background_color: false

      - type: custom:button-card
        template: card_title
        name: Dreame

      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              overflow: hidden;
            }
        card:
          type: custom:button-card
          template: card_vertical_button
          entity: script.dreame_reinigen_esszimmer
          name: Esszimmer reinigen
          tap_action:
            action: call-service
            service: script.turn_on
            target:
              entity_id: script.dreame_reinigen_esszimmer
