- type: vertical-stack
  cards:
    - type: custom:button-card
      template: card_title
      name: Esszimmer
      label: Licht & Klima

    - type: custom:button-card
      template: card_title
      name: Beleuchtung

    - type: custom:button-card
      template: card_light
      entity: light.beleuchtung_bett_leuchte
      variables:
        ulm_card_light_enable_slider: true
        ulm_card_light_enable_color: true

    - type: custom:button-card
      template: card_title
      name: Klima

    - !include fragments/climate-esszimmer.yaml

    - type: custom:button-card
      template: card_vertical_button
      entity: script.dreame_reinigen_esszimmer
      name: Esszimmer reinigen
      icon: mdi:broom
      tap_action:
        action: call-service
        service: script.turn_on
        target:
          entity_id: script.dreame_reinigen_esszimmer
