- type: vertical-stack
  cards:
    - type: custom:button-card
      template: card_title
      name: Esszimmer
      label: Licht & Klima

    - type: tile
      entity: light.beleuchtung_bett_leuchte
      name: Lampe
      icon: mdi:chandelier
      features:
        - type: light-brightness

    - type: tile
      entity: climate.esszimmer_klimaanlage
      name: Klimaanlage
      icon: mdi:snowflake
      features:
        - type: climate-hvac-modes

    - type: custom:button-card
      template: card_vertical_button
      entity: script.dreame_reinigen_esszimmer
      name: Esszimmer reinigen
      tap_action:
        action: call-service
        service: script.turn_on
        target:
          entity_id: script.dreame_reinigen_esszimmer
