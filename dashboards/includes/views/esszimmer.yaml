- type: custom:button-card
  template: card_title
  name: Esszimmer
  label: Licht & Klima

- type: custom:auto-entities
  show_empty: false
  sort:
    method: friendly_name
  card:
    type: grid
    columns: 2
    square: false
  card_param: cards
  filter:
    include:
      - domain: scene
        name: "*Esszimmer*"
        options:
          type: custom:button-card
          template: card_vertical_button
          icon: mdi:palette-outline
          tap_action:
            action: call-service
            service: scene.turn_on
            data:
              entity_id: this.entity_id

- type: custom:button-card
  template: card_light
  entity: light.beleuchtung_bett_leuchte
  variables:
    ulm_card_light_enable_slider: true
    ulm_card_light_enable_color: true

- type: custom:button-card
  template: card_thermostat
  entity: climate.esszimmer_klimaanlage

- type: custom:button-card
  template: card_vertical_button
  name: Esszimmer reinigen
  icon: mdi:broom
  tap_action:
    action: call-service
    service: script.turn_on
    service_data:
      entity_id: script.dreame_reinigen_esszimmer
