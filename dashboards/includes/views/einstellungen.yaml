- type: custom:button-card
  template: card_title
  name: Einstellungen
  label: Personen & System

- type: horizontal-stack
  cards:
    - type: custom:button-card
      template: card_person
      entity: person.thorge
      variables:
        ulm_card_person_entity: person.thorge
        ulm_card_person_use_entity_picture: true
        ulm_card_person_battery: sensor.pixel_9_pro_xl_battery_level
    - type: custom:button-card
      template: card_person
      entity: person.laura
      variables:
        ulm_card_person_entity: person.laura
        ulm_card_person_use_entity_picture: true
        ulm_card_person_battery: sensor.pixel_7_pro_battery_level

- type: custom:button-card
  template: card_weather
  entity: weather.wetter_home
  variables:
    ulm_card_weather_enable_popup: true

- type: custom:button-card
  template: card_title
  name: Wetter
  label: "[[[ return states['input_select.wetter_ansicht'].state ]]]"

- type: horizontal-stack
  cards:
    - type: custom:button-card
      template: card_vertical_button
      name: Stündlich
      icon: mdi:weather-partly-cloudy
      tap_action:
        action: call-service
        service: input_select.select_option
        data:
          entity_id: input_select.wetter_ansicht
          option: Stündlich
    - type: custom:button-card
      template: card_vertical_button
      name: Täglich
      icon: mdi:calendar
      tap_action:
        action: call-service
        service: input_select.select_option
        data:
          entity_id: input_select.wetter_ansicht
          option: Täglich

- type: conditional
  conditions:
    - condition: state
      entity: input_select.wetter_ansicht
      state: Stündlich
  card:
    type: weather-forecast
    entity: weather.wetter_home
    forecast_type: hourly

- type: conditional
  conditions:
    - condition: state
      entity: input_select.wetter_ansicht
      state: Täglich
  card:
    type: weather-forecast
    entity: weather.wetter_home
    forecast_type: daily

- type: custom:button-card
  template: card_title
  name: Standorte

- type: map
  entities:
    - entity: person.thorge
    - entity: person.laura
  theme_mode: auto
  aspect_ratio: "16:9"

- type: custom:button-card
  template: card_title
  name: Kalender

- type: calendar
  entities:
    - calendar.thorge_3_laura
  initial_view: listWeek
