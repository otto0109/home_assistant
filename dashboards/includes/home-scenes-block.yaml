- type: custom:button-card
  template: card_title
  name: Szenen

- type: custom:auto-entities
  show_empty: false
  card:
    type: grid
    columns: 3
    square: false
  card_param: cards
  filter:
    template: |
      {% set ns = namespace(cards=[]) %}
      {% set hues = [
        'blue', 'pink', 'yellow', 'green', 'red', 'purple', 'grey',
        'orange', 'teal', 'cyan', 'indigo', 'lime', 'brown',
        'deep_orange', 'amber', 'light_blue', 'deep_purple'
      ] %}
      {% for e in states.scene | sort(attribute='friendly_name') %}
        {% if ns.cards | length < 5 %}
          {% set eid = e.entity_id %}
          {% if states(eid) not in ['unavailable', 'unknown'] %}
            {% set slug = eid.split('.')[1] | default('') %}
            {% set hash = namespace(v=0) %}
            {% for ch in slug %}
              {% set hash.v = (hash.v * 31 + loop.index0) %}
            {% endfor %}
            {% set hash.v = hash.v + (slug | length) * 17 %}
            {% set hue = hues[hash.v % (hues | length)] %}
            {% set ns.cards = ns.cards + [{
              'type': 'custom:button-card',
              'template': 'scene_tile_' ~ hue,
              'entity': eid,
              'tap_action': {
                'action': 'perform-action',
                'perform_action': 'scene.turn_on',
                'target': {'entity_id': eid}
              }
            }] %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ ns.cards }}

- type: custom:button-card
  name: Alle aus
  icon: mdi:lightbulb-off-outline
  show_name: true
  show_icon: true
  show_state: false
  styles:
    card:
      - border-radius: var(--border-radius)
      - box-shadow: var(--box-shadow)
      - padding: 14px 0 10px
    grid:
      - grid-template-areas: "'i' 'n'"
    name:
      - justify-self: center
      - font-weight: bold
      - font-size: 15px
      - margin-top: 12px
    img_cell:
      - width: 50px
      - height: 50px
      - border-radius: 50%
      - background-color: rgba(var(--color-red), 0.2)
    icon:
      - color: rgba(var(--color-red), 1)
      - width: 24px
  tap_action:
    action: call-service
    service: script.turn_on
    target:
      entity_id: script.alle_lichter_aus
