- type: custom:button-card
  template: card_title
  name: Szenen

# Nur explizit gelistete Szenen (scenes.yaml). Weitere Karten unten manuell ergänzen.
- type: custom:auto-entities
  show_empty: false
  card:
    type: grid
    columns: 3
    square: false
  card_param: cards
  filter:
    template: |
      {% set ns = namespace(cards=[]) %}
      {% set scene_ids = [
        'scene.wohnzimmer_volle_beluechtung',
        'scene.wohnzimmer_fehrnsehen'
      ] %}
      {% set hues = [
        'blue', 'pink', 'yellow', 'green', 'red', 'purple', 'grey',
        'orange', 'teal', 'cyan', 'indigo', 'lime', 'brown',
        'deep_orange', 'amber', 'light_blue', 'deep_purple'
      ] %}
      {% for eid in scene_ids %}
        {% if eid in states and states(eid) != 'unavailable' %}
          {% set slug = eid.split('.')[1] | default('') %}
          {% set hash = namespace(v=0) %}
          {% for ch in slug %}
            {% set hash.v = (hash.v * 31 + loop.index0) %}
          {% endfor %}
          {% set hash.v = hash.v + (slug | length) * 17 %}
          {% set hue = hues[hash.v % (hues | length)] %}
          {% set ns.cards = ns.cards + [{
            'type': 'custom:button-card',
            'template': 'scene_tile_' ~ hue,
            'entity': eid,
            'name': state_attr(eid, 'friendly_name') or eid,
            'tap_action': {
              'action': 'perform-action',
              'perform_action': 'scene.turn_on',
              'target': {'entity_id': eid}
            }
          }] %}
        {% endif %}
      {% endfor %}
      {{ ns.cards }}

# Beispiel Esszimmer (Entity-ID anpassen, Template-Farbe frei wählen):
# - type: custom:button-card
#   template: scene_tile_pink
#   entity: scene.deine_esszimmer_szene
