# Eine Kachel pro HA-Bereich — neue Bereiche erscheinen automatisch,
# sobald mindestens eine Entität zugeordnet ist.
type: custom:auto-entities
show_empty: false
card_param: cards
card:
  type: vertical-stack
filter:
  template: |
    {% set ns = namespace(items=[]) %}
    {% set domains = ['light', 'climate', 'switch', 'script', 'fan', 'cover'] %}
    {% for area in areas() | sort %}
      {% set picked = namespace(id=none) %}
      {% for domain in domains %}
        {% if picked.id is none %}
          {% for e in states[domain] | sort(attribute='entity_id') %}
            {% if area_id(e.entity_id) == area %}
              {% set picked.id = e.entity_id %}
            {% endif %}
          {% endfor %}
        {% endif %}
      {% endfor %}
      {% if picked.id is not none %}
        {% set ns.items = ns.items + [picked.id] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}
options:
  type: custom:button-card
  template:
    - card_room
    - grey_no_state
  name: "[[[ const id = entity.entity_id; const aid = hass.entities[id]?.area_id; return aid && hass.areas[aid] ? hass.areas[aid].name : entity.attributes.friendly_name; ]]]"
  tap_action: "[[[ const id = entity.entity_id; const aid = hass.entities[id]?.area_id; const n = aid && hass.areas[aid] ? hass.areas[aid].name : ''; if (n) hass.callService('input_text', 'set_value', { entity_id: 'input_text.dashboard_active_area', value: n }); return { action: 'navigate', navigation_path: 'raum' }; ]]]"
  variables:
    label_use_temperature: "[[[ return entity.entity_id.startsWith('climate.'); ]]]"
    label_use_brightness: "[[[ return entity.entity_id.startsWith('light.'); ]]]"
