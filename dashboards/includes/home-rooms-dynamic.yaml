# Eine Kachel pro HA-Bereich — ohne button-card-JS (stabiler mit auto-entities).
type: custom:auto-entities
show_empty: false
card_param: cards
card:
  type: vertical-stack
filter:
  template: |
    {% set ns = namespace(items=[]) %}
    {% set domains = ['light', 'climate', 'switch', 'script', 'fan', 'cover'] %}
    {% for area in areas() | sort %}
      {% set picked = namespace(id=none) %}
      {% for domain in domains %}
        {% if picked.id is none %}
          {% for e in states[domain] | sort(attribute='entity_id') %}
            {% if area_id(e.entity_id) == area %}
              {% set picked.id = e.entity_id %}
            {% endif %}
          {% endfor %}
        {% endif %}
      {% endfor %}
      {% if picked.id is not none %}
        {% set ns.items = ns.items + [picked.id] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}
options:
  type: custom:mushroom-template-card
  layout: vertical
  fill_container: true
  primary: "{{ area_name(area_id(entity)) }}"
  secondary: "{{ states(entity) }}"
  icon: >-
    {% set d = entity.split('.')[0] %}
    {% if d == 'climate' %}mdi:thermometer
    {% elif d == 'light' %}mdi:lightbulb
    {% elif d == 'switch' %}mdi:light-switch
    {% elif d == 'script' %}mdi:script-text
    {% elif d == 'fan' %}mdi:fan
    {% elif d == 'cover' %}mdi:window-shutter
    {% else %}mdi:home-floor-1{% endif %}
  icon_color: >-
    {% set d = entity.split('.')[0] %}
    {% if d == 'climate' %}blue
    {% elif d == 'light' %}amber
    {% elif d == 'switch' %}grey
    {% else %}green{% endif %}
  card_mod:
    style: |
      ha-card {
        border-radius: var(--border-radius, 20px);
        min-height: 148px;
        height: 100%;
      }
  tap_action:
    action: call-service
    service: script.dashboard_raum_oeffnen
    data:
      entity_id: "{{ entity }}"
