# EXPERIMENTELL — auto-entities + layout-card zeigt auf manchen Systemen leer.
# Aktiv: dashboards/includes/ulm-rooms.yaml (statische ULM-Karten).
#
# Zum Testen in home-main.yaml ulm-rooms.yaml durch diese Datei ersetzen.
type: custom:auto-entities
show_empty: false
card_param: cards
card:
  type: custom:layout-card
  layout_type: custom:grid-layout
  layout:
    grid-gap: 16px
    grid-template-columns: repeat(2, 1fr)
    mediaquery:
      "(min-width: 900px)":
        grid-template-columns: repeat(3, 1fr)
filter:
  template: |
    {% set ns = namespace(items=[]) %}
    {% set domains = ['light', 'climate', 'switch', 'script', 'fan', 'cover'] %}
    {% for area in areas() | sort %}
      {% set picked = namespace(id=none) %}
      {% for domain in domains %}
        {% if picked.id is none %}
          {% for e in states[domain] | sort(attribute='entity_id') %}
            {% if area_id(e.entity_id) == area %}
              {% set picked.id = e.entity_id %}
            {% endif %}
          {% endfor %}
        {% endif %}
      {% endfor %}
      {% if picked.id is not none %}
        {% set ns.items = ns.items + [picked.id] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}
options:
  type: custom:button-card
  template:
    - card_room
    - grey_no_state
  variables:
    label_use_temperature: false
    label_use_brightness: false
  tap_action:
    action: call-service
    service: script.dashboard_raum_oeffnen
    service_data:
      entity_id: "[[[ return entity.entity_id; ]]]"
