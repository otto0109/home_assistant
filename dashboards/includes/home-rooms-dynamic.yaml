# Dynamische Raumkacheln — eine pro HA-Bereich, Icons aus der Bereichskonfiguration.
# mushroom-template-card (kompatibel mit Mushroom v2.x auf deinem System).
type: custom:auto-entities
show_empty: false
card_param: card
card:
  type: custom:mushroom-template-card
  layout: vertical
  fill_container: true
filter:
  template: |
    {% set ns = namespace(items=[]) %}
    {% set domains = ['light', 'climate', 'switch', 'script', 'fan', 'cover'] %}
    {% for area in areas() | sort %}
      {% set picked = namespace(id=none) %}
      {% for domain in domains %}
        {% if picked.id is none %}
          {% for e in states[domain] | sort(attribute='entity_id') %}
            {% if area_id(e.entity_id) == area %}
              {% set picked.id = e.entity_id %}
            {% endif %}
          {% endfor %}
        {% endif %}
      {% endfor %}
      {% if picked.id is not none %}
        {% set ns.items = ns.items + [picked.id] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}
options:
  primary: "{{ area_name(area_id(entity)) }}"
  secondary: "{{ states(entity) }}"
  icon: "{{ area_icon(area_id(entity)) or 'mdi:home-floor-1' }}"
  tap_action:
    action: call-service
    service: script.dashboard_raum_oeffnen
    service_data:
      entity_id: "{{ entity }}"
