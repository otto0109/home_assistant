# Decluttering-Templates für Raum-Subviews.
# Entitäten in HA den Bereichen zuordnen (Einstellungen → Bereiche & Stockwerke).

room_dynamic_page:
  card:
    type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          margin: 16px auto 24px auto;
          max-width: 720px;
          background: transparent !important;
          box-shadow: none !important;
          border: none !important;
        }
        #root {
          gap: 14px;
        }
    card:
      type: vertical-stack
      cards:
        - type: markdown
          content: |
            {% set aid = states('input_text.dashboard_active_area') %}
            ## {{ area_name(aid) if aid not in ['unknown', 'unavailable', ''] else 'Raum' }}
          card_mod:
            style: |
              ha-card {
                background: transparent !important;
                box-shadow: none !important;
                border: none !important;
                padding: 0 0 4px 0;
              }
              h2 {
                margin: 0;
                font-size: 1.35rem;
                font-weight: 600;
              }
        - !include room-auto-content-active.yaml

room_page:
  variables:
    - area
    - title
    - label
  card:
    type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          margin: 16px auto 24px auto;
          max-width: 720px;
          background: transparent !important;
          box-shadow: none !important;
          border: none !important;
        }
        #root {
          gap: 14px;
        }
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: card_title
          name: "[[title]]"
          label: "[[label]]"
        - type: custom:decluttering-card
          template: room_auto_content
          variables:
            - area: "[[area]]"

room_auto_content:
  variables:
    - area
  card:
    type: vertical-stack
    cards:
      - type: custom:button-card
        template: card_title
        name: Szenen

      - type: custom:auto-entities
        show_empty: false
        sort:
          method: friendly_name
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          template: !include scene-tiles-named-filter.yaml

      - type: custom:button-card
        template: card_title
        name: Beleuchtung

      - type: custom:auto-entities
        show_empty: false
        unique: true
        sort:
          method: friendly_name
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          include: !include lighting-filter-includes.yaml

      - type: custom:button-card
        template: card_title
        name: Schalter

      - type: custom:auto-entities
        show_empty: false
        sort:
          method: friendly_name
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          include:
            - domain: switch
              area: "[[area]]"
              options:
                type: custom:button-card
                template: card_power_outlet
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px;
                      overflow: hidden;
                    }
          exclude: !include lighting-filter-excludes.yaml

      - type: custom:button-card
        template: card_title
        name: Klima

      - type: custom:auto-entities
        show_empty: false
        sort:
          method: friendly_name
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          include:
            - domain: climate
              area: "[[area]]"
              options:
                type: custom:button-card
                template: card_thermostat
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px;
                      overflow: hidden;
                      background: var(--ha-card-background) !important;
                    }
                variables:
                  ulm_card_thermostat_enable_collapse: false
                  ulm_card_thermostat_enable_controls: true
                  ulm_card_thermostat_enable_hvac_modes: true
                  ulm_card_thermostat_enable_popup: true
                  ulm_card_thermostat_enable_background_color: false
                extra_styles: |
                  ha-card {
                    background: var(--ha-card-background) !important;
                  }

      - type: custom:button-card
        template: card_title
        name: Aktionen

      - type: custom:auto-entities
        show_empty: false
        sort:
          method: friendly_name
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          include:
            - domain: script
              area: "[[area]]"
              options:
                type: custom:button-card
                template: card_vertical_button
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px;
                      overflow: hidden;
                    }
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on

      - type: custom:button-card
        template: card_title
        name: Geräte

      - type: custom:auto-entities
        show_empty: false
        sort:
          method: friendly_name
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          include:
            - domain: fan
              area: "[[area]]"
              options:
                type: custom:mushroom-entity-card
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px;
                      overflow: hidden;
                    }
            - domain: cover
              area: "[[area]]"
              options:
                type: custom:mushroom-entity-card
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px;
                      overflow: hidden;
                    }
            - domain: media_player
              area: "[[area]]"
              options:
                type: custom:mushroom-entity-card
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px;
                      overflow: hidden;
                    }
            - domain: vacuum
              area: "[[area]]"
              options:
                type: custom:mushroom-entity-card
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px;
                      overflow: hidden;
                    }
            - domain: humidifier
              area: "[[area]]"
              options:
                type: custom:mushroom-entity-card
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px;
                      overflow: hidden;
                    }
            - domain: water_heater
              area: "[[area]]"
              options:
                type: custom:mushroom-entity-card
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px;
                      overflow: hidden;
                    }

alle_aus_button_home:
  card:
    type: custom:button-card
    name: Alle aus
    icon: mdi:lightbulb-off-outline
    show_name: true
    show_icon: true
    styles:
      card:
        - border-radius: var(--border-radius)
        - box-shadow: var(--box-shadow)
        - padding: 14px 0 10px
      grid:
        - grid-template-areas: "'i' 'n'"
      name:
        - justify-self: center
        - font-weight: bold
        - font-size: 15px
        - margin-top: 12px
      img_cell:
        - width: 50px
        - height: 50px
        - border-radius: 50%
        - background-color: rgba(var(--color-red), 0.2)
      icon:
        - color: rgba(var(--color-red), 1)
        - width: 24px
    tap_action:
      action: call-service
      service: script.turn_on
      target:
        entity_id: script.alle_lichter_aus
