type: custom:button-card
template: card_vertical_button
entity: this.entity_id
show_name: true
show_state: false
show_label: false
card_mod:
  style: |
    ha-card {
      border-radius: 20px;
      overflow: hidden;
    }
tap_action:
  action: perform-action
  perform_action: scene.turn_on
  target:
    entity_id: this.entity_id
