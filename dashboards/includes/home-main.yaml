- type: custom:mod-card
  card_mod:
    style: |
      :host {
        display: block;
        width: 100%;
        max-width: 1360px;
        margin: 0 auto;
        padding: 8px 16px 32px;
        box-sizing: border-box;
      }
      ha-card {
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
  card:
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-gap: 16px
      grid-template-columns: 1fr
      grid-template-areas: |
        "persons"
        "welcome"
        "rooms_title"
        "rooms"
        "vacuum"
      mediaquery:
        "(min-width: 1200px)":
          grid-template-columns: 360px 1fr
          grid-template-areas: |
            "persons persons"
            "welcome rooms_title"
            "welcome rooms"
            "welcome vacuum"
        "(min-width: 900px)":
          grid-template-columns: 320px 1fr
          grid-template-areas: |
            "persons persons"
            "welcome rooms_title"
            "welcome rooms"
            "welcome vacuum"
    cards:
      - type: custom:mod-card
        view_layout:
          grid-area: persons
        card_mod:
          style: |
            @media (min-width: 900px) {
              :host {
                display: block;
                max-width: 560px;
              }
            }
        card:
          type: horizontal-stack
          cards:
            - type: custom:button-card
              template: card_person
              entity: person.thorge
              variables:
                ulm_card_person_entity: person.thorge
                ulm_card_person_use_entity_picture: true
                ulm_card_person_battery: sensor.pixel_9_pro_xl_battery_level
            - type: custom:button-card
              template: card_person
              entity: person.laura
              variables:
                ulm_card_person_entity: person.laura
                ulm_card_person_use_entity_picture: true
                ulm_card_person_battery: sensor.pixel_7_pro_battery_level

      - type: vertical-stack
        view_layout:
          grid-area: welcome
        cards: !include home-welcome-stack.yaml

      - type: custom:button-card
        view_layout:
          grid-area: rooms_title
        template: card_title
        name: Räume

      - type: custom:mod-card
        view_layout:
          grid-area: rooms
        card_mod:
          style: |
            :host {
              display: block;
              width: 100%;
              min-width: 0;
            }
            ha-card {
              width: 100%;
            }
        card:
          type: custom:layout-card
          layout:
            width: 170
            max_cols: 4
            max_width: 100%
          cards: !include ulm-rooms.yaml

      - type: custom:button-card
        view_layout:
          grid-area: vacuum
        template: card_vacuum
        entity: vacuum.dreame_bot_d9_max_dreame_bot_d9_max
        tap_action:
          action: navigate
          navigation_path: dreame
        variables:
          ulm_card_vacuum_name: Dreame
          ulm_card_vacuum_camera: camera.dreame_bot_d9_max_map
          ulm_card_vacuum_camera_toggle: true
