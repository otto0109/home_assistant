- type: custom:mod-card
  card_mod:
    style: |
      :host {
        display: block;
        width: 100%;
        max-width: 1600px;
        margin: 0 auto;
        padding: 8px 16px 36px;
        box-sizing: border-box;
      }
      ha-card {
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
  card:
    type: vertical-stack
    cards:
      - type: custom:mod-card
        card_mod:
          style: |
            :host {
              display: block;
              max-width: 640px;
              margin-left: auto;
              margin-right: auto;
            }
        card:
          type: horizontal-stack
          cards:
            - type: custom:button-card
              template: card_person
              entity: person.thorge
              variables:
                ulm_card_person_entity: person.thorge
                ulm_card_person_use_entity_picture: true
                ulm_card_person_battery: sensor.pixel_9_pro_xl_battery_level
            - type: custom:button-card
              template: card_person
              entity: person.laura
              variables:
                ulm_card_person_entity: person.laura
                ulm_card_person_use_entity_picture: true
                ulm_card_person_battery: sensor.pixel_7_pro_battery_level

      - type: vertical-stack
        cards: !include home-welcome-stack.yaml

      - !include home-rooms-sections.yaml

      - !include home-vacuum-block.yaml
