- type: custom:mod-card
  card_mod:
    style: |
      :host {
        display: block;
        width: 100%;
        max-width: 1600px;
        margin: 0 auto;
        padding: 8px 16px 36px;
        box-sizing: border-box;
      }
      ha-card {
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
  card:
    type: vertical-stack
    cards:
      - type: custom:mod-card
        card_mod:
          style: |
            :host {
              display: block;
              max-width: 640px;
              margin-left: auto;
              margin-right: auto;
            }
        card:
          type: horizontal-stack
          cards:
            - type: custom:button-card
              template: card_person
              entity: person.thorge
              variables:
                ulm_card_person_entity: person.thorge
                ulm_card_person_use_entity_picture: true
                ulm_card_person_battery: sensor.pixel_9_pro_xl_battery_level
            - type: custom:button-card
              template: card_person
              entity: person.laura
              variables:
                ulm_card_person_entity: person.laura
                ulm_card_person_use_entity_picture: true
                ulm_card_person_battery: sensor.pixel_7_pro_battery_level

      - type: vertical-stack
        cards: !include home-welcome-stack.yaml

      - type: custom:button-card
        template: card_title
        name: Räume

      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-gap: 16px
          grid-template-columns: repeat(2, 1fr)
          mediaquery:
            "(min-width: 900px)":
              grid-template-columns: repeat(4, 1fr)
              grid-gap: 20px
        cards:
          - !include ulm-rooms.yaml
          - !include ulm-room-energie.yaml

      - type: custom:button-card
        template: card_vacuum
        entity: vacuum.dreame_bot_d9_max_dreame_bot_d9_max
        tap_action:
          action: navigate
          navigation_path: dreame
        variables:
          ulm_card_vacuum_name: Dreame
          ulm_card_vacuum_camera: camera.dreame_bot_d9_max_map
          ulm_card_vacuum_camera_toggle: true
