- type: custom:mod-card
  card_mod:
    style: |
      :host {
        display: block;
        width: 100%;
        max-width: 1480px;
        margin: 0 auto;
        padding: 8px 20px 36px;
        box-sizing: border-box;
      }
      ha-card {
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
  card:
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-gap: 20px
      grid-template-columns: 1fr
      grid-template-areas: |
        "persons"
        "welcome"
        "rooms"
        "vacuum"
      mediaquery:
        "(min-width: 960px)":
          grid-template-columns: minmax(340px, 420px) 1fr
          grid-template-areas: |
            "persons persons"
            "welcome rooms"
            "vacuum vacuum"
    cards:
      - type: custom:mod-card
        view_layout:
          grid-area: persons
        card_mod:
          style: |
            @media (min-width: 960px) {
              :host {
                display: block;
                max-width: 580px;
                margin-left: auto;
                margin-right: auto;
              }
            }
        card:
          type: horizontal-stack
          cards:
            - type: custom:button-card
              template: card_person
              entity: person.thorge
              variables:
                ulm_card_person_entity: person.thorge
                ulm_card_person_use_entity_picture: true
                ulm_card_person_battery: sensor.pixel_9_pro_xl_battery_level
            - type: custom:button-card
              template: card_person
              entity: person.laura
              variables:
                ulm_card_person_entity: person.laura
                ulm_card_person_use_entity_picture: true
                ulm_card_person_battery: sensor.pixel_7_pro_battery_level

      - type: vertical-stack
        view_layout:
          grid-area: welcome
        cards: !include home-welcome-stack.yaml

      - type: custom:mod-card
        view_layout:
          grid-area: rooms
        card_mod:
          style: |
            :host {
              display: block;
              width: 100%;
              min-width: 0;
            }
        card:
          type: vertical-stack
          cards:
            - type: custom:button-card
              template: card_title
              name: Räume
            - type: grid
              columns: 2
              square: false
              cards: !include ulm-rooms.yaml
              card_mod:
                style: |
                  @media (min-width: 960px) {
                    #root {
                      gap: 16px !important;
                    }
                  }
                  @media (min-width: 1200px) {
                    #root {
                      grid-template-columns: repeat(2, minmax(280px, 1fr)) !important;
                    }
                  }

      - type: custom:button-card
        view_layout:
          grid-area: vacuum
        template: card_vacuum
        entity: vacuum.dreame_bot_d9_max_dreame_bot_d9_max
        tap_action:
          action: navigate
          navigation_path: dreame
        variables:
          ulm_card_vacuum_name: Dreame
          ulm_card_vacuum_camera: camera.dreame_bot_d9_max_map
          ulm_card_vacuum_camera_toggle: true
