|
  {% set expander_defaults = {
    'expanded': true,
    'clear': true,
    'clear-children': false,
    'gap': '14px',
    'padding': '0',
    'child-padding': '0',
    'title-card-padding': '0',
    'title-card-button-overlay': true,
    'overlay-margin': '4px',
    'button-background': 'transparent',
    'card_mod': {
      'style': 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; padding: 0 !important; margin: 0 !important; }'
    }
  } %}
  {% set domains = ['light', 'climate', 'switch', 'script', 'fan', 'cover'] %}
  {% set chip_domains = ['light', 'climate', 'switch', 'fan'] %}
  {% set palette_hues = ['yellow', 'pink', 'red', 'purple', 'grey', 'blue', 'green'] %}
  {% set default_priority = 9999 %}
  {% set sonstige_key = '_sonstige' %}
  {% set sorted_areas = namespace(list=[], seen=[]) %}
  {% set priority_labels = namespace(list=[]) %}
  {% for lid in labels() %}
    {% set nums = label_name(lid) | regex_findall('(?i)priorit[aä]t\\s+(\\d+)') %}
    {% if nums | length == 0 %}
      {% set nums = label_name(lid) | regex_findall('^(\\d+)') %}
    {% endif %}
    {% if nums | length > 0 %}
      {% set priority_labels.list = priority_labels.list + [{'lid': lid, 'prio': nums[0] | int}] %}
    {% endif %}
  {% endfor %}
  {% for pl in priority_labels.list | sort(attribute='prio') %}
    {% for aid in label_areas(pl.lid) %}
      {% if aid not in sorted_areas.seen %}
        {% set sorted_areas.seen = sorted_areas.seen + [aid] %}
        {% set sorted_areas.list = sorted_areas.list + [{
          'aid': aid,
          'name': area_name(aid),
          'priority': pl.prio
        }] %}
      {% endif %}
    {% endfor %}
  {% endfor %}
  {% for aid in areas() %}
    {% if aid not in sorted_areas.seen %}
      {% set sorted_areas.list = sorted_areas.list + [{
        'aid': aid,
        'name': area_name(aid),
        'priority': default_priority
      }] %}
    {% endif %}
  {% endfor %}
  {% set floor_groups = namespace(map={}) %}
  {% set ns = namespace(cards=[]) %}
  {% for item in sorted_areas.list | sort(attribute='name') | sort(attribute='priority') %}
    {% set aid = item.aid %}
    {% set aname = item.name %}
    {% if aname %}
      {% set picked = namespace(e=none) %}
      {% for e in states.light | sort(attribute='entity_id') %}
        {% if picked.e is none and area_id(e.entity_id) == aid and not is_hidden_entity(e.entity_id) %}
          {% set picked.e = e.entity_id %}
        {% endif %}
      {% endfor %}
      {% for domain in domains %}
        {% if picked.e is none and domain != 'light' %}
          {% for e in states[domain] | sort(attribute='entity_id') %}
            {% if area_id(e.entity_id) == aid and not is_hidden_entity(e.entity_id) %}
              {% set picked.e = e.entity_id %}
            {% endif %}
          {% endfor %}
        {% endif %}
      {% endfor %}
      {% if picked.e is not none %}
        {% set dom = picked.e.split('.')[0] %}
        {% set room_hue = namespace(c=palette_hues[loop.index0 % 7]) %}
        {% if aname == 'Wohnzimmer' or aid == 'wohnzimmer' %}
          {% set room_hue.c = 'yellow' %}
        {% elif aname == 'Esszimmer' or aid == 'esszimmer' %}
          {% set room_hue.c = 'pink' %}
        {% elif aname == 'Raum neben der Küche' or aname == 'Küche' or aid == 'raum_neben_der_kuche' or aid == 'kueche' %}
          {% set room_hue.c = 'red' %}
        {% elif aname == 'Schlafzimmer' or aid == 'schlafzimmer' %}
          {% set room_hue.c = 'purple' %}
        {% elif aname == 'Flur' or aname == 'Flur OG' or aid == 'flur' or aid == 'flur_og' %}
          {% set room_hue.c = 'grey' %}
        {% elif aname == 'Flur EG' or aid == 'flur_eg' %}
          {% set room_hue.c = 'blue' %}
        {% elif aname == 'Garten' or aid == 'garten' %}
          {% set room_hue.c = 'green' %}
        {% endif %}
        {% set chips = namespace(list=[]) %}
        {% for cd in chip_domains %}
          {% for e in states[cd] | sort(attribute='entity_id') %}
            {% if area_id(e.entity_id) == aid and not is_hidden_entity(e.entity_id) and chips.list | length < 3 %}
              {% set eid = e.entity_id %}
              {% if cd == 'light' %}
                {% set chips.list = chips.list + [{
                  'entity_id': eid,
                  'icon': state_attr(eid, 'icon') or 'mdi:lightbulb',
                  'chip_color': room_hue.c,
                  'templates': ['chip_widget_active'],
                  'tap_action': {'action': 'toggle'}
                }] %}
              {% elif cd == 'climate' %}
                {% set chips.list = chips.list + [{
                  'entity_id': eid,
                  'icon': state_attr(eid, 'icon') or 'mdi:snowflake',
                  'templates': ['chip_widget_blue'],
                  'tap_action': {'action': 'more-info'}
                }] %}
              {% elif cd == 'switch' %}
                {% set chips.list = chips.list + [{
                  'entity_id': eid,
                  'icon': state_attr(eid, 'icon') or 'mdi:light-switch',
                  'templates': ['chip_widget_grey'],
                  'tap_action': {'action': 'toggle'}
                }] %}
              {% elif cd == 'fan' %}
                {% set chips.list = chips.list + [{
                  'entity_id': eid,
                  'icon': state_attr(eid, 'icon') or 'mdi:fan',
                  'templates': ['chip_widget_green'],
                  'tap_action': {'action': 'toggle'}
                }] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {% set dreame = namespace(eid='') %}
        {% if aname == 'Wohnzimmer' or aid == 'wohnzimmer' %}
          {% set dreame.eid = 'script.dreame_reinigen_wohnzimmer' %}
        {% elif aname == 'Esszimmer' or aid == 'esszimmer' %}
          {% set dreame.eid = 'script.dreame_reinigen_esszimmer' %}
        {% elif aname == 'Raum neben der Küche' or aname == 'Küche' or aid == 'raum_neben_der_kuche' or aid == 'kueche' %}
          {% set dreame.eid = 'script.dreame_reinigen_kueche' %}
        {% elif aname == 'Flur EG' or aid == 'flur_eg' %}
          {% set dreame.eid = 'script.dreame_reinigen_flur_eg' %}
        {% endif %}
        {% if dreame.eid and not is_hidden_entity(dreame.eid) and chips.list | length < 3 %}
          {% set chips.list = chips.list + [{
            'entity_id': dreame.eid,
            'icon': state_attr(dreame.eid, 'icon') or 'mdi:broom',
            'templates': ['chip_widget_green'],
            'tap_action': {
              'action': 'call-service',
              'service': 'script.turn_on',
              'service_data': {'entity_id': dreame.eid}
            }
          }] %}
        {% endif %}
        {% set icon = "[[[ return hass.areas[" ~ (aid | tojson) ~ "]?.icon || entity.attributes.icon || 'mdi:home-floor-1'; ]]]" %}
        {% set room_card = {
          'type': 'custom:button-card',
          'template': ['card_room', room_hue.c ~ '_no_state'],
          'entity': picked.e,
          'name': aname,
          'icon': icon,
          'double_tap_action': {'action': 'none'},
          'tap_action': {
            'action': 'call-service',
            'service': 'script.turn_on',
            'target': {'entity_id': 'script.dashboard_raum_oeffnen'},
            'data': {'variables': {'area': aid}}
          },
          'variables': {
            'label_use_temperature': dom == 'climate',
            'label_use_brightness': dom == 'light',
            'entity_1': chips.list[0] if chips.list | length > 0 else false,
            'entity_2': chips.list[1] if chips.list | length > 1 else false,
            'entity_3': chips.list[2] if chips.list | length > 2 else false
          }
        } %}
        {% set floor_key = floor_id(aid) %}
        {% if floor_key is none or floor_key in ['unknown', 'unavailable', ''] %}
          {% set floor_key = sonstige_key %}
        {% endif %}
        {% set _prev = floor_groups.map[floor_key] if floor_key in floor_groups.map else [] %}
        {% set floor_groups.map = floor_groups.map | combine({floor_key: _prev + [room_card]}) %}
      {% endif %}
    {% endif %}
  {% endfor %}
  {% set floor_order = namespace(list=[]) %}
  {% for fid in floors() %}
    {% set floor_order.list = floor_order.list + [{'id': fid, 'name': floor_name(fid)}] %}
  {% endfor %}
  {% for floor_item in floor_order.list | sort(attribute='name') %}
    {% set fid = floor_item.id %}
    {% set room_cards = floor_groups.map[fid] if fid in floor_groups.map else [] %}
    {% if room_cards | length > 0 %}
      {% set ns.cards = ns.cards + [expander_defaults | combine({
        'type': 'custom:expander-card',
        'expand-id': 'home-floor-' ~ fid,
        'title-card': {
          'type': 'custom:button-card',
          'template': 'card_title',
          'name': floor_item.name
        },
        'cards': [{
          'type': 'custom:layout-card',
          'layout_type': 'custom:grid-layout',
          'layout': {
            'grid-gap': '16px',
            'grid-template-columns': 'repeat(2, 1fr)',
            'mediaquery': {
              '(min-width: 900px)': {
                'grid-template-columns': 'repeat(4, 1fr)',
                'grid-gap': '20px'
              }
            }
          },
          'cards': room_cards
        }]
      })] %}
    {% endif %}
  {% endfor %}
  {% set sonstige_cards = floor_groups.map[sonstige_key] if sonstige_key in floor_groups.map else [] %}
  {% if sonstige_cards | length > 0 %}
    {% set ns.cards = ns.cards + [expander_defaults | combine({
      'type': 'custom:expander-card',
      'expand-id': 'home-floor-sonstige',
      'title-card': {
        'type': 'custom:button-card',
        'template': 'card_title',
        'name': 'Sonstige'
      },
      'cards': [{
        'type': 'custom:layout-card',
        'layout_type': 'custom:grid-layout',
        'layout': {
          'grid-gap': '16px',
          'grid-template-columns': 'repeat(2, 1fr)',
          'mediaquery': {
            '(min-width: 900px)': {
              'grid-template-columns': 'repeat(4, 1fr)',
              'grid-gap': '20px'
            }
          }
        },
        'cards': sonstige_cards
      }]
    })] %}
  {% endif %}
  {{ ns.cards }}
