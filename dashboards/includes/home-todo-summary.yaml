- type: custom:button-card
  template: card_title
  name: To-do-Listen
  tap_action:
    action: navigate
    navigation_path: /todo

- type: custom:mod-card
  tap_action:
    action: navigate
    navigation_path: /todo
  card_mod:
    style: |
      ha-card {
        border-radius: var(--border-radius);
        box-shadow: var(--box-shadow);
        padding: 12px 16px;
        cursor: pointer;
      }
  card:
    type: markdown
    entity: sensor.dashboard_todo_zusammenfassung
    content: >
      {% set sid = 'sensor.dashboard_todo_zusammenfassung' %}
      {% if is_state(sid, 'unavailable') or is_state(sid, 'unknown') %}
      *To-do-Listen werden geladen…*
      {% else %}
      {% set n = states(sid) | int(0) %}
      **{% if n == 0 %}Keine offenen Aufgaben{% elif n == 1 %}1 offene Aufgabe{% else %}{{ n }} offene Aufgaben{% endif %}**

      {{ state_attr(sid, 'text') | default('', true) }}
      {% endif %}
