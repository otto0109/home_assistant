- type: custom:button-card
  template: card_title
  name: To-do-Listen
  tap_action:
    action: navigate
    navigation_path: /todo

- type: markdown
  content: |
    {% set sensor_id = 'sensor.dashboard_todo_zusammenfassung' %}
    {% if states(sensor_id) in ['unavailable', 'unknown'] %}
    *To-do-Zusammenfassung wird geladen…*
    {% else %}
    {% set items = state_attr(sensor_id, 'items') or [] %}
    {% if items | length == 0 %}
    *Keine offenen Aufgaben*
    {% else %}
    {% for item in items[:10] %}
    - [{{ item.summary }}]({{ '/todo?entity_id=' ~ item.entity_id }}) · {{ item.list_name }}
    {% endfor %}
    {% endif %}
    {% endif %}
  card_mod:
    style: |
      ha-card {
        border-radius: var(--border-radius);
        box-shadow: var(--box-shadow);
        padding: 12px 16px;
        font-size: 14px;
        line-height: 1.45;
      }
      ha-card a {
        color: var(--primary-color);
        text-decoration: none;
      }
      ha-card a:hover {
        text-decoration: underline;
      }
