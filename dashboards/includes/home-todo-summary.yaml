- type: custom:button-card
  template: card_title
  name: To-do-Listen
  tap_action:
    action: navigate
    navigation_path: /todo

- type: custom:button-card
  show_icon: false
  show_name: false
  show_label: true
  label: |
    [[[
      const s = hass.states['sensor.dashboard_todo_zusammenfassung'];
      if (!s || s.state === 'unavailable' || s.state === 'unknown') {
        return 'To-do-Zusammenfassung wird geladen…';
      }
      return s.attributes?.text || 'Keine offenen Aufgaben';
    ]]]
  styles:
    card:
      - border-radius: var(--border-radius)
      - box-shadow: var(--box-shadow)
      - padding: 12px 16px
      - white-space: pre-wrap
      - text-align: left
      - font-size: 14px
      - line-height: 1.45
    label:
      - justify-self: start
      - text-align: left
      - white-space: pre-wrap
      - font-size: 14px
      - font-weight: 400
      - opacity: 0.9
  tap_action:
    action: navigate
    navigation_path: /todo
