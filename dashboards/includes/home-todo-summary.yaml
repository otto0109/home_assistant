- type: custom:button-card
  template: card_title
  name: To-do-Listen
  tap_action:
    action: navigate
    navigation_path: /todo

- type: custom:auto-entities
  show_empty: false
  card:
    type: vertical-stack
  card_param: cards
  filter:
    template: |
      {% set items = state_attr('sensor.dashboard_todo_zusammenfassung', 'items') or [] %}
      {% set row_style = {
        'card': [
          'border-radius: var(--border-radius)',
          'box-shadow: var(--box-shadow)',
          'padding: 10px 14px',
          'margin-bottom: 6px'
        ],
        'grid': [
          "grid-template-areas: \"'i n l'\"",
          'grid-template-columns: min-content 1fr auto',
          'grid-template-rows: min-content'
        ],
        'icon': [
          'width: 18px',
          'color: rgba(var(--color-blue), 1)'
        ],
        'img_cell': [
          'width: 28px',
          'height: 28px'
        ],
        'name': [
          'justify-self: start',
          'text-align: left',
          'font-size: 14px',
          'font-weight: 500',
          'white-space: normal',
          'line-height: 1.3'
        ],
        'label': [
          'justify-self: end',
          'font-size: 11px',
          'opacity: 0.55',
          'white-space: nowrap'
        ]
      } %}
      {% if items | length == 0 %}
        {{ [{
          'type': 'custom:button-card',
          'name': 'Keine offenen Aufgaben',
          'icon': 'mdi:clipboard-check-outline',
          'show_name': true,
          'show_icon': true,
          'show_label': false,
          'styles': row_style,
          'tap_action': {
            'action': 'navigate',
            'navigation_path': '/todo'
          }
        }] }}
      {% else %}
        {% set ns = namespace(cards=[]) %}
        {% for item in items[:10] %}
          {% set ns.cards = ns.cards + [{
            'type': 'custom:button-card',
            'name': item.summary,
            'label': item.list_name,
            'icon': 'mdi:checkbox-blank-circle-outline',
            'show_name': true,
            'show_icon': true,
            'show_label': true,
            'styles': row_style,
            'tap_action': {
              'action': 'navigate',
              'navigation_path': '/todo?entity_id=' ~ item.entity_id
            }
          }] %}
        {% endfor %}
        {{ ns.cards }}
      {% endif %}
