# Kompakte Status-Kacheln: To-do-Listen + Kalender (gleicher Stil wie Solar/Speicher/Router).
- type: custom:auto-entities
  show_empty: false
  sort:
    method: friendly_name
  card:
    type: grid
    columns: 3
    square: false
  card_param: cards
  filter:
    include:
      - domain: todo
        options:
          type: custom:button-card
          show_name: true
          show_icon: true
          show_state: false
          show_label: true
          label: '[[[ return states[entity.entity_id].state + " offen" ]]]'
          styles:
            card:
              - border-radius: var(--border-radius)
              - box-shadow: var(--box-shadow)
              - padding: 10px 0 8px
            grid:
              - grid-template-areas: "'i' 'n' 'l'"
            name:
              - justify-self: center
              - font-weight: bold
              - font-size: 14px
              - margin-top: 8px
            label:
              - justify-self: center
              - font-size: 12px
              - opacity: 0.7
            img_cell:
              - width: 28px
              - height: 28px
              - margin: 0 auto
              - background: none
            icon:
              - width: 22px
              - height: 22px
          tap_action:
            action: navigate
            navigation_path: '[[[ return "/todo?entity_id=" + entity.entity_id ]]]'
    template: |
      - type: custom:button-card
        name: Kalender
        entity: sensor.dashboard_kalender_heute
        show_name: true
        show_icon: true
        show_state: false
        show_label: true
        label: '[[[ const s = states["sensor.dashboard_kalender_heute"]; const n = parseInt(s ? s.state : "0", 10) || 0; return n + (n === 1 ? " Termin heute" : " Termine heute"); ]]]'
        styles:
          card:
            - border-radius: var(--border-radius)
            - box-shadow: var(--box-shadow)
            - padding: 10px 0 8px
          grid:
            - grid-template-areas: "'i' 'n' 'l'"
          name:
            - justify-self: center
            - font-weight: bold
            - font-size: 14px
            - margin-top: 8px
          label:
            - justify-self: center
            - font-size: 12px
            - opacity: 0.7
          img_cell:
            - width: 28px
            - height: 28px
            - margin: 0 auto
            - background: none
          icon:
            - width: 22px
            - height: 22px
            - color: rgba(var(--color-purple), 1)
        tap_action:
          action: navigate
          navigation_path: /home-dashboard/kalender
