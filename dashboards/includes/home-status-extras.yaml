# Kompakte Status-Kacheln: To-do-Listen + Kalender (gleicher Stil wie Solar/Speicher/Router).
- type: custom:auto-entities
  show_empty: false
  sort:
    method: entity_id
  card:
    type: grid
    columns: 3
    square: false
  card_param: cards
  filter:
    include:
      - entity_id: todo.einkaufsliste
        options:
          type: custom:button-card
          show_name: true
          show_icon: true
          show_state: false
          show_label: true
          label: '[[[ return states[entity.entity_id].state + " offen" ]]]'
          styles:
            card:
              - border-radius: var(--border-radius)
              - box-shadow: var(--box-shadow)
              - padding: 14px 0 10px
            grid:
              - grid-template-areas: "'i' 'n' 'l'"
            name:
              - justify-self: center
              - font-weight: bold
              - font-size: 15px
              - margin-top: 12px
            label:
              - justify-self: center
              - font-size: 13px
              - opacity: 0.7
            img_cell:
              - width: 50px
              - height: 50px
              - border-radius: 50%
              - background-color: rgba(var(--color-blue), 0.2)
            icon:
              - color: rgba(var(--color-blue), 1)
              - width: 24px
          tap_action:
            action: navigate
            navigation_path: /todo?entity_id=todo.einkaufsliste
      - entity_id: todo.haus
        options:
          type: custom:button-card
          show_name: true
          show_icon: true
          show_state: false
          show_label: true
          label: '[[[ return states[entity.entity_id].state + " offen" ]]]'
          styles:
            card:
              - border-radius: var(--border-radius)
              - box-shadow: var(--box-shadow)
              - padding: 14px 0 10px
            grid:
              - grid-template-areas: "'i' 'n' 'l'"
            name:
              - justify-self: center
              - font-weight: bold
              - font-size: 15px
              - margin-top: 12px
            label:
              - justify-self: center
              - font-size: 13px
              - opacity: 0.7
            img_cell:
              - width: 50px
              - height: 50px
              - border-radius: 50%
              - background-color: rgba(var(--color-pink), 0.2)
            icon:
              - color: rgba(var(--color-pink), 1)
              - width: 24px
          tap_action:
            action: navigate
            navigation_path: /todo?entity_id=todo.haus
      - entity_id: calendar.thorge_3_laura
        options:
          type: custom:button-card
          name: Kalender
          icon: mdi:calendar
          show_name: true
          show_icon: true
          show_state: false
          show_label: true
          label: '[[[ const s = states["sensor.dashboard_kalender_heute"]; if (!s || s.state === "unavailable" || s.state === "unknown") return "0 Termine heute"; const n = parseInt(s.state, 10) || 0; return n + (n === 1 ? " Termin heute" : " Termine heute"); ]]]'
          styles:
            card:
              - border-radius: var(--border-radius)
              - box-shadow: var(--box-shadow)
              - padding: 14px 0 10px
            grid:
              - grid-template-areas: "'i' 'n' 'l'"
            name:
              - justify-self: center
              - font-weight: bold
              - font-size: 15px
              - margin-top: 12px
            label:
              - justify-self: center
              - font-size: 13px
              - opacity: 0.7
            img_cell:
              - width: 50px
              - height: 50px
              - border-radius: 50%
              - background-color: rgba(var(--color-purple), 0.2)
            icon:
              - color: rgba(var(--color-purple), 1)
              - width: 24px
          tap_action:
            action: navigate
            navigation_path: /home-dashboard/kalender
