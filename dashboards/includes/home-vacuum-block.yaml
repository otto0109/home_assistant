# Dreame-Steuerkarte auf der Home-Übersicht.
type: custom:mod-card
card_mod:
  style: |
    :host {
      display: block;
      margin-top: 6px;
    }
card:
  type: custom:button-card
  template: card_vacuum
  entity: vacuum.dreame_bot_d9_max_dreame_bot_d9_max
  tap_action:
    action: navigate
    navigation_path: /home-dashboard/dreame
  double_tap_action:
    action: none
  hold_action:
    action: none
  variables:
    ulm_card_vacuum_name: Dreame
    ulm_card_vacuum_camera: camera.dreame_bot_d9_max_map
    ulm_card_vacuum_camera_toggle: true
    ulm_card_tap_action: navigate
    ulm_card_tap_navigate_path: /home-dashboard/dreame
    ulm_icon_tap_action: more-info
    ulm_name_tap_action: navigate
    ulm_name_tap_navigate_path: /home-dashboard/dreame
    ulm_icon_double_tap_action: none
    ulm_name_double_tap_action: none
    ulm_card_double_tap_action: none
