# Statische Fallback-Karten (falls auto-entities Probleme macht).
# tap_action: navigate — kein Script, kompatibel mit älterem button-card.
- type: custom:button-card
  template:
    - card_room
    - yellow_no_state
  name: Wohnzimmer
  entity: light.licht_wohnzimmer
  icon: mdi:sofa
  tap_action:
    action: navigate
    navigation_path: raum

- type: custom:button-card
  template:
    - card_room
    - pink_no_state
  name: Esszimmer
  entity: climate.esszimmer_klimaanlage
  icon: mdi:silverware-fork-knife
  tap_action:
    action: navigate
    navigation_path: raum
  variables:
    label_use_temperature: true
    entity_1:
      entity_id: climate.esszimmer_klimaanlage
      icon: mdi:snowflake
      templates:
        - blue_on
      tap_action:
        action: more-info

