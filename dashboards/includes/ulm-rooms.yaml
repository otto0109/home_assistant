- type: custom:button-card
  template:
    - card_room
    - yellow_no_state
  name: Wohnzimmer
  entity: climate.esszimmer_klimaanlage
  icon: mdi:sofa
  tap_action:
    action: navigate
    navigation_path: wohnzimmer
  variables:
    label_use_temperature: true
    entity_1:
      entity_id: light.licht_wohnzimmer
      templates:
        - yellow_on
      tap_action:
        action: toggle
    entity_2:
      entity_id: light.beleuchtung_bett_leuchte
      templates:
        - yellow_on
      tap_action:
        action: toggle
    entity_3:
      entity_id: vacuum.dreame_bot_d9_max_dreame_bot_d9_max
      templates:
        - green_on
      tap_action:
        action: more-info
    entity_4:
      entity_id: climate.esszimmer_klimaanlage
      templates:
        - blue_on
      tap_action:
        action: more-info

