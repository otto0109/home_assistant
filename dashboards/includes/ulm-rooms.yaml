- type: custom:button-card
  template:
    - card_room
    - yellow_no_state
  name: Wohnzimmer
  entity: light.licht_wohnzimmer
  icon: mdi:sofa
  tap_action:
    action: navigate
    navigation_path: wohnzimmer
  variables:
    label_use_temperature: false
    label_use_brightness: true
    entity_1:
      entity_id: light.licht_wohnzimmer
      icon: mdi:floor-lamp
      templates:
        - yellow_on
      tap_action:
        action: toggle

- type: custom:button-card
  template:
    - card_room
    - pink_no_state
  name: Esszimmer
  entity: climate.esszimmer_klimaanlage
  icon: mdi:silverware-fork-knife
  tap_action:
    action: navigate
    navigation_path: esszimmer
  variables:
    label_use_temperature: true
    entity_1:
      entity_id: light.beleuchtung_bett_leuchte
      icon: mdi:chandelier
      templates:
        - pink_on
      tap_action:
        action: toggle
    entity_2:
      entity_id: climate.esszimmer_klimaanlage
      icon: mdi:snowflake
      templates:
        - blue_on
      tap_action:
        action: more-info
    entity_3:
      entity_id: script.dreame_reinigen_esszimmer
      icon: mdi:broom
      templates:
        - green_on
      tap_action:
        action: call-service
        service: script.turn_on
        service_data:
          entity_id: script.dreame_reinigen_esszimmer

