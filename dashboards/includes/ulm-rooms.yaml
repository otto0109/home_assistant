- type: custom:button-card
  template:
    - card_room
    - yellow_no_state
  name: Wohnzimmer
  entity: light.licht_wohnzimmer
  icon: mdi:sofa
  tap_action:
    action: navigate
    navigation_path: wohnzimmer
  variables:
    label_use_temperature: false
    label_use_brightness: true
    entity_1:
      entity_id: light.licht_wohnzimmer
      templates:
        - yellow_on
      tap_action:
        action: toggle

