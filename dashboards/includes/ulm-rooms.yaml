- type: custom:button-card
  template:
    - card_room
    - purple_no_state
  name: Energie
  entity: sensor.pv_pv_power
  icon: mdi:solar-power-variant
  show_state: false
  tap_action:
    action: navigate
    navigation_path: energie
  variables:
    label_use_temperature: false
    label_use_brightness: false
  label: |
    [[[
      function fmtPower(entityId) {
        var e = states[entityId];
        if (!e || ['unavailable', 'unknown'].includes(e.state)) return null;
        var v = parseFloat(e.state);
        if (isNaN(v)) return null;
        if (Math.abs(v) >= 1000) return (Math.abs(v) / 1000).toFixed(1) + ' kW';
        return Math.round(Math.abs(v)) + ' W';
      }
      var solar = fmtPower('sensor.pv_pv_power');
      var load = fmtPower('sensor.pv_activepower_load_sys');
      var bat = states['sensor.pv_battery'];
      var batPct =
        bat && !['unavailable', 'unknown'].includes(bat.state)
          ? Math.round(parseFloat(bat.state)) + '%'
          : null;
      var gridE = states['sensor.pv_netzleistung'];
      var gridLine = null;
      if (gridE && !['unavailable', 'unknown'].includes(gridE.state)) {
        var g = parseFloat(gridE.state);
        if (!isNaN(g) && Math.abs(g) >= 50) {
          gridLine = g > 0 ? 'Einspeisung ' + fmtPower('sensor.pv_netzleistung') : 'Bezug ' + fmtPower('sensor.pv_netzleistung');
        }
      }
      var headline = solar ? 'Solar ' + solar : '–';
      var details = [
        batPct ? 'Speicher ' + batPct : null,
        load ? 'Haus ' + load : null,
        gridLine,
      ]
        .filter(Boolean)
        .join(' · ');
      return details ? headline + '\n' + details : headline;
    ]]]
  styles:
    label:
      - font-size: 11px
      - line-height: 1.45
      - white-space: pre-line
      - opacity: 0.9
      - justify-self: start
      - text-align: left
      - padding-top: 2px
