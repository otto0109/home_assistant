- type: custom:button-card
  template: card_title
  name: Termine

- type: custom:mod-card
  tap_action:
    action: navigate
    navigation_path: /home-dashboard/kalender
  card_mod:
    style: |
      ha-card {
        border-radius: var(--border-radius);
        box-shadow: var(--box-shadow);
        padding: 12px 16px;
        cursor: pointer;
      }
  card:
    type: markdown
    entity: sensor.dashboard_kalender_heute
    content: >
      {% set sid = 'sensor.dashboard_kalender_heute' %}
      {% if is_state(sid, 'unavailable') or is_state(sid, 'unknown') %}
      *Kalender wird geladen…*
      {% else %}
      {% set n = states(sid) | int(0) %}
      **{% if n == 0 %}Keine Termine heute{% elif n == 1 %}1 Termin heute{% else %}{{ n }} Termine heute{% endif %}**

      {{ state_attr(sid, 'preview') | default('', true) }}
      {% endif %}
