- type: custom:button-card
  template: card_title
  name: Termine

- type: custom:button-card
  entity: sensor.dashboard_kalender_heute
  show_icon: true
  show_name: true
  show_label: true
  show_state: false
  icon: mdi:calendar
  name: |
    [[[
      const s = hass.states['sensor.dashboard_kalender_heute'];
      if (!s || s.state === 'unavailable' || s.state === 'unknown') return 'Wird geladen…';
      const n = parseInt(s.state, 10) || 0;
      if (n === 0) return 'Keine Termine heute';
      if (n === 1) return '1 Termin heute';
      return `${n} Termine heute`;
    ]]]
  label: |
    [[[
      const s = hass.states['sensor.dashboard_kalender_heute'];
      if (!s || s.state === 'unavailable' || s.state === 'unknown') return '';
      return s.attributes?.preview || '';
    ]]]
  styles:
    card:
      - border-radius: var(--border-radius)
      - box-shadow: var(--box-shadow)
      - padding: 12px 14px
      - white-space: pre-wrap
      - text-align: left
    grid:
      - grid-template-areas: "'i n' 'i l'"
      - grid-template-columns: min-content 1fr
    icon:
      - width: 24px
      - color: rgba(var(--color-blue), 1)
    name:
      - justify-self: start
      - font-size: 14px
      - font-weight: 600
    label:
      - justify-self: start
      - font-size: 13px
      - font-weight: 400
      - opacity: 0.75
      - white-space: pre-wrap
      - line-height: 1.4
      - margin-top: 6px
  tap_action:
    action: navigate
    navigation_path: /home-dashboard/kalender
