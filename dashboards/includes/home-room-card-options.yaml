# Optionen für dynamische Raumkarten (auto-entities).
name: "[[[ const id = entity.entity_id; const aid = hass.entities[id]?.area_id; return aid && hass.areas[aid] ? hass.areas[aid].name : entity.attributes.friendly_name; ]]]"
icon: "[[[ const id = entity.entity_id; const aid = hass.entities[id]?.area_id; return (aid && hass.areas[aid]?.icon) || entity.attributes.icon || 'mdi:home-floor-1'; ]]]"
variables:
  label_use_temperature: "[[[ if (!entity.entity_id.startsWith('climate.')) return false; const t = hass.states[entity.entity_id]?.attributes?.current_temperature; return t !== undefined && t !== null && t !== 'unavailable'; ]]]"
  label_use_brightness: "[[[ return entity.entity_id.startsWith('light.'); ]]]"
  entity_1: "[[[ const areaId = hass.entities[entity.entity_id]?.area_id; if (!areaId) return false; const order = { light: 0, climate: 1, switch: 2, script: 3, fan: 4 }; const chip = (eid) => { const d = eid.split('.')[0]; const ic = hass.states[eid]?.attributes?.icon; if (d === 'climate') return { entity_id: eid, icon: ic || 'mdi:snowflake', templates: ['blue_on'], tap_action: { action: 'more-info' } }; if (d === 'script') return { entity_id: eid, icon: ic || 'mdi:broom', templates: ['green_on'], tap_action: { action: 'call-service', service: 'script.turn_on', service_data: { entity_id: eid } } }; if (d === 'light') return { entity_id: eid, icon: ic || 'mdi:lightbulb', templates: ['yellow_on'], tap_action: { action: 'toggle' } }; if (d === 'switch') return { entity_id: eid, icon: ic || 'mdi:light-switch', templates: ['grey_on'], tap_action: { action: 'toggle' } }; if (d === 'fan') return { entity_id: eid, icon: ic || 'mdi:fan', templates: ['green_on'], tap_action: { action: 'toggle' } }; return false; }; const ids = Object.keys(hass.states).filter((eid) => { const d = eid.split('.')[0]; return order[d] !== undefined && hass.entities[eid]?.area_id === areaId; }).sort((a, b) => order[a.split('.')[0]] - order[b.split('.')[0]] || a.localeCompare(b)).slice(0, 3); return ids[0] ? chip(ids[0]) : false; ]]]"
  entity_2: "[[[ const areaId = hass.entities[entity.entity_id]?.area_id; if (!areaId) return false; const order = { light: 0, climate: 1, switch: 2, script: 3, fan: 4 }; const chip = (eid) => { const d = eid.split('.')[0]; const ic = hass.states[eid]?.attributes?.icon; if (d === 'climate') return { entity_id: eid, icon: ic || 'mdi:snowflake', templates: ['blue_on'], tap_action: { action: 'more-info' } }; if (d === 'script') return { entity_id: eid, icon: ic || 'mdi:broom', templates: ['green_on'], tap_action: { action: 'call-service', service: 'script.turn_on', service_data: { entity_id: eid } } }; if (d === 'light') return { entity_id: eid, icon: ic || 'mdi:lightbulb', templates: ['yellow_on'], tap_action: { action: 'toggle' } }; if (d === 'switch') return { entity_id: eid, icon: ic || 'mdi:light-switch', templates: ['grey_on'], tap_action: { action: 'toggle' } }; if (d === 'fan') return { entity_id: eid, icon: ic || 'mdi:fan', templates: ['green_on'], tap_action: { action: 'toggle' } }; return false; }; const ids = Object.keys(hass.states).filter((eid) => { const d = eid.split('.')[0]; return order[d] !== undefined && hass.entities[eid]?.area_id === areaId; }).sort((a, b) => order[a.split('.')[0]] - order[b.split('.')[0]] || a.localeCompare(b)).slice(0, 3); return ids[1] ? chip(ids[1]) : false; ]]]"
  entity_3: "[[[ const areaId = hass.entities[entity.entity_id]?.area_id; if (!areaId) return false; const order = { light: 0, climate: 1, switch: 2, script: 3, fan: 4 }; const chip = (eid) => { const d = eid.split('.')[0]; const ic = hass.states[eid]?.attributes?.icon; if (d === 'climate') return { entity_id: eid, icon: ic || 'mdi:snowflake', templates: ['blue_on'], tap_action: { action: 'more-info' } }; if (d === 'script') return { entity_id: eid, icon: ic || 'mdi:broom', templates: ['green_on'], tap_action: { action: 'call-service', service: 'script.turn_on', service_data: { entity_id: eid } } }; if (d === 'light') return { entity_id: eid, icon: ic || 'mdi:lightbulb', templates: ['yellow_on'], tap_action: { action: 'toggle' } }; if (d === 'switch') return { entity_id: eid, icon: ic || 'mdi:light-switch', templates: ['grey_on'], tap_action: { action: 'toggle' } }; if (d === 'fan') return { entity_id: eid, icon: ic || 'mdi:fan', templates: ['green_on'], tap_action: { action: 'toggle' } }; return false; }; const ids = Object.keys(hass.states).filter((eid) => { const d = eid.split('.')[0]; return order[d] !== undefined && hass.entities[eid]?.area_id === areaId; }).sort((a, b) => order[a.split('.')[0]] - order[b.split('.')[0]] || a.localeCompare(b)).slice(0, 3); return ids[2] ? chip(ids[2]) : false; ]]]"
tap_action: "[[[ return (async () => { const id = entity.entity_id; const aid = hass.entities[id]?.area_id; const n = aid && hass.areas[aid] ? hass.areas[aid].name : ''; if (n) await hass.callService('input_text', 'set_value', { entity_id: 'input_text.dashboard_active_area', value: n }); return { action: 'navigate', navigation_path: 'raum' }; })(); ]]]"
