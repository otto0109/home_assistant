- type: markdown
  content: |
    {% set hour = now().hour %}
    {% if hour >= 18 %}
      {% set greet = 'Guten Abend' %}
    {% elif hour >= 12 %}
      {% set greet = 'Guten Tag' %}
    {% elif hour >= 5 %}
      {% set greet = 'Guten Morgen' %}
    {% else %}
      {% set greet = 'Hallo' %}
    {% endif %}
    {% set name = user.split(' ')[0] %}
    ## {{ greet }}, {{ name }}!
    {% set w = states('weather.wetter_home') %}
    {% if w not in ['unknown', 'unavailable'] %}
    *{{ state_attr('weather.wetter_home', 'temperature') }}°C · {{ w }}*
    {% else %}
    *{{ now().strftime('%A, %d. %B') | capitalize }}*
    {% endif %}
  card_mod:
    style: |
      ha-card {
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 4px !important;
      }

- type: custom:button-card
  template: card_title
  name: Szenen

- type: grid
  columns: 3
  square: false
  cards:
    - type: custom:button-card
      name: Voll
      icon: mdi:ceiling-light
      show_name: true
      show_icon: true
      styles:
        card:
          - border-radius: var(--border-radius)
          - box-shadow: var(--box-shadow)
          - padding: 10px 0 8px
        grid:
          - grid-template-areas: "'i' 'n'"
        name:
          - justify-self: center
          - font-weight: bold
          - font-size: 14px
          - margin-top: 10px
        img_cell:
          - width: 42px
          - height: 42px
          - border-radius: 50%
          - background-color: rgba(var(--color-yellow), 0.2)
        icon:
          - color: rgba(var(--color-yellow), 1)
          - width: 20px
      tap_action:
        action: perform-action
        perform_action: scene.turn_on
        target:
          entity_id: scene.wohnzimmer_volle_beluechtung
