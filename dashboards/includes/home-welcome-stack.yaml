- type: markdown
  content: |
    {% set hour = now().hour %}
    {% if hour >= 18 %}
      {% set greet = 'Guten Abend' %}
    {% elif hour >= 12 %}
      {% set greet = 'Guten Tag' %}
    {% elif hour >= 5 %}
      {% set greet = 'Guten Morgen' %}
    {% else %}
      {% set greet = 'Hallo' %}
    {% endif %}
    {% set name = user.split(' ')[0] %}
    ## {{ greet }}, {{ name }}!
    {% set w = states('weather.wetter_home') %}
    {% if w not in ['unknown', 'unavailable'] %}
    *{{ state_attr('weather.wetter_home', 'temperature') }}°C · {{ w }}*
    {% else %}
    *{{ now().strftime('%A, %d. %B') | capitalize }}*
    {% endif %}
  card_mod:
    style: |
      ha-card {
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 4px !important;
        text-align: center;
      }
      @media (min-width: 1100px) {
        ha-card h2 {
          font-size: 2rem !important;
        }
        ha-card p {
          font-size: 1.1rem !important;
        }
      }
      @media (min-width: 1500px) {
        ha-card h2 {
          font-size: 2.25rem !important;
        }
      }

- type: custom:mod-card
  card_mod:
    style: |
      @media (max-width: 899px) {
        button-card $ ha-card$ {
          padding: 16px 0 12px !important;
        }
        button-card $ #name$ {
          font-size: 15px !important;
          margin-top: 12px !important;
        }
        button-card $ #state$ {
          font-size: 13px !important;
        }
        button-card $ #img-cell$ {
          width: 52px !important;
          height: 52px !important;
        }
        button-card $ ha-icon$ {
          width: 24px !important;
          height: 24px !important;
        }
      }
      @media (min-width: 900px) {
        button-card $ ha-card$ {
          padding: 14px 0 10px !important;
        }
        button-card $ #name$ {
          font-size: 15px !important;
          margin-top: 12px !important;
        }
        button-card $ #state$ {
          font-size: 13px !important;
        }
        button-card $ #img-cell$ {
          width: 48px !important;
          height: 48px !important;
        }
        button-card $ ha-icon$ {
          width: 22px !important;
          height: 22px !important;
        }
      }
      @media (min-width: 1100px) {
        button-card $ ha-card$ {
          padding: 18px 0 14px !important;
        }
        button-card $ #name$ {
          font-size: 16px !important;
          margin-top: 14px !important;
        }
        button-card $ #state$ {
          font-size: 14px !important;
        }
        button-card $ #img-cell$ {
          width: 56px !important;
          height: 56px !important;
        }
        button-card $ ha-icon$ {
          width: 26px !important;
          height: 26px !important;
        }
      }
      @media (min-width: 1500px) {
        button-card $ ha-card$ {
          padding: 22px 0 16px !important;
        }
        button-card $ #name$ {
          font-size: 17px !important;
        }
        button-card $ #img-cell$ {
          width: 64px !important;
          height: 64px !important;
        }
        button-card $ ha-icon$ {
          width: 30px !important;
          height: 30px !important;
        }
      }
  card:
    type: grid
    columns: 1
    square: false
    card_mod:
      style: |
        @media (max-width: 899px) {
          #root {
            grid-template-columns: 1fr !important;
            gap: 20px !important;
          }
        }
        @media (min-width: 900px) {
          #root {
            grid-template-columns: 1fr 1fr !important;
            gap: 24px !important;
          }
        }
        @media (min-width: 1100px) {
          #root {
            gap: 32px !important;
          }
        }
    cards:
      - type: vertical-stack
        cards:
          - type: custom:button-card
            template: card_title
            name: Szenen
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                name: Voll
                icon: mdi:ceiling-light
                show_name: true
                show_icon: true
                styles:
                  card:
                    - border-radius: var(--border-radius)
                    - box-shadow: var(--box-shadow)
                    - padding: 10px 0 8px
                  grid:
                    - grid-template-areas: "'i' 'n'"
                  name:
                    - justify-self: center
                    - font-weight: bold
                    - font-size: 14px
                    - margin-top: 10px
                  img_cell:
                    - width: 42px
                    - height: 42px
                    - border-radius: 50%
                    - background-color: rgba(var(--color-yellow), 0.2)
                  icon:
                    - color: rgba(var(--color-yellow), 1)
                    - width: 20px
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.wohnzimmer_volle_beluechtung
              - type: custom:button-card
                name: TV
                icon: mdi:television
                show_name: true
                show_icon: true
                styles:
                  card:
                    - border-radius: var(--border-radius)
                    - box-shadow: var(--box-shadow)
                    - padding: 10px 0 8px
                  grid:
                    - grid-template-areas: "'i' 'n'"
                  name:
                    - justify-self: center
                    - font-weight: bold
                    - font-size: 14px
                    - margin-top: 10px
                  img_cell:
                    - width: 42px
                    - height: 42px
                    - border-radius: 50%
                    - background-color: rgba(var(--color-purple), 0.2)
                  icon:
                    - color: rgba(var(--color-purple), 1)
                    - width: 20px
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.wohnzimmer_fehrnsehen
              - type: custom:button-card
                name: Alle aus
                icon: mdi:lightbulb-off-outline
                show_name: true
                show_icon: true
                styles:
                  card:
                    - border-radius: var(--border-radius)
                    - box-shadow: var(--box-shadow)
                    - padding: 10px 0 8px
                  grid:
                    - grid-template-areas: "'i' 'n'"
                  name:
                    - justify-self: center
