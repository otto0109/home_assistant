- type: markdown
  content: |
    {% set hour = now().hour %}
    {% if hour >= 18 %}
      {% set greet = 'Guten Abend' %}
    {% elif hour >= 12 %}
      {% set greet = 'Guten Tag' %}
    {% elif hour >= 5 %}
      {% set greet = 'Guten Morgen' %}
    {% else %}
      {% set greet = 'Hallo' %}
    {% endif %}
    {% set name = user.split(' ')[0] %}
    ## {{ greet }}, {{ name }}!
    {% set w = states('weather.wetter_home') %}
    {% if w not in ['unknown', 'unavailable'] %}
    *{{ state_attr('weather.wetter_home', 'temperature') }}°C · {{ w }}*
    {% else %}
    *{{ now().strftime('%A, %d. %B') | capitalize }}*
    {% endif %}
  card_mod:
    style: |
      ha-card {
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 4px !important;
        text-align: center;
      }

- type: custom:layout-card
  layout_type: custom:grid-layout
  layout:
    grid-gap: 20px
    grid-template-columns: 1fr
    mediaquery:
      "(min-width: 900px)":
        grid-template-columns: 1fr 1fr
        grid-gap: 28px
  cards:
    - type: custom:expander-card
      expand-id: home-section-szenen
      expanded: true
      clear: true
      clear-children: false
      gap: 20px
      padding: 0
      child-padding: 0
      title-card-padding: 0 0 4px 0
      title-card-button-overlay: true
      overlay-margin: 4px
      button-background: transparent
      card_mod:
        style: |
          ha-card {
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
          }
      title-card:
        type: custom:button-card
        template: card_title
        name: Szenen
        card_mod:
          style: |
            ha-card {
              margin-bottom: 6px !important;
            }
      cards:
        - type: vertical-stack
          cards: !include home-scenes-block.yaml

    - type: custom:expander-card
      expand-id: home-section-status
      expanded: true
      clear: true
      clear-children: false
      gap: 20px
      padding: 0
      child-padding: 0
      title-card-padding: 0 0 4px 0
      title-card-button-overlay: true
      overlay-margin: 4px
      button-background: transparent
      card_mod:
        style: |
          ha-card {
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
          }
      title-card:
        type: custom:button-card
        template: card_title
        name: Status
        card_mod:
          style: |
            ha-card {
              margin-bottom: 6px !important;
            }
      cards:
        - type: vertical-stack
          cards: !include home-status-block.yaml
