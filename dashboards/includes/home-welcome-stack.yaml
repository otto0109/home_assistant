# Gemeinsame Expander-Optik: kein Extra-Hintergrund, Karten unverändert, Chevron rechts.
x-home-expander: &home_expander
  expanded: true
  clear: true
  clear-children: false
  gap: 14px
  padding: 0
  child-padding: 0
  title-card-padding: 0
  title-card-button-overlay: true
  overlay-margin: 4px
  button-background: transparent
  card_mod:
    style: |
      ha-card {
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }

- type: markdown
  content: |
    {% set hour = now().hour %}
    {% if hour >= 18 %}
      {% set greet = 'Guten Abend' %}
    {% elif hour >= 12 %}
      {% set greet = 'Guten Tag' %}
    {% elif hour >= 5 %}
      {% set greet = 'Guten Morgen' %}
    {% else %}
      {% set greet = 'Hallo' %}
    {% endif %}
    {% set name = user.split(' ')[0] %}
    ## {{ greet }}, {{ name }}!
    {% set w = states('weather.wetter_home') %}
    {% if w not in ['unknown', 'unavailable'] %}
    *{{ state_attr('weather.wetter_home', 'temperature') }}°C · {{ w }}*
    {% else %}
    *{{ now().strftime('%A, %d. %B') | capitalize }}*
    {% endif %}
  card_mod:
    style: |
      ha-card {
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 4px !important;
        text-align: center;
      }

- type: custom:layout-card
  layout_type: custom:grid-layout
  layout:
    grid-gap: 20px
    grid-template-columns: 1fr
    grid-template-areas: |
      "scenes"
      "status"
    mediaquery:
      "(min-width: 900px)":
        grid-template-columns: 1fr 1fr
        grid-template-areas: '"scenes status"'
        grid-gap: 28px
  cards:
    - type: custom:expander-card
      <<: *home_expander
      expand-id: home-section-szenen
      view_layout:
        grid-area: scenes
      title-card:
        type: custom:button-card
        template: card_title
        name: Szenen
      cards:
        - type: vertical-stack
          cards: !include home-scenes-block.yaml

    - type: custom:expander-card
      <<: *home_expander
      expand-id: home-section-status
      view_layout:
        grid-area: status
      title-card:
        type: custom:button-card
        template: card_title
        name: Status
      cards:
        - type: vertical-stack
          cards: !include home-status-block.yaml
