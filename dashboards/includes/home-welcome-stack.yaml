type: vertical-stack
cards:
  - type: custom:button-card
    template: card_welcome_scenes
    variables:
      ulm_weather: weather.wetter_home
      entity_1:
        entity_id: scene.wohnzimmer_volle_beluechtung
        icon: mdi:ceiling-light
        name: Voll
        color: yellow
      entity_2:
        entity_id: scene.wohnzimmer_fehrnsehen
        icon: mdi:television
        name: TV
        color: purple
      entity_3:
        entity_id: script.alle_lichter_aus
        icon: mdi:lightbulb-off-outline
        name: Alle aus
        color: red
        state: "off"
  - type: custom:button-card
    template: card_scenes_welcome
    styles:
      card:
        - border-radius: var(--border-radius)
        - box-shadow: none
        - margin-top: "-12px"
        - padding: "0 12px 8px 12px"
    variables:
      entity_1:
        entity_id: sensor.pv_pv_power
        icon: mdi:weather-sunny
        name: Solar
        color: yellow
        state: "on"
        nav_path: energie
      entity_2:
        entity_id: sensor.pv_battery
        icon: mdi:battery-high
        name: Speicher
        color: green
        state: "on"
        nav_path: energie
      entity_3:
        entity_id: sensor.speedtest_download
        icon: mdi:router-wireless
        name: Router
        color: blue
        state: "on"
        nav_path: netzwerk
