- type: markdown
  content: |
    {% set hour = now().hour %}
    {% if hour >= 18 %}
      {% set greet = 'Guten Abend' %}
    {% elif hour >= 12 %}
      {% set greet = 'Guten Tag' %}
    {% elif hour >= 5 %}
      {% set greet = 'Guten Morgen' %}
    {% else %}
      {% set greet = 'Hallo' %}
    {% endif %}
    {% set name = user.split(' ')[0] %}
    ## {{ greet }}, {{ name }}!
    {% set w = states('weather.wetter_home') %}
    {% if w not in ['unknown', 'unavailable'] %}
    *{{ state_attr('weather.wetter_home', 'temperature') }}°C · {{ w }}*
    {% else %}
    *{{ now().strftime('%A, %d. %B') | capitalize }}*
    {% endif %}
  card_mod:
    style: |
      ha-card {
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 4px !important;
        text-align: center;
      }

- type: custom:layout-card
  layout_type: custom:grid-layout
  layout:
    grid-gap: 20px
    grid-template-columns: 1fr
    grid-template-areas: |
      "scenes"
      "status"
    mediaquery:
      "(min-width: 900px)":
        grid-template-columns: 1fr 1fr
        grid-template-areas: '"scenes status"'
        grid-gap: 28px
  cards:
    - type: vertical-stack
      view_layout:
        grid-area: scenes
      cards: !include home-scenes-block.yaml

    - type: vertical-stack
      view_layout:
        grid-area: status
      cards: !include home-status-block.yaml
