                  icon:
                    - color: rgba(var(--color-red), 1)
                    - width: 20px
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.alle_lichter_aus

      - type: vertical-stack
        cards:
          - type: custom:button-card
            template: card_title
            name: Status
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                name: Solar
                icon: mdi:weather-sunny
                entity: sensor.pv_pv_power
                show_name: true
                show_icon: true
                show_state: true
                styles:
                  card:
                    - border-radius: var(--border-radius)
                    - box-shadow: var(--box-shadow)
                    - padding: 10px 0 8px
                  grid:
                    - grid-template-areas: "'i' 'n' 's'"
                  name:
                    - justify-self: center
                    - font-weight: bold
                    - font-size: 14px
                    - margin-top: 10px
                  state:
