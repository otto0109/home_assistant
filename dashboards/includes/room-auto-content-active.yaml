# Raum-Inhalt für input_text.dashboard_active_area (dynamischer Bereich).
type: vertical-stack
cards:
  - type: custom:button-card
    template: card_title
    name: Szenen

  - type: custom:auto-entities
    show_empty: false
    sort:
      method: friendly_name
    card:
      type: grid
      columns: 2
      square: false
    card_param: cards
    filter:
      template: |
        {% set target = states('input_text.dashboard_active_area') %}
        {% if target in ['unknown', 'unavailable', ''] %}
          []
        {% else %}
          {% set ns = namespace(ids=[]) %}
          {% for e in states.scene %}
            {% if area_name(area_id(e.entity_id)) == target %}
              {% set ns.ids = ns.ids + [e.entity_id] %}
            {% endif %}
          {% endfor %}
          {{ ns.ids }}
        {% endif %}
    options: !include scene-button-room.yaml

  - type: custom:button-card
    template: card_title
    name: Beleuchtung

  - type: custom:auto-entities
    show_empty: false
    unique: true
    sort:
      method: friendly_name
    card:
      type: grid
      columns: 1
      square: false
    card_param: cards
    filter:
      template: |
        {% set target = states('input_text.dashboard_active_area') %}
        {% if target in ['unknown', 'unavailable', ''] %}
          []
        {% else %}
          {% set ns = namespace(ids=[]) %}
          {% set light_icons = [
            'mdi:ceiling-light', 'mdi:lightbulb', 'mdi:lightbulb-on', 'mdi:lightbulb-outline',
            'mdi:floor-lamp', 'mdi:wall-sconce', 'mdi:chandelier', 'mdi:track-light',
            'mdi:led-strip', 'mdi:lamps'
          ] %}
          {% for e in states.light %}
            {% if area_name(area_id(e.entity_id)) == target %}
              {% set ns.ids = ns.ids + [e.entity_id] %}
            {% endif %}
          {% endfor %}
          {{ ns.ids }}
        {% endif %}
    options:
      type: custom:mushroom-light-card
      fill_container: true
      show_brightness_control: true
      use_light_color: true
      card_mod:
        style: |
          ha-card {
            border-radius: 20px;
            overflow: hidden;
          }

  - type: custom:auto-entities
    show_empty: false
    unique: true
    sort:
      method: friendly_name
    card:
      type: grid
      columns: 1
      square: false
    card_param: cards
    filter:
      template: |
        {% set target = states('input_text.dashboard_active_area') %}
        {% if target in ['unknown', 'unavailable', ''] %}
          []
        {% else %}
          {% set ns = namespace(ids=[]) %}
          {% set light_icons = [
            'mdi:ceiling-light', 'mdi:lightbulb', 'mdi:lightbulb-on', 'mdi:lightbulb-outline',
            'mdi:floor-lamp', 'mdi:wall-sconce', 'mdi:chandelier', 'mdi:track-light',
            'mdi:led-strip', 'mdi:lamps'
          ] %}
          {% for e in states.switch %}
            {% if area_name(area_id(e.entity_id)) == target %}
              {% set eid = e.entity_id | lower %}
              {% set icon = e.attributes.icon | default('') %}
              {% if 'licht' in eid or 'light' in eid or icon in light_icons %}
                {% set ns.ids = ns.ids + [e.entity_id] %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.ids }}
        {% endif %}
    options: !include switch-as-light-options.yaml

  - type: custom:button-card
    template: card_title
    name: Schalter

  - type: custom:auto-entities
    show_empty: false
    sort:
      method: friendly_name
    card:
      type: grid
      columns: 1
      square: false
    card_param: cards
    filter:
      template: |
        {% set target = states('input_text.dashboard_active_area') %}
        {% if target in ['unknown', 'unavailable', ''] %}
          []
        {% else %}
          {% set ns = namespace(ids=[]) %}
          {% set light_icons = [
            'mdi:ceiling-light', 'mdi:lightbulb', 'mdi:lightbulb-on', 'mdi:lightbulb-outline',
            'mdi:floor-lamp', 'mdi:wall-sconce', 'mdi:chandelier', 'mdi:track-light',
            'mdi:led-strip', 'mdi:lamps'
          ] %}
          {% for e in states.switch %}
            {% if area_name(area_id(e.entity_id)) == target %}
              {% set eid = e.entity_id | lower %}
              {% set icon = e.attributes.icon | default('') %}
              {% if not ('licht' in eid or 'light' in eid or icon in light_icons) %}
                {% set ns.ids = ns.ids + [e.entity_id] %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.ids }}
        {% endif %}
    options:
      type: custom:button-card
      template: card_power_outlet
      card_mod:
        style: |
          ha-card {
            border-radius: 20px;
            overflow: hidden;
          }

  - type: custom:button-card
    template: card_title
    name: Klima

  - type: custom:auto-entities
    show_empty: false
    sort:
      method: friendly_name
    card:
      type: grid
      columns: 1
      square: false
    card_param: cards
    filter:
      template: |
        {% set target = states('input_text.dashboard_active_area') %}
        {% if target in ['unknown', 'unavailable', ''] %}
          []
        {% else %}
          {% set ns = namespace(ids=[]) %}
          {% for e in states.climate %}
            {% if area_name(area_id(e.entity_id)) == target %}
              {% set ns.ids = ns.ids + [e.entity_id] %}
            {% endif %}
          {% endfor %}
          {{ ns.ids }}
        {% endif %}
    options:
      type: custom:button-card
      template: card_thermostat
      card_mod:
        style: |
          ha-card {
            border-radius: 20px;
            overflow: hidden;
            background: var(--ha-card-background) !important;
          }
      variables:
        ulm_card_thermostat_enable_collapse: false
        ulm_card_thermostat_enable_controls: true
        ulm_card_thermostat_enable_hvac_modes: true
        ulm_card_thermostat_enable_popup: true
        ulm_card_thermostat_enable_background_color: false
      extra_styles: |
        ha-card {
          background: var(--ha-card-background) !important;
        }

  - type: custom:button-card
    template: card_title
    name: Aktionen

  - type: custom:auto-entities
    show_empty: false
    sort:
      method: friendly_name
    card:
      type: grid
      columns: 1
      square: false
    card_param: cards
    filter:
      template: |
        {% set target = states('input_text.dashboard_active_area') %}
        {% if target in ['unknown', 'unavailable', ''] %}
          []
        {% else %}
          {% set ns = namespace(ids=[]) %}
          {% for e in states.script %}
            {% if area_name(area_id(e.entity_id)) == target %}
              {% set ns.ids = ns.ids + [e.entity_id] %}
            {% endif %}
          {% endfor %}
          {{ ns.ids }}
        {% endif %}
    options:
      type: custom:button-card
      template: card_vertical_button
      card_mod:
        style: |
          ha-card {
            border-radius: 20px;
            overflow: hidden;
          }
      tap_action:
        action: perform-action
        perform_action: script.turn_on

  - type: custom:button-card
    template: card_title
    name: Geräte

  - type: custom:auto-entities
    show_empty: false
    sort:
      method: friendly_name
    card:
      type: grid
      columns: 1
      square: false
    card_param: cards
    filter:
      template: |
        {% set target = states('input_text.dashboard_active_area') %}
        {% if target in ['unknown', 'unavailable', ''] %}
          []
        {% else %}
          {% set ns = namespace(ids=[]) %}
          {% for domain in ['fan', 'cover', 'media_player', 'vacuum', 'humidifier', 'water_heater'] %}
            {% for e in states[domain] %}
              {% if area_name(area_id(e.entity_id)) == target %}
                {% set ns.ids = ns.ids + [e.entity_id] %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {{ ns.ids }}
        {% endif %}
    options:
      type: custom:mushroom-entity-card
      card_mod:
        style: |
          ha-card {
            border-radius: 20px;
            overflow: hidden;
          }
