# Legacy-Include — nutze home-rooms-sections.yaml (Etagen + einklappbar).
type: custom:auto-entities
show_empty: false
card_param: cards
card:
  type: custom:layout-card
  layout_type: custom:grid-layout
  layout:
    grid-gap: 16px
    grid-template-columns: repeat(2, 1fr)
    mediaquery:
      "(min-width: 900px)":
        grid-template-columns: repeat(4, 1fr)
        grid-gap: 20px
filter:
  template: !include home-rooms-filter.yaml
