# Dynamische Raumkacheln — include/options (wie Szenen) + exclude für 1 Karte pro Bereich.
- type: custom:auto-entities
  show_empty: false
  card_param: cards
  card:
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-gap: 16px
      grid-template-columns: repeat(2, 1fr)
      mediaquery:
        "(min-width: 900px)":
          grid-template-columns: repeat(4, 1fr)
          grid-gap: 20px
  filter:
    include:
      - domain: light
        options: !include home-room-card-options.yaml
      - domain: climate
        options: !include home-room-card-options.yaml
      - domain: switch
        options: !include home-room-card-options.yaml
      - domain: script
        options: !include home-room-card-options.yaml
      - domain: fan
        options: !include home-room-card-options.yaml
      - domain: cover
        options: !include home-room-card-options.yaml
      - entity_id: sensor.pv_pv_power
        options: !include ulm-room-energie-options.yaml
    exclude:
      template: |
        {% set pick_domains = ['light', 'climate', 'switch', 'script', 'fan', 'cover'] %}
        {% set picked = namespace(ids=[]) %}
        {% for aid in areas() | sort %}
          {% set pe = namespace(e=none) %}
          {% for domain in pick_domains %}
            {% if pe.e is none %}
              {% for e in states[domain] | sort(attribute='entity_id') %}
                {% if area_id(e.entity_id) == aid %}
                  {% set pe.e = e.entity_id %}
                {% endif %}
              {% endfor %}
            {% endif %}
          {% endfor %}
          {% if pe.e is not none %}
            {% set picked.ids = picked.ids + [pe.e] %}
          {% endif %}
        {% endfor %}
        {% set ex = namespace(ids=[]) %}
        {% for domain in pick_domains %}
          {% for e in states[domain] %}
            {% if e.entity_id not in picked.ids %}
              {% set ex.ids = ex.ids + [e.entity_id] %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {{ ex.ids }}
