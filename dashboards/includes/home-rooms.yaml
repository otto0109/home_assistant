# Dynamische Raumkacheln — Icons/Chips serverseitig (Jinja), Navigation per JS.
type: custom:auto-entities
show_empty: false
card_param: cards
card:
  type: custom:mod-card
  card_mod:
    style: |
      :host {
        display: block;
        width: 100%;
        min-width: 0;
      }
      @media (min-width: 900px) {
        #root {
          grid-template-columns: repeat(4, 1fr) !important;
        }
      }
  card:
    type: grid
    columns: 2
    square: false
filter:
  template: |
    {% set domains = ['light', 'climate', 'switch', 'script', 'fan', 'cover'] %}
    {% set chip_domains = ['light', 'climate', 'switch', 'fan'] %}
    {% set dreame_by_name = {
      'Wohnzimmer': 'script.dreame_reinigen_wohnzimmer',
      'Esszimmer': 'script.dreame_reinigen_esszimmer',
      'Raum neben der Küche': 'script.dreame_reinigen_kueche',
      'Küche': 'script.dreame_reinigen_kueche',
      'Flur EG': 'script.dreame_reinigen_flur_eg'
    } %}
    {% set dreame_by_id = {
      'wohnzimmer': 'script.dreame_reinigen_wohnzimmer',
      'esszimmer': 'script.dreame_reinigen_esszimmer',
      'raum_neben_der_kuche': 'script.dreame_reinigen_kueche',
      'kueche': 'script.dreame_reinigen_kueche',
      'flur_eg': 'script.dreame_reinigen_flur_eg'
    } %}
    {% set ns = namespace(cards=[], sorted=[]) %}
    {% for aid in areas() %}
      {% set ns.sorted = ns.sorted + [{'aid': aid, 'name': area_name(aid)}] %}
    {% endfor %}
    {% for item in ns.sorted | sort(attribute='name') %}
      {% set aid = item.aid %}
      {% set aname = item.name %}
      {% if aname %}
        {% set picked = namespace(e=none) %}
        {% for domain in domains %}
          {% if picked.e is none %}
            {% for e in states[domain] | sort(attribute='entity_id') %}
              {% if area_id(e.entity_id) == aid %}
                {% set picked.e = e.entity_id %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endfor %}
        {% if picked.e is not none %}
          {% set dom = picked.e.split('.')[0] %}
          {% set chips = namespace(list=[]) %}
          {% for cd in chip_domains %}
            {% for e in states[cd] | sort(attribute='entity_id') %}
              {% if area_id(e.entity_id) == aid and chips.list | length < 2 %}
                {% set eid = e.entity_id %}
                {% if cd == 'light' %}
                  {% set chips.list = chips.list + [{
                    'entity_id': eid,
                    'icon': state_attr(eid, 'icon') or 'mdi:lightbulb',
                    'templates': ['yellow_on'],
                    'tap_action': {'action': 'toggle'}
                  }] %}
                {% elif cd == 'climate' %}
                  {% set chips.list = chips.list + [{
                    'entity_id': eid,
                    'icon': state_attr(eid, 'icon') or 'mdi:snowflake',
                    'templates': ['blue_on'],
                    'tap_action': {'action': 'more-info'}
                  }] %}
                {% elif cd == 'switch' %}
                  {% set chips.list = chips.list + [{
                    'entity_id': eid,
                    'icon': state_attr(eid, 'icon') or 'mdi:light-switch',
                    'templates': ['grey_on'],
                    'tap_action': {'action': 'toggle'}
                  }] %}
                {% elif cd == 'fan' %}
                  {% set chips.list = chips.list + [{
                    'entity_id': eid,
                    'icon': state_attr(eid, 'icon') or 'mdi:fan',
                    'templates': ['green_on'],
                    'tap_action': {'action': 'toggle'}
                  }] %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {% set dreame_eid = dreame_by_name.get(aname) or dreame_by_id.get(aid) %}
          {% if dreame_eid and dreame_eid in states %}
            {% set chips.list = chips.list + [{
              'entity_id': dreame_eid,
              'icon': state_attr(dreame_eid, 'icon') or 'mdi:broom',
              'templates': ['green_on'],
              'tap_action': {
                'action': 'call-service',
                'service': 'script.turn_on',
                'service_data': {'entity_id': dreame_eid}
              }
            }] %}
          {% endif %}
          {% set tap = "[[[ hass.callService('script', 'turn_on', { entity_id: 'script.dashboard_raum_oeffnen', variables: { area: " ~ (aname | tojson) ~ " } }); return { action: 'navigate', navigation_path: 'raum' }; ]]]" %}
          {% set icon = "[[[ return hass.areas[" ~ (aid | tojson) ~ "]?.icon || entity.attributes.icon || 'mdi:home-floor-1'; ]]]" %}
          {% set ns.cards = ns.cards + [{
            'type': 'custom:button-card',
            'template': ['card_room', 'grey_no_state'],
            'entity': picked.e,
            'name': aname,
            'icon': icon,
            'double_tap_action': {'action': 'none'},
            'tap_action': tap,
            'variables': {
              'ulm_room_area_id': aid,
              'label_use_temperature': dom == 'climate' and state_attr(picked.e, 'current_temperature') is not none,
              'label_use_brightness': dom == 'light',
              'entity_1': chips.list[0] if chips.list | length > 0 else false,
              'entity_2': chips.list[1] if chips.list | length > 1 else false,
              'entity_3': chips.list[2] if chips.list | length > 2 else false
            }
          }] %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {% set energie = {
      'type': 'custom:button-card',
      'template': ['card_room', 'purple_no_state'],
      'name': 'Energie',
      'entity': 'sensor.pv_pv_power',
      'icon': 'mdi:solar-power-variant',
      'double_tap_action': {'action': 'none'},
      'tap_action': {'action': 'navigate', 'navigation_path': 'energie'},
      'variables': {
        'label_use_temperature': false,
        'label_use_brightness': false,
        'entity_1': {
          'entity_id': 'sensor.pv_battery',
          'icon': 'mdi:battery-high',
          'templates': ['green_on'],
          'tap_action': {'action': 'navigate', 'navigation_path': 'energie'}
        },
        'entity_2': {
          'entity_id': 'sensor.pv_netzleistung',
          'icon': 'mdi:transmission-tower',
          'templates': ['blue_on'],
          'tap_action': {'action': 'navigate', 'navigation_path': 'energie'}
        },
        'entity_3': {
          'entity_id': 'sensor.pv_activepower_load_sys',
          'icon': 'mdi:home-lightning-bolt',
          'templates': ['yellow_on'],
          'tap_action': {'action': 'navigate', 'navigation_path': 'energie'}
        }
      }
    } %}
    {{ ns.cards + [energie] }}
