# Ein auto-entities-Block: Template liefert vollständige button-cards (kein include in filter).
type: custom:auto-entities
show_empty: false
card_param: cards
card:
  type: custom:layout-card
  layout_type: custom:grid-layout
  layout:
    grid-gap: 16px
    grid-template-columns: repeat(2, 1fr)
    mediaquery:
      "(min-width: 900px)":
        grid-template-columns: repeat(4, 1fr)
        grid-gap: 20px
filter:
  template: |
    {% set domains = ['light', 'climate', 'switch', 'script', 'fan', 'cover'] %}
    {% set ns = namespace(cards=[]) %}
    {% for aid in areas() | sort %}
      {% set aname = area_name(aid) %}
      {% if aname %}
        {% set picked = namespace(e=none) %}
        {% for domain in domains %}
          {% if picked.e is none %}
            {% for e in states[domain] | sort(attribute='entity_id') %}
              {% if area_id(e.entity_id) == aid %}
                {% set picked.e = e.entity_id %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endfor %}
        {% if picked.e is not none %}
          {% set dom = picked.e.split('.')[0] %}
          {% set tap = "[[[ hass.callService('script', 'turn_on', { entity_id: 'script.dashboard_raum_oeffnen', variables: { area: " ~ (aname | tojson) ~ " } }); return { action: 'navigate', navigation_path: 'raum' }; ]]]" %}
          {% set icon_js = "[[[ const id = entity.entity_id; const aid = hass.entities[id]?.area_id; return (aid && hass.areas[aid]?.icon) || entity.attributes.icon || 'mdi:home-floor-1'; ]]]" %}
          {% set chip_js = "const areaId = hass.entities[entity.entity_id]?.area_id; if (!areaId) return false; const order = { light: 0, climate: 1, switch: 2, script: 3, fan: 4 }; const chip = (eid) => { const d = eid.split('.')[0]; const ic = hass.states[eid]?.attributes?.icon; if (d === 'climate') return { entity_id: eid, icon: ic || 'mdi:snowflake', templates: ['blue_on'], tap_action: { action: 'more-info' } }; if (d === 'script') return { entity_id: eid, icon: ic || 'mdi:broom', templates: ['green_on'], tap_action: { action: 'call-service', service: 'script.turn_on', service_data: { entity_id: eid } } }; if (d === 'light') return { entity_id: eid, icon: ic || 'mdi:lightbulb', templates: ['yellow_on'], tap_action: { action: 'toggle' } }; if (d === 'switch') return { entity_id: eid, icon: ic || 'mdi:light-switch', templates: ['grey_on'], tap_action: { action: 'toggle' } }; if (d === 'fan') return { entity_id: eid, icon: ic || 'mdi:fan', templates: ['green_on'], tap_action: { action: 'toggle' } }; return false; }; const ids = Object.keys(hass.states).filter((eid) => { const d = eid.split('.')[0]; return order[d] !== undefined && hass.entities[eid]?.area_id === areaId; }).sort((a, b) => order[a.split('.')[0]] - order[b.split('.')[0]] || a.localeCompare(b)).slice(0, 3);" %}
          {% set ns.cards = ns.cards + [{
            'type': 'custom:button-card',
            'template': ['card_room', 'grey_no_state'],
            'entity': picked.e,
            'name': aname,
            'icon': icon_js,
            'double_tap_action': {'action': 'none'},
            'tap_action': tap,
            'variables': {
              'label_use_temperature': dom == 'climate' and state_attr(picked.e, 'current_temperature') is not none,
              'label_use_brightness': dom == 'light',
              'entity_1': "[[[ " ~ chip_js ~ " return ids[0] ? chip(ids[0]) : false; ]]]",
              'entity_2': "[[[ " ~ chip_js ~ " return ids[1] ? chip(ids[1]) : false; ]]]",
              'entity_3': "[[[ " ~ chip_js ~ " return ids[2] ? chip(ids[2]) : false; ]]]"
            }
          }] %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {% set energie = {
      'type': 'custom:button-card',
      'template': ['card_room', 'purple_no_state'],
      'name': 'Energie',
      'entity': 'sensor.pv_pv_power',
      'icon': 'mdi:solar-power-variant',
      'double_tap_action': {'action': 'none'},
      'tap_action': {'action': 'navigate', 'navigation_path': 'energie'},
      'variables': {
        'label_use_temperature': false,
        'label_use_brightness': false,
        'entity_1': {
          'entity_id': 'sensor.pv_battery',
          'icon': 'mdi:battery-high',
          'templates': ['green_on'],
          'tap_action': {'action': 'navigate', 'navigation_path': 'energie'}
        },
        'entity_2': {
          'entity_id': 'sensor.pv_netzleistung',
          'icon': 'mdi:transmission-tower',
          'templates': ['blue_on'],
          'tap_action': {'action': 'navigate', 'navigation_path': 'energie'}
        },
        'entity_3': {
          'entity_id': 'sensor.pv_activepower_load_sys',
          'icon': 'mdi:home-lightning-bolt',
          'templates': ['yellow_on'],
          'tap_action': {'action': 'navigate', 'navigation_path': 'energie'}
        }
      }
    } %}
    {{ ns.cards + [energie] }}
