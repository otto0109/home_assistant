# Dynamische Raumkacheln — JSON-Array im auto-entities-Template (kein include).
- type: custom:auto-entities
  show_empty: false
  card_param: cards
  card:
    type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-gap: 16px
      grid-template-columns: repeat(2, 1fr)
      mediaquery:
        "(min-width: 900px)":
          grid-template-columns: repeat(4, 1fr)
          grid-gap: 20px
  filter:
    template: |
      [
      {%- set domains = ['light', 'climate', 'switch', 'script', 'fan', 'cover'] -%}
      {%- set ns = namespace(first=true) -%}
      {%- for aid in areas() | sort -%}
        {%- set aname = area_name(aid) -%}
        {%- if aname -%}
          {%- set picked = namespace(e=none) -%}
          {%- for domain in domains -%}
            {%- if picked.e is none -%}
              {%- for e in states[domain] | sort(attribute='entity_id') -%}
                {%- if area_id(e.entity_id) == aid -%}
                  {%- set picked.e = e.entity_id -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
          {%- if picked.e is not none -%}
            {%- set dom = picked.e.split('.')[0] -%}
            {%- set use_temp = dom == 'climate' and state_attr(picked.e, 'current_temperature') is not none -%}
            {%- set use_bri = dom == 'light' -%}
            {%- if not ns.first -%},{%- endif -%}
            {%- set ns.first = false -%}
            {
              "type": "custom:button-card",
              "template": ["card_room", "grey_no_state"],
              "entity": {{ picked.e | tojson }},
              "name": {{ aname | tojson }},
              "icon": "mdi:home-floor-1",
              "double_tap_action": {"action": "none"},
              "tap_action": {"action": "navigate", "navigation_path": "raum"},
              "variables": {
                "label_use_temperature": {{ use_temp | tojson }},
                "label_use_brightness": {{ use_bri | tojson }}
              }
            }
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if not ns.first -%},{%- endif -%}
      {
        "type": "custom:button-card",
        "template": ["card_room", "purple_no_state"],
        "name": "Energie",
        "entity": "sensor.pv_pv_power",
        "icon": "mdi:solar-power-variant",
        "double_tap_action": {"action": "none"},
        "tap_action": {"action": "navigate", "navigation_path": "energie"},
        "variables": {
          "label_use_temperature": false,
          "label_use_brightness": false,
          "entity_1": {
            "entity_id": "sensor.pv_battery",
            "icon": "mdi:battery-high",
            "templates": ["green_on"],
            "tap_action": {"action": "navigate", "navigation_path": "energie"}
          },
          "entity_2": {
            "entity_id": "sensor.pv_netzleistung",
            "icon": "mdi:transmission-tower",
            "templates": ["blue_on"],
            "tap_action": {"action": "navigate", "navigation_path": "energie"}
          },
          "entity_3": {
            "entity_id": "sensor.pv_activepower_load_sys",
            "icon": "mdi:home-lightning-bolt",
            "templates": ["yellow_on"],
            "tap_action": {"action": "navigate", "navigation_path": "energie"}
          }
        }
      }
      ]
