# Dynamische Raumkacheln — Bereich, Icon und Shortcut-Chips aus HA-Bereichen.
- type: custom:auto-entities
  show_empty: false
  card_param: card
  card:
    type: custom:button-card
    template:
      - card_room
      - grey_no_state
  filter:
    template: |
      {% set ns = namespace(items=[]) %}
      {% set domains = ['light', 'climate', 'switch', 'script', 'fan', 'cover'] %}
      {% set area_names = areas() | map('area_name') | list | sort %}
      {% for aname in area_names %}
        {% if aname %}
          {% set aid = namespace(id=none) %}
          {% for candidate in areas() %}
            {% if area_name(candidate) == aname %}
              {% set aid.id = candidate %}
            {% endif %}
          {% endfor %}
          {% if aid.id is not none %}
            {% set picked = namespace(e=none) %}
            {% for domain in domains %}
              {% if picked.e is none %}
                {% for e in states[domain] | sort(attribute='entity_id') %}
                  {% if area_id(e.entity_id) == aid.id %}
                    {% set picked.e = e.entity_id %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {% if picked.e is not none %}
              {% set ns.items = ns.items + [picked.e] %}
            {% endif %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ ns.items }}
  options: !include home-room-card-options.yaml

- !include ulm-room-energie.yaml
