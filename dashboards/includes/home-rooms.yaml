# Dynamische Raumkacheln — ein card_room pro HA-Bereich (name/icon/chips per Jinja).
- type: custom:auto-entities
  show_empty: false
  card_param: card
  card:
    type: custom:button-card
    template:
      - card_room
      - grey_no_state
    double_tap_action:
      action: none
    variables:
      label_use_temperature: false
      label_use_brightness: false
  filter:
    template: |
      {% set domains = ['light', 'climate', 'switch', 'script', 'fan', 'cover'] %}
      {% set chip_domains = ['light', 'climate', 'switch', 'script', 'fan'] %}
      {% set ns = namespace(items=[]) %}
      {% for aid in areas() | sort %}
        {% set aname = area_name(aid) %}
        {% if aname %}
          {% set picked = namespace(e=none) %}
          {% for domain in domains %}
            {% if picked.e is none %}
              {% for e in states[domain] | sort(attribute='entity_id') %}
                {% if area_id(e.entity_id) == aid %}
                  {% set picked.e = e.entity_id %}
                {% endif %}
              {% endfor %}
            {% endif %}
          {% endfor %}
          {% if picked.e is not none %}
            {% set chips = namespace(ids=[]) %}
            {% for cd in chip_domains %}
              {% for e in states[cd] | sort(attribute='entity_id') %}
                {% if area_id(e.entity_id) == aid and chips.ids | length < 3 %}
                  {% set chips.ids = chips.ids + [e.entity_id] %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {% set vars = namespace(data={
              'label_use_temperature': picked.e.split('.')[0] == 'climate' and state_attr(picked.e, 'current_temperature') is not none,
              'label_use_brightness': picked.e.split('.')[0] == 'light'
            }) %}
            {% for i in range(chips.ids | length) %}
              {% set eid = chips.ids[i] %}
              {% set dom = eid.split('.')[0] %}
              {% set ic = state_attr(eid, 'icon') | default('', true) %}
              {% if dom == 'climate' %}
                {% set chip = {
                  'entity_id': eid,
                  'icon': ic if ic else 'mdi:snowflake',
                  'templates': ['blue_on'],
                  'tap_action': {'action': 'more-info'}
                } %}
              {% elif dom == 'script' %}
                {% set chip = {
                  'entity_id': eid,
                  'icon': ic if ic else 'mdi:broom',
                  'templates': ['green_on'],
                  'tap_action': {
                    'action': 'call-service',
                    'service': 'script.turn_on',
                    'service_data': {'entity_id': eid}
                  }
                } %}
              {% elif dom == 'light' %}
                {% set chip = {
                  'entity_id': eid,
                  'icon': ic if ic else 'mdi:lightbulb',
                  'templates': ['yellow_on'],
                  'tap_action': {'action': 'toggle'}
                } %}
              {% elif dom == 'switch' %}
                {% set chip = {
                  'entity_id': eid,
                  'icon': ic if ic else 'mdi:light-switch',
                  'templates': ['grey_on'],
                  'tap_action': {'action': 'toggle'}
                } %}
              {% elif dom == 'fan' %}
                {% set chip = {
                  'entity_id': eid,
                  'icon': ic if ic else 'mdi:fan',
                  'templates': ['green_on'],
                  'tap_action': {'action': 'toggle'}
                } %}
              {% else %}
                {% set chip = none %}
              {% endif %}
              {% if chip is not none %}
                {% if i == 0 %}
                  {% set vars.data = vars.data | combine({'entity_1': chip}) %}
                {% elif i == 1 %}
                  {% set vars.data = vars.data | combine({'entity_2': chip}) %}
                {% elif i == 2 %}
                  {% set vars.data = vars.data | combine({'entity_3': chip}) %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% set tap_js = "[[[ hass.callService('input_text', 'set_value', { entity_id: 'input_text.dashboard_active_area', value: " ~ (aname | tojson) ~ " }); return { action: 'navigate', navigation_path: 'raum' }; ]]]" %}
            {% set icon_js = "[[[ const aid = hass.entities[entity.entity_id]?.area_id; return (aid && hass.areas[aid]?.icon) || 'mdi:home-floor-1'; ]]]" %}
            {% set ns.items = ns.items + [{
              'entity_id': picked.e,
              'options': {
                'name': aname,
                'icon': icon_js,
                'variables': vars.data,
                'tap_action': tap_js,
                'double_tap_action': {'action': 'none'}
              }
            }] %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ ns.items }}

- !include ulm-room-energie.yaml
