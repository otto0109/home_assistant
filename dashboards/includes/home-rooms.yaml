# Dynamische Raumkacheln — card_param:cards → layout-card (nicht mod-card!).
type: custom:auto-entities
show_empty: false
card_param: cards
card:
  type: custom:layout-card
  layout_type: custom:grid-layout
  layout:
    grid-gap: 16px
    grid-template-columns: repeat(2, 1fr)
    mediaquery:
      "(min-width: 900px)":
        grid-template-columns: repeat(4, 1fr)
        grid-gap: 20px
filter:
  template: |
    {% set domains = ['light', 'climate', 'switch', 'script', 'fan', 'cover'] %}
    {% set chip_domains = ['light', 'climate', 'switch', 'fan'] %}
    {% set palette_idle = ['yellow_no_state', 'pink_no_state', 'red_no_state', 'purple_no_state', 'grey_no_state', 'blue_no_state', 'green_no_state'] %}
    {% set palette_active = ['yellow_on', 'pink_on', 'red_on', 'purple_on', 'grey_on', 'blue_on', 'green_on'] %}
    {% set ns = namespace(cards=[], sorted=[]) %}
    {% for aid in areas() %}
      {% set ns.sorted = ns.sorted + [{'aid': aid, 'name': area_name(aid)}] %}
    {% endfor %}
    {% for item in ns.sorted | sort(attribute='name') %}
      {% set aid = item.aid %}
      {% set aname = item.name %}
      {% if aname %}
        {% set picked = namespace(e=none) %}
        {% for domain in domains %}
          {% if picked.e is none %}
            {% for e in states[domain] | sort(attribute='entity_id') %}
              {% if area_id(e.entity_id) == aid and not is_hidden_entity(e.entity_id) %}
                {% set picked.e = e.entity_id %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endfor %}
        {% if picked.e is not none %}
          {% set dom = picked.e.split('.')[0] %}
          {% set chips = namespace(list=[]) %}
          {% for cd in chip_domains %}
            {% for e in states[cd] | sort(attribute='entity_id') %}
              {% if area_id(e.entity_id) == aid and not is_hidden_entity(e.entity_id) and chips.list | length < 2 %}
                {% set eid = e.entity_id %}
                {% if cd == 'light' %}
                  {% set chips.list = chips.list + [{
                    'entity_id': eid,
                    'icon': state_attr(eid, 'icon') or 'mdi:lightbulb',
                    'templates': ['yellow_on'] if states(eid) == 'on' else ['yellow_no_state'],
                    'tap_action': {'action': 'toggle'}
                  }] %}
                {% elif cd == 'climate' %}
                  {% set chips.list = chips.list + [{
                    'entity_id': eid,
                    'icon': state_attr(eid, 'icon') or 'mdi:snowflake',
                    'templates': ['blue_on'] if states(eid) not in ['off', 'unavailable', 'unknown'] else ['blue_no_state'],
                    'tap_action': {'action': 'more-info'}
                  }] %}
                {% elif cd == 'switch' %}
                  {% set chips.list = chips.list + [{
                    'entity_id': eid,
                    'icon': state_attr(eid, 'icon') or 'mdi:light-switch',
                    'templates': ['grey_on'] if states(eid) == 'on' else ['grey_no_state'],
                    'tap_action': {'action': 'toggle'}
                  }] %}
                {% elif cd == 'fan' %}
                  {% set chips.list = chips.list + [{
                    'entity_id': eid,
                    'icon': state_attr(eid, 'icon') or 'mdi:fan',
                    'templates': ['green_on'] if states(eid) == 'on' else ['green_no_state'],
                    'tap_action': {'action': 'toggle'}
                  }] %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {% set dreame = namespace(eid='') %}
          {% if aname == 'Wohnzimmer' or aid == 'wohnzimmer' %}
            {% set dreame.eid = 'script.dreame_reinigen_wohnzimmer' %}
          {% elif aname == 'Esszimmer' or aid == 'esszimmer' %}
            {% set dreame.eid = 'script.dreame_reinigen_esszimmer' %}
          {% elif aname == 'Raum neben der Küche' or aname == 'Küche' or aid == 'raum_neben_der_kuche' or aid == 'kueche' %}
            {% set dreame.eid = 'script.dreame_reinigen_kueche' %}
          {% elif aname == 'Flur EG' or aid == 'flur_eg' %}
            {% set dreame.eid = 'script.dreame_reinigen_flur_eg' %}
          {% endif %}
          {% if dreame.eid and not is_hidden_entity(dreame.eid) %}
            {% set chips.list = chips.list + [{
              'entity_id': dreame.eid,
              'icon': state_attr(dreame.eid, 'icon') or 'mdi:broom',
              'templates': ['green_on'],
              'tap_action': {
                'action': 'call-service',
                'service': 'script.turn_on',
                'service_data': {'entity_id': dreame.eid}
              }
            }] %}
          {% endif %}
          {% set area_active = namespace(v=false) %}
          {% for eid in area_entities(aid) %}
            {% if not is_hidden_entity(eid) %}
              {% set st = states(eid) %}
              {% if eid.startswith('light.') and st == 'on' %}
                {% set area_active.v = true %}
              {% elif eid.startswith('switch.') and st == 'on' %}
                {% set area_active.v = true %}
              {% elif eid.startswith('fan.') and st == 'on' %}
                {% set area_active.v = true %}
              {% elif eid.startswith('climate.') and st not in ['off', 'unavailable', 'unknown'] %}
                {% set area_active.v = true %}
              {% elif eid.startswith('cover.') and st not in ['closed', 'unavailable', 'unknown'] %}
                {% set area_active.v = true %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% set room_color = namespace(idle=palette_idle[loop.index0 % 7], active=palette_active[loop.index0 % 7]) %}
          {% if aname == 'Wohnzimmer' or aid == 'wohnzimmer' %}
            {% set room_color.idle = 'yellow_no_state' %}
            {% set room_color.active = 'yellow_on' %}
          {% elif aname == 'Esszimmer' or aid == 'esszimmer' %}
            {% set room_color.idle = 'pink_no_state' %}
            {% set room_color.active = 'pink_on' %}
          {% elif aname == 'Raum neben der Küche' or aname == 'Küche' or aid == 'raum_neben_der_kuche' or aid == 'kueche' %}
            {% set room_color.idle = 'red_no_state' %}
            {% set room_color.active = 'red_on' %}
          {% elif aname == 'Schlafzimmer' or aid == 'schlafzimmer' %}
            {% set room_color.idle = 'purple_no_state' %}
            {% set room_color.active = 'purple_on' %}
          {% elif aname == 'Flur' or aname == 'Flur OG' or aid == 'flur' or aid == 'flur_og' %}
            {% set room_color.idle = 'grey_no_state' %}
            {% set room_color.active = 'grey_on' %}
          {% elif aname == 'Flur EG' or aid == 'flur_eg' %}
            {% set room_color.idle = 'blue_no_state' %}
            {% set room_color.active = 'blue_on' %}
          {% elif aname == 'Garten' or aid == 'garten' %}
            {% set room_color.idle = 'green_no_state' %}
            {% set room_color.active = 'green_on' %}
          {% endif %}
          {% set icon = "[[[ return hass.areas[" ~ (aid | tojson) ~ "]?.icon || entity.attributes.icon || 'mdi:home-floor-1'; ]]]" %}
          {% set ns.cards = ns.cards + [{
            'type': 'custom:button-card',
            'template': ['card_room', room_color.active if area_active.v else room_color.idle],
            'entity': picked.e,
            'name': aname,
            'icon': icon,
            'double_tap_action': {'action': 'none'},
            'tap_action': {
              'action': 'call-service',
              'service': 'script.turn_on',
              'target': {'entity_id': 'script.dashboard_raum_oeffnen'},
              'data': {'variables': {'area': aid}}
            },
            'variables': {
              'ulm_room_area_id': aid,
              'label_use_temperature': dom == 'climate',
              'label_use_brightness': dom == 'light',
              'entity_1': chips.list[0] if chips.list | length > 0 else false,
              'entity_2': chips.list[1] if chips.list | length > 1 else false,
              'entity_3': chips.list[2] if chips.list | length > 2 else false
            }
          }] %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.cards }}
