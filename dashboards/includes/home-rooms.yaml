# Dynamische Raumkacheln — Bereich, Icon und Shortcut-Chips aus HA-Bereichen.
- type: custom:auto-entities
  show_empty: false
  card_param: card
  card:
    type: custom:button-card
    template:
      - card_room
      - grey_no_state
  filter:
    template: |
      {% set ns = namespace(items=[]) %}
      {% set domains = ['light', 'climate', 'switch', 'script', 'fan', 'cover'] %}
      {% set area_names = areas() | map('area_name') | list | sort %}
      {% for aname in area_names %}
        {% if aname %}
          {% set aid = namespace(id=none) %}
          {% for candidate in areas() %}
            {% if area_name(candidate) == aname %}
              {% set aid.id = candidate %}
            {% endif %}
          {% endfor %}
          {% if aid.id is not none %}
            {% set picked = namespace(e=none) %}
            {% for domain in domains %}
              {% if picked.e is none %}
                {% for e in states[domain] | sort(attribute='entity_id') %}
                  {% if area_id(e.entity_id) == aid.id %}
                    {% set picked.e = e.entity_id %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {% if picked.e is not none %}
              {% set ns.items = ns.items + [picked.e] %}
            {% endif %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ ns.items }}
  options:
    name: "[[[ const id = entity.entity_id; const aid = hass.entities[id]?.area_id; return aid && hass.areas[aid] ? hass.areas[aid].name : entity.attributes.friendly_name; ]]]"
    icon: "[[[ const id = entity.entity_id; const aid = hass.entities[id]?.area_id; return (aid && hass.areas[aid]?.icon) || entity.attributes.icon || 'mdi:home-floor-1'; ]]]"
    variables: "[[[ const areaId = hass.entities[entity.entity_id]?.area_id; const domainOrder = { light: 0, climate: 1, switch: 2, script: 3, fan: 4 }; const chip = (eid) => { const d = eid.split('.')[0]; const ic = hass.states[eid]?.attributes?.icon; if (d === 'climate') return { entity_id: eid, icon: ic || 'mdi:snowflake', templates: ['blue_on'], tap_action: { action: 'more-info' } }; if (d === 'script') return { entity_id: eid, icon: ic || 'mdi:broom', templates: ['green_on'], tap_action: { action: 'call-service', service: 'script.turn_on', service_data: { entity_id: eid } } }; if (d === 'light') return { entity_id: eid, icon: ic || 'mdi:lightbulb', templates: ['yellow_on'], tap_action: { action: 'toggle' } }; if (d === 'switch') return { entity_id: eid, icon: ic || 'mdi:light-switch', templates: ['grey_on'], tap_action: { action: 'toggle' } }; if (d === 'fan') return { entity_id: eid, icon: ic || 'mdi:fan', templates: ['green_on'], tap_action: { action: 'toggle' } }; return false; }; let ids = []; if (areaId) { ids = Object.keys(hass.states).filter((eid) => { const d = eid.split('.')[0]; return Object.prototype.hasOwnProperty.call(domainOrder, d) && hass.entities[eid]?.area_id === areaId; }).sort((a, b) => { const da = domainOrder[a.split('.')[0]], db = domainOrder[b.split('.')[0]]; return da !== db ? da - db : a.localeCompare(b); }).slice(0, 3); } return { label_use_temperature: entity.entity_id.startsWith('climate.'), label_use_brightness: entity.entity_id.startsWith('light.'), entity_1: ids[0] ? chip(ids[0]) : false, entity_2: ids[1] ? chip(ids[1]) : false, entity_3: ids[2] ? chip(ids[2]) : false }; ]]]"
    tap_action: "[[[ return (async () => { const id = entity.entity_id; const aid = hass.entities[id]?.area_id; const n = aid && hass.areas[aid] ? hass.areas[aid].name : ''; if (n) await hass.callService('input_text', 'set_value', { entity_id: 'input_text.dashboard_active_area', value: n }); return { action: 'navigate', navigation_path: 'raum' }; })(); ]]]"

- !include ulm-room-energie.yaml
