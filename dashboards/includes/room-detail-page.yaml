- type: custom:mod-card
  card_mod:
    style: |
      ha-card {
        margin: 16px auto 24px auto;
        max-width: 720px;
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
      #root {
        gap: 14px;
      }
  card:
    type: vertical-stack
    cards:
      - type: custom:button-card
        template: card_title
        name: Zurück
        icon: mdi:arrow-left
        tap_action:
          action: navigate
          navigation_path: home

      - type: markdown
        content: |
          {% set aid = states('input_text.dashboard_active_area') | trim %}
          {% if aid in ['unknown', 'unavailable', ''] %}
          ## Raum
          > Bitte von der Übersicht eine Raumkachel antippen.
          {% else %}
          ## {{ area_name(aid) }}
          {% endif %}
        card_mod:
          style: |
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              border: none !important;
              padding: 0 0 4px 0;
            }
            h2 {
              margin: 0;
              font-size: 1.35rem;
              font-weight: 600;
            }

      - type: custom:button-card
        template: card_title
        name: Szenen

      - type: custom:auto-entities
        show_empty: false
        sort:
          method: friendly_name
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          template: |
            {% set target = states('input_text.dashboard_active_area') | trim %}
            {% if target in ['unknown', 'unavailable', ''] %}
              []
            {% else %}
              {% set ns = namespace(cards=[]) %}
              {% for eid in area_entities(target) %}
                {% if eid.startswith('scene.') %}
                  {% set ns.cards = ns.cards + [{
                    'type': 'custom:button-card',
                    'template': 'card_vertical_button',
                    'entity': eid,
                    'show_name': true,
                    'show_state': false,
                    'tap_action': {
                      'action': 'call-service',
                      'service': 'scene.turn_on',
                      'target': {'entity_id': eid}
                    }
                  }] %}
                {% endif %}
              {% endfor %}
              {{ ns.cards }}
            {% endif %}

      - type: custom:button-card
        template: card_title
        name: Beleuchtung

      - type: custom:auto-entities
        show_empty: false
        unique: true
        sort:
          method: friendly_name
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          template: |
            {% set target = states('input_text.dashboard_active_area') | trim %}
            {% if target in ['unknown', 'unavailable', ''] %}
              []
            {% else %}
              {% set ns = namespace(cards=[]) %}
              {% set light_icons = [
                'mdi:ceiling-light', 'mdi:lightbulb', 'mdi:lightbulb-on', 'mdi:lightbulb-outline',
                'mdi:floor-lamp', 'mdi:wall-sconce', 'mdi:chandelier', 'mdi:track-light',
                'mdi:led-strip', 'mdi:lamps'
              ] %}
              {% for eid in area_entities(target) %}
                {% if eid.startswith('light.') %}
                  {% set ns.cards = ns.cards + [{
                    'type': 'custom:mushroom-light-card',
                    'entity': eid,
                    'fill_container': true,
                    'show_brightness_control': true,
                    'use_light_color': true
                  }] %}
                {% elif eid.startswith('switch.') %}
                  {% set e = states[eid] %}
                  {% set eid_lower = eid | lower %}
                  {% set icon = e.attributes.icon | default('') %}
                  {% if 'licht' in eid_lower or 'light' in eid_lower or icon in light_icons %}
                    {% set ns.cards = ns.cards + [{
                      'type': 'custom:mushroom-light-card',
                      'entity': eid,
                      'fill_container': true,
                      'show_brightness_control': true,
                      'use_light_color': true
                    }] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ ns.cards }}
            {% endif %}

      - type: custom:button-card
        template: card_title
        name: Schalter

      - type: custom:auto-entities
        show_empty: false
        sort:
          method: friendly_name
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          template: |
            {% set target = states('input_text.dashboard_active_area') | trim %}
            {% if target in ['unknown', 'unavailable', ''] %}
              []
            {% else %}
              {% set ns = namespace(cards=[]) %}
              {% set light_icons = [
                'mdi:ceiling-light', 'mdi:lightbulb', 'mdi:lightbulb-on', 'mdi:lightbulb-outline',
                'mdi:floor-lamp', 'mdi:wall-sconce', 'mdi:chandelier', 'mdi:track-light',
                'mdi:led-strip', 'mdi:lamps'
              ] %}
              {% for eid in area_entities(target) %}
                {% if eid.startswith('switch.') %}
                  {% set e = states[eid] %}
                  {% set eid_lower = eid | lower %}
                  {% set icon = e.attributes.icon | default('') %}
                  {% if not ('licht' in eid_lower or 'light' in eid_lower or icon in light_icons) %}
                    {% set ns.cards = ns.cards + [{
                      'type': 'custom:button-card',
                      'template': 'card_power_outlet',
                      'entity': eid
                    }] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ ns.cards }}
            {% endif %}

      - type: custom:button-card
        template: card_title
        name: Klima

      - type: custom:auto-entities
        show_empty: false
        sort:
          method: friendly_name
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          template: |
            {% set target = states('input_text.dashboard_active_area') | trim %}
            {% if target in ['unknown', 'unavailable', ''] %}
              []
            {% else %}
              {% set ns = namespace(cards=[]) %}
              {% for eid in area_entities(target) %}
                {% if eid.startswith('climate.') %}
                  {% set ns.cards = ns.cards + [{
                    'type': 'custom:button-card',
                    'template': 'card_thermostat',
                    'entity': eid,
                    'variables': {
                      'ulm_card_thermostat_enable_collapse': false,
                      'ulm_card_thermostat_enable_controls': true,
                      'ulm_card_thermostat_enable_hvac_modes': true,
                      'ulm_card_thermostat_enable_popup': true,
                      'ulm_card_thermostat_enable_background_color': false
                    }
                  }] %}
                {% endif %}
              {% endfor %}
              {{ ns.cards }}
            {% endif %}

      - type: custom:button-card
        template: card_title
        name: Aktionen

      - type: custom:auto-entities
        show_empty: false
        sort:
          method: friendly_name
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          template: |
            {% set target = states('input_text.dashboard_active_area') | trim %}
            {% if target in ['unknown', 'unavailable', ''] %}
              []
            {% else %}
              {% set ns = namespace(cards=[], ids=[]) %}
              {% for eid in area_entities(target) %}
                {% if eid.startswith('script.') %}
                  {% set ns.ids = ns.ids + [eid] %}
                {% endif %}
              {% endfor %}
              {% if target == 'wohnzimmer' %}
                {% set ns.ids = ns.ids + ['script.dreame_reinigen_wohnzimmer'] %}
              {% elif target == 'esszimmer' %}
                {% set ns.ids = ns.ids + ['script.dreame_reinigen_esszimmer'] %}
              {% elif target in ['raum_neben_der_kuche', 'kueche'] %}
                {% set ns.ids = ns.ids + ['script.dreame_reinigen_kueche'] %}
              {% elif target == 'flur_eg' %}
                {% set ns.ids = ns.ids + ['script.dreame_reinigen_flur_eg'] %}
              {% endif %}
              {% for eid in ns.ids | unique %}
                {% set ns.cards = ns.cards + [{
                  'type': 'custom:button-card',
                  'template': 'card_vertical_button',
                  'entity': eid,
                  'tap_action': {
                    'action': 'call-service',
                    'service': 'script.turn_on',
                    'target': {'entity_id': eid}
                  }
                }] %}
              {% endfor %}
              {{ ns.cards }}
            {% endif %}
