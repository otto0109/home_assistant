- type: custom:mod-card
  card_mod:
    style: |
      ha-card {
        margin: 16px auto 32px auto;
        max-width: 720px;
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
      #root {
        gap: 18px;
      }
  card:
    type: vertical-stack
    cards:
      - type: custom:button-card
        template: card_title
        name: "[[[ const a = states['input_text.dashboard_active_area']?.state?.trim(); if (!a || a === 'unknown' || a === 'unavailable') return 'Raum'; return hass.areas[a]?.name || 'Raum'; ]]]"
        label: Zurück zur Übersicht
        icon: "[[[ const a = states['input_text.dashboard_active_area']?.state?.trim(); return (a && hass.areas[a]?.icon) || 'mdi:door-open'; ]]]"
        tap_action:
          action: navigate
          navigation_path: home

      - type: custom:auto-entities
        show_empty: false
        card:
          type: vertical-stack
        card_param: cards
        filter:
          template: |
            {% set target = states('input_text.dashboard_active_area') | trim %}
            {% if target in ['unknown', 'unavailable', ''] %}
              []
            {% else %}
              {% set card_round = 'ha-card { border-radius: 20px; overflow: hidden; }' %}
              {% set out = namespace(cards=[]) %}

              {% set scene_cards = namespace(list=[]) %}
              {% set hues = [
                'blue', 'pink', 'yellow', 'green', 'red', 'purple', 'grey',
                'orange', 'teal', 'cyan', 'indigo', 'lime', 'brown',
                'deep_orange', 'amber', 'light_blue', 'deep_purple'
              ] %}
              {% set prefixes = [target] %}
              {% if target == 'kueche' %}
                {% set prefixes = prefixes + ['raum_neben_der_kuche'] %}
              {% elif target == 'raum_neben_der_kuche' %}
                {% set prefixes = prefixes + ['kueche'] %}
              {% endif %}
              {% for e in states.scene | sort(attribute='friendly_name') %}
                {% set eid = e.entity_id %}
                {% if states(eid) != 'unavailable' and not is_hidden_entity(eid) %}
                  {% set matched = namespace(v=false) %}
                  {% if area_id(eid) == target %}
                    {% set matched.v = true %}
                  {% else %}
                    {% for p in prefixes %}
                      {% if eid.startswith('scene.' + p + '_') %}
                        {% set matched.v = true %}
                      {% endif %}
                    {% endfor %}
                  {% endif %}
                  {% if matched.v %}
                    {% set slug = eid.split('.')[1] | default('') %}
                    {% set hash = namespace(v=0) %}
                    {% for ch in slug %}
                      {% set hash.v = (hash.v * 31 + loop.index0) %}
                    {% endfor %}
                    {% set hash.v = hash.v + (slug | length) * 17 %}
                    {% set hue = hues[hash.v % (hues | length)] %}
                    {% set scene_cards.list = scene_cards.list + [{
                      'type': 'custom:button-card',
                      'template': 'scene_tile_' ~ hue,
                      'entity': eid,
                      'name': state_attr(eid, 'friendly_name') or eid,
                      'tap_action': {
                        'action': 'perform-action',
                        'perform_action': 'scene.turn_on',
                        'target': {'entity_id': eid}
                      }
                    }] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {% if scene_cards.list | length > 0 %}
                {% set out.cards = out.cards + [
                  {'type': 'custom:button-card', 'template': 'card_title', 'name': 'Szenen'},
                  {'type': 'grid', 'columns': 2, 'square': false, 'cards': scene_cards.list}
                ] %}
              {% endif %}

              {% set light_cards = namespace(list=[]) %}
              {% for eid in area_entities(target) %}
                {% if eid.startswith('light.') and not is_hidden_entity(eid) %}
                  {% set light_cards.list = light_cards.list + [{
                    'type': 'custom:mod-card',
                    'card_mod': {'style': card_round},
                    'card': {
                      'type': 'custom:mushroom-light-card',
                      'entity': eid,
                      'fill_container': true,
                      'show_brightness_control': true,
                      'use_light_color': true
                    }
                  }] %}
                {% endif %}
              {% endfor %}
              {% if light_cards.list | length > 0 %}
                {% set out.cards = out.cards + [
                  {'type': 'custom:button-card', 'template': 'card_title', 'name': 'Beleuchtung'}
                ] + light_cards.list %}
              {% endif %}

              {% set switch_cards = namespace(list=[]) %}
              {% for eid in area_entities(target) %}
                {% if eid.startswith('switch.') and not is_hidden_entity(eid) %}
                  {% set switch_cards.list = switch_cards.list + [{
                    'type': 'custom:mod-card',
                    'card_mod': {'style': card_round},
                    'card': {
                      'type': 'custom:button-card',
                      'template': 'card_power_outlet',
                      'entity': eid
                    }
                  }] %}
                {% endif %}
              {% endfor %}
              {% if switch_cards.list | length > 0 %}
                {% set out.cards = out.cards + [
                  {'type': 'custom:button-card', 'template': 'card_title', 'name': 'Schalter'}
                ] + switch_cards.list %}
              {% endif %}

              {% set climate_cards = namespace(list=[]) %}
              {% for eid in area_entities(target) %}
                {% if eid.startswith('climate.') and not is_hidden_entity(eid) %}
                  {% set climate_cards.list = climate_cards.list + [{
                    'type': 'custom:mod-card',
                    'card_mod': {'style': card_round ~ ' ha-card { background: var(--ha-card-background) !important; }'},
                    'card': {
                      'type': 'custom:button-card',
                      'template': 'card_thermostat',
                      'entity': eid,
                      'variables': {
                        'ulm_card_thermostat_enable_collapse': false,
                        'ulm_card_thermostat_enable_controls': true,
                        'ulm_card_thermostat_enable_hvac_modes': true,
                        'ulm_card_thermostat_enable_popup': true,
                        'ulm_card_thermostat_enable_background_color': false
                      }
                    }
                  }] %}
                {% endif %}
              {% endfor %}
              {% if climate_cards.list | length > 0 %}
                {% set out.cards = out.cards + [
                  {'type': 'custom:button-card', 'template': 'card_title', 'name': 'Klima'}
                ] + climate_cards.list %}
              {% endif %}

              {% set action_ids = namespace(list=[]) %}
              {% for eid in area_entities(target) %}
                {% if eid.startswith('script.') and not is_hidden_entity(eid) %}
                  {% set action_ids.list = action_ids.list + [eid] %}
                {% endif %}
              {% endfor %}
              {% if target == 'wohnzimmer' and not is_hidden_entity('script.dreame_reinigen_wohnzimmer') %}
                {% set action_ids.list = action_ids.list + ['script.dreame_reinigen_wohnzimmer'] %}
              {% elif target == 'esszimmer' and not is_hidden_entity('script.dreame_reinigen_esszimmer') %}
                {% set action_ids.list = action_ids.list + ['script.dreame_reinigen_esszimmer'] %}
              {% elif target in ['raum_neben_der_kuche', 'kueche'] and not is_hidden_entity('script.dreame_reinigen_kueche') %}
                {% set action_ids.list = action_ids.list + ['script.dreame_reinigen_kueche'] %}
              {% elif target == 'flur_eg' and not is_hidden_entity('script.dreame_reinigen_flur_eg') %}
                {% set action_ids.list = action_ids.list + ['script.dreame_reinigen_flur_eg'] %}
              {% endif %}
              {% set action_cards = namespace(list=[]) %}
              {% for eid in action_ids.list | unique %}
                {% set action_cards.list = action_cards.list + [{
                  'type': 'custom:mod-card',
                  'card_mod': {'style': card_round},
                  'card': {
                    'type': 'custom:button-card',
                    'template': 'card_vertical_button',
                    'entity': eid,
                    'tap_action': {
                      'action': 'call-service',
                      'service': 'script.turn_on',
                      'target': {'entity_id': eid}
                    }
                  }
                }] %}
              {% endfor %}
              {% if action_cards.list | length > 0 %}
                {% set out.cards = out.cards + [
                  {'type': 'custom:button-card', 'template': 'card_title', 'name': 'Aktionen'}
                ] + action_cards.list %}
              {% endif %}

              {{ out.cards }}
            {% endif %}
