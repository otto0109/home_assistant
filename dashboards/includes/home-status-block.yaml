- type: custom:button-card
  template: card_title
  name: Status

- type: grid
  columns: 3
  square: false
  cards:
    - type: custom:button-card
      name: Solar
      icon: mdi:weather-sunny
      entity: sensor.pv_pv_power
      show_name: true
      show_icon: true
      show_state: true
      styles:
        card:
          - border-radius: var(--border-radius)
          - box-shadow: var(--box-shadow)
          - padding: 14px 0 10px
        grid:
          - grid-template-areas: "'i' 'n' 's'"
        name:
          - justify-self: center
          - font-weight: bold
          - font-size: 15px
          - margin-top: 12px
        state:
          - justify-self: center
          - font-size: 13px
          - opacity: 0.7
        img_cell:
          - width: 50px
          - height: 50px
          - border-radius: 50%
          - background-color: rgba(var(--color-yellow), 0.2)
        icon:
          - color: rgba(var(--color-yellow), 1)
          - width: 24px
      tap_action:
        action: navigate
        navigation_path: /home-dashboard/energie
    - type: custom:button-card
      name: Speicher
      icon: mdi:battery-high
      entity: sensor.pv_battery
      show_name: true
      show_icon: true
      show_state: true
      styles:
        card:
          - border-radius: var(--border-radius)
          - box-shadow: var(--box-shadow)
          - padding: 14px 0 10px
        grid:
          - grid-template-areas: "'i' 'n' 's'"
        name:
          - justify-self: center
          - font-weight: bold
          - font-size: 15px
          - margin-top: 12px
        state:
          - justify-self: center
          - font-size: 13px
          - opacity: 0.7
        img_cell:
          - width: 50px
          - height: 50px
          - border-radius: 50%
          - background-color: rgba(var(--color-green), 0.2)
        icon:
          - color: rgba(var(--color-green), 1)
          - width: 24px
      tap_action:
        action: navigate
        navigation_path: /home-dashboard/energie
    - type: custom:button-card
      name: Router
      icon: mdi:router-wireless
      entity: sensor.speedtest_download
      show_name: true
      show_icon: true
      show_state: true
      styles:
        card:
          - border-radius: var(--border-radius)
          - box-shadow: var(--box-shadow)
          - padding: 14px 0 10px
        grid:
          - grid-template-areas: "'i' 'n' 's'"
        name:
          - justify-self: center
          - font-weight: bold
          - font-size: 15px
          - margin-top: 12px
        state:
          - justify-self: center
          - font-size: 13px
          - opacity: 0.7
        img_cell:
          - width: 50px
          - height: 50px
          - border-radius: 50%
          - background-color: rgba(var(--color-blue), 0.2)
        icon:
          - color: rgba(var(--color-blue), 1)
          - width: 24px
      tap_action:
        action: navigate
        navigation_path: /home-dashboard/netzwerk

- type: custom:auto-entities
  show_empty: false
  card:
    type: grid
    columns: 3
    square: false
  card_param: cards
  filter:
    template: |
      {% set ns = namespace(cards=[]) %}
      {% set hues = [
        'blue', 'pink', 'yellow', 'green', 'red', 'purple', 'grey',
        'orange', 'teal', 'cyan', 'indigo', 'lime', 'brown',
        'deep_orange', 'amber', 'light_blue', 'deep_purple'
      ] %}
      {% for e in states.todo | sort(attribute='entity_id') %}
        {% set eid = e.entity_id %}
        {% if states(eid) not in ['unavailable', 'unknown'] %}
          {% set slug = eid.split('.')[1] | default('') %}
          {% set hash = namespace(v=0) %}
          {% for ch in slug %}
            {% set hash.v = (hash.v * 31 + loop.index0) %}
          {% endfor %}
          {% set hash.v = hash.v + (slug | length) * 17 %}
          {% set hue = hues[hash.v % (hues | length)] %}
          {% set ns.cards = ns.cards + [{
            'type': 'custom:button-card',
            'template': 'status_tile_' ~ hue,
            'entity': eid,
            'name': state_attr(eid, 'friendly_name') or eid,
            'tap_action': {
              'action': 'navigate',
              'navigation_path': '/todo?entity_id=' ~ eid
            }
          }] %}
        {% endif %}
      {% endfor %}
      {% set cal = 'calendar.thorge_3_laura' %}
      {% set slug = cal.split('.')[1] | default('') %}
      {% set hash = namespace(v=0) %}
      {% for ch in slug %}
        {% set hash.v = (hash.v * 31 + loop.index0) %}
      {% endfor %}
      {% set hash.v = hash.v + (slug | length) * 17 %}
      {% set cal_hue = hues[hash.v % (hues | length)] %}
      {% set ns.cards = ns.cards + [{
        'type': 'custom:button-card',
        'template': ['status_tile_' ~ cal_hue, 'status_tile_calendar_label'],
        'entity': cal,
        'name': 'Kalender',
        'icon': 'mdi:calendar',
        'tap_action': {
          'action': 'navigate',
          'navigation_path': '/home-dashboard/kalender'
        }
      }] %}
      {{ ns.cards }}
