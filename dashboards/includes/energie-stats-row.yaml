- type: custom:button-card
  name: Netz
  icon: mdi:transmission-tower
  entity: sensor.pv_netzleistung
  show_name: true
  show_icon: true
  show_state: true
  styles:
    card:
      - border-radius: var(--border-radius)
      - box-shadow: var(--box-shadow)
      - padding: 14px 0 10px
    grid:
      - grid-template-areas: "'i' 'n' 's'"
    name:
      - justify-self: center
      - font-weight: bold
      - font-size: 14px
      - margin-top: 10px
    state:
      - justify-self: center
      - font-size: 12px
      - opacity: 0.85
    img_cell:
      - width: 46px
      - height: 46px
      - border-radius: 50%
      - background-color: rgba(var(--color-blue), 0.2)
    icon:
      - color: rgba(var(--color-blue), 1)
      - width: 22px
  state:
    - operator: ">"
      value: 50
      styles:
        icon:
          - color: rgba(var(--color-red), 1)
        img_cell:
          - background-color: rgba(var(--color-red), 0.2)
    - operator: "<"
      value: -50
      styles:
        icon:
          - color: rgba(var(--color-green), 1)
        img_cell:
          - background-color: rgba(var(--color-green), 0.2)

