# Registrierung der YAML-Dashboards (wird von configuration.yaml eingebunden)
#
# Sidebar aufräumen (einmalig auf dem HA-Server):
# • ULM: Einstellungen → Geräte & Dienste → UI Lovelace Minimalist → Konfigurieren
#   → Dashboard- & Adaptive-Eintrag in der Seitenleiste AUS → Neustart
# • Eingebaut: Einstellungen → Dashboards → Übersicht & Landkarte → „Zur Seitenleiste“ AUS
# • Standard: „Home“ (dieses Dashboard) → Als Standard festlegen
# • Optional: HACS „Custom Sidebar“ + sidebar-config.yaml (siehe configuration.yaml)
# • Lampen-Slider (ULM card_light): HACS „My Cards“ (AnthonMS/my-cards) — bereits in configuration.yaml als Ressource
test-dashboard:
  mode: yaml
  title: Home
  icon: mdi:home
  filename: dashboards/test.yaml
  show_in_sidebar: true
