# Registrierung der YAML-Dashboards (wird von configuration.yaml eingebunden)
#
# ═══ Nur „Home“ in der Sidebar ═══
#
# 1) Custom Sidebar (automatisch via Git):
#    • www/custom-sidebar-config.yaml
#    • configuration.yaml → custom-sidebar-plugin.js
#    → HA neu starten, Browser hart neu laden
#
# 2) ULM-Integration (einmalig in der HA-UI):
#    Einstellungen → Geräte & Dienste → UI Lovelace Minimalist → Konfigurieren
#    → „Dashboard in der Seitenleiste“ AUS
#    → „Adaptive Dashboard“ AUS → Speichern → Neustart
#
# 3) Eingebaute Dashboards (einmalig in der HA-UI):
#    Einstellungen → Dashboards → Übersicht & Landkarte
#    → „Zur Seitenleiste hinzufügen“ AUS
#
# 4) Standard-Dashboard:
#    Einstellungen → Dashboards → „Home“ → Als Standard festlegen
#    (oder default_path in custom-sidebar-config.yaml)
#
home-dashboard:
  mode: yaml
  title: Home
  icon: mdi:home
  filename: dashboards/home.yaml
  show_in_sidebar: true
