button_card_templates: !include_dir_merge_named "../custom_components/ui_lovelace_minimalist/__ui_minimalist__/ulm_templates/"

title: Test
theme: minimalist-desktop
background: var(--background-image)
views:
  - title: Home
    path: home
    icon: mdi:home
    cards:
      - type: custom:button-card
        template: card_welcome_scenes
        variables:
          ulm_weather: weather.wetter_home
          ulm_language: de
          entity_1:
            entity_id: sensor.pv_pv_power
            icon: mdi:solar-power-variant
            name: Solar
            color: yellow
            _nav_path: energie
          entity_2:
            entity_id: sensor.pv_battery
            icon: mdi:battery-high
            name: Speicher
            color: green
            _nav_path: energie
          entity_3:
            entity_id: input_select.wetter_ansicht
            icon: mdi:cog
            name: Mehr
            color: pink
            _nav_path: einstellungen
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            template: card_person
            variables:
              ulm_card_person_entity: person.thorge
              ulm_card_person_use_entity_picture: true
              ulm_card_person_battery: sensor.pixel_9_pro_xl_battery_level
          - type: custom:button-card
            template: card_person
            variables:
              ulm_card_person_entity: person.laura
              ulm_card_person_use_entity_picture: true
              ulm_card_person_battery: sensor.pixel_7_pro_battery_level
      - type: custom:button-card
        template: card_title
        name: Räume
      - type: grid
        columns: 2
        square: false
        cards: !include dashboards/includes/ulm-rooms.yaml
      - type: custom:button-card
        template: card_vacuum
        entity: vacuum.dreame_bot_d9_max_dreame_bot_d9_max
        variables:
          ulm_card_vacuum_name: Rocky
          ulm_card_vacuum_camera: camera.dreame_bot_d9_max_map
          ulm_card_vacuum_camera_toggle: true
  - title: Wohnzimmer
    path: wohnzimmer
    subview: true
    icon: mdi:sofa
    theme: minimalist-desktop
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Licht-Szenen
            icon: mdi:palette-swatch
          - type: custom:auto-entities
            show_empty: true
            sort:
              method: friendly_name
            card:
              type: grid
              columns: 2
              square: false
            card_param: cards
            filter:
              include:
                - domain: scene
                  name: "*Wohnzimmer*"
                  options:
                    type: tile
                    vertical: true
                - domain: scene
                  name: "*Esszimmer*"
                  options:
                    type: tile
                    vertical: true
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Beleuchtung
            icon: mdi:lightbulb-group
          - type: grid
            columns: 2
            cards:
              - type: tile
                entity: light.licht_wohnzimmer
                name: Wohnzimmer
                vertical: true
                features_position: bottom
              - type: tile
                entity: light.beleuchtung_bett_leuchte
                name: Esszimmer
                vertical: true
                features_position: bottom
          - type: markdown
            content: >
              _Weitere Lampen erscheinen automatisch, sobald sie in HA
              existieren._
      - type: grid
        cards:
          - type: heading
            heading: Steckdosen
            icon: mdi:power-socket-eu
          - type: markdown
            content: |
              _Platzhalter: `switch.wohnzimmer_*`, `switch.esszimmer_*`_
      - type: grid
        cards:
          - type: heading
            heading: Klima
            icon: mdi:air-conditioner
          - type: tile
            entity: climate.esszimmer_klimaanlage
            name: Esszimmer
            features:
              - type: target-temperature
            features_position: bottom
      - type: grid
        cards:
          - type: heading
            heading: Fenster
            icon: mdi:window-open-variant
          - type: markdown
            content: >
              _Platzhalter: `binary_sensor.fenster_wohnzimmer_*`,
              `binary_sensor.fenster_esszimmer_*`_
      - type: grid
        cards:
          - type: heading
            heading: Türen
            icon: mdi:door
          - type: markdown
            content: |
              _Platzhalter: `binary_sensor.tuer_wohnzimmer_*`_
      - type: grid
        cards:
          - type: heading
            heading: Sensoren
            icon: mdi:thermometer-lines
          - type: markdown
            content: >
              _Platzhalter: `sensor.wohnzimmer_temperatur`,
              `sensor.wohnzimmer_luftfeuchtigkeit`_
      - type: grid
        cards:
          - type: heading
            heading: Bewegungsmelder
            icon: mdi:motion-sensor
          - type: markdown
            content: |
              _Platzhalter: `binary_sensor.bewegung_wohnzimmer_*`_
      - type: grid
        cards:
          - type: heading
            heading: Batteriestände
            icon: mdi:battery-medium
          - type: markdown
            content: |
              _Platzhalter: Zigbee/Matter-Geräte mit `sensor.*_battery`_
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Geräte
            icon: mdi:robot-vacuum
          - type: tile
            entity: vacuum.dreame_bot_d9_max_dreame_bot_d9_max
            name: Staubsauger
            features:
              - type: vacuum-commands
          - type: custom:dreame-vacuum-map-card
            entity: vacuum.dreame_bot_d9_max_dreame_bot_d9_max
            map_entity: camera.dreame_bot_d9_max_map
            theme: dark
