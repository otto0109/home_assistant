                entity: sensor.raum_neben_der_kuche_klimaanlage_energieverbrauch
                name: Küche
              - type: tile
                entity: sensor.schlafzimmer_klimaanlage_energieverbrauch
                name: Schlafzimmer
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Zeitraum
            icon: mdi:chart-timeline-variant
          - type: horizontal-stack
            cards:
              - type: button
                name: Live
                icon: mdi:pulse
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  target:
                    entity_id: input_select.pv_zeitraum
                  data:
                    option: Live
              - type: button
                name: 24h
                icon: mdi:clock-outline
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  target:
                    entity_id: input_select.pv_zeitraum
                  data:
                    option: 24h
              - type: button
                name: Woche
                icon: mdi:calendar-week
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  target:
                    entity_id: input_select.pv_zeitraum
                  data:
                    option: Woche
              - type: button
                name: Monat
                icon: mdi:calendar-month
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  target:
                    entity_id: input_select.pv_zeitraum
                  data:
                    option: Monat
              - type: button
                name: Jahr
                icon: mdi:calendar
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  target:
                    entity_id: input_select.pv_zeitraum
                  data:
                    option: Jahr
              - type: button
                name: Gesamt
                icon: mdi:chart-areaspline
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  target:
                    entity_id: input_select.pv_zeitraum
                  data:
