  - title: Energie
    path: energie
    subview: true
    icon: mdi:solar-power
    theme: minimalist-desktop
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:power-flow-card-plus
            clickable_entities: true
            use_new_flow_rate_model: true
            min_flow_rate: 0.75
            max_flow_rate: 6
            min_expected_power: 0.01
            max_expected_power: 11000
            w_decimals: 0
            kw_decimals: 2
            display_zero_lines:
              mode: transparency
              transparency: 70
            entities:
              solar:
                entity: sensor.pv_pv_power
                name: Solar
                icon: mdi:solar-power-variant
                color_icon: true
                display_zero: true
                secondary_info:
                  entity: sensor.pv_kwpeak
                  unit_of_measurement: kWp
                  decimals: 2
              grid:
                entity: sensor.pv_netzleistung
                name: Netz
                icon: mdi:transmission-tower
                display_state: one_way
                color_circle: color_dynamically
              battery:
                entity: sensor.pv_battery_power
                state_of_charge: sensor.pv_battery
                name: Speicher
                display_state: one_way
                color_circle: color_dynamically
                state_of_charge_decimals: 0
              home:
                entity: sensor.pv_activepower_load_sys
                name: Haus
                icon: mdi:home
                color_icon: true
                override_state: true
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Heute
            icon: mdi:calendar-today
          - type: grid
            columns: 2
            cards:
              - type: tile
                entity: sensor.pv_today_energy_export
                name: Einspeisung
                icon: mdi:transmission-tower-export
              - type: tile
                entity: sensor.pv_today_energy_import
                name: Netzbezug
                icon: mdi:transmission-tower-import
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Verlauf heute
            icon: mdi:chart-line
          - type: history-graph
            hours_to_show: 24
            refresh_interval: 60
            show_names: true
            entities:
              - entity: sensor.pv_pv_power
                name: Solar
              - entity: sensor.pv_activepower_load_sys
                name: Verbrauch
              - entity: sensor.pv_battery_power
                name: Batterie
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Klima — Verbrauch
            icon: mdi:air-conditioner
          - type: grid
            columns: 3
            cards:
              - type: tile
                entity: sensor.esszimmer_klimaanlage_energieverbrauch
                name: Esszimmer
              - type: tile
                entity: sensor.raum_neben_der_kuche_klimaanlage_energieverbrauch
                name: Küche
              - type: tile
                entity: sensor.schlafzimmer_klimaanlage_energieverbrauch
                name: Schlafzimmer
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Zeitraum
            icon: mdi:chart-timeline-variant
          - type: horizontal-stack
            cards:
              - type: button
                name: Live
                icon: mdi:pulse
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  target:
                    entity_id: input_select.pv_zeitraum
                  data:
                    option: Live
              - type: button
                name: 24h
                icon: mdi:clock-outline
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  target:
                    entity_id: input_select.pv_zeitraum
                  data:
                    option: 24h
              - type: button
                name: Woche
                icon: mdi:calendar-week
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  target:
                    entity_id: input_select.pv_zeitraum
                  data:
                    option: Woche
              - type: button
                name: Monat
                icon: mdi:calendar-month
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  target:
                    entity_id: input_select.pv_zeitraum
                  data:
                    option: Monat
              - type: button
                name: Jahr
                icon: mdi:calendar
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  target:
                    entity_id: input_select.pv_zeitraum
                  data:
                    option: Jahr
              - type: button
                name: Gesamt
                icon: mdi:chart-areaspline
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  target:
                    entity_id: input_select.pv_zeitraum
                  data:
                    option: Lebenslang
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.pv_zeitraum
                state: Live
            card:
              type: history-graph
              hours_to_show: 1
              refresh_interval: 5
              show_names: true
              entities:
                - entity: sensor.pv_pv_power
                  name: Solar
                - entity: sensor.pv_activepower_load_sys
                  name: Verbrauch
                - entity: sensor.pv_battery_power
                  name: Batterie
                - entity: sensor.pv_battery
                  name: Ladestand
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.pv_zeitraum
                state: 24h
            card:
              type: statistics-graph
              chart_type: line
              days_to_show: 1
              period: 5minute
              stat_types:
                - mean
              entities:
                - entity: sensor.pv_pv_power
                  name: Solar
                - entity: sensor.pv_activepower_load_sys
                  name: Verbrauch
                - entity: sensor.pv_battery_power
                  name: Batterie
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.pv_zeitraum
                state: Woche
            card:
              type: statistics-graph
              chart_type: line
              days_to_show: 7
              period: hour
              stat_types:
                - mean
              entities:
                - entity: sensor.pv_pv_power
                  name: Solar
                - entity: sensor.pv_activepower_load_sys
                  name: Verbrauch
                - entity: sensor.pv_battery_power
                  name: Batterie
                - entity: sensor.pv_today_energy_import
                  name: Import
                - entity: sensor.pv_today_energy_export
                  name: Export
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.pv_zeitraum
                state: Monat
            card:
              type: statistics-graph
              chart_type: line
              days_to_show: 30
              period: hour
              stat_types:
                - mean
              entities:
                - entity: sensor.pv_pv_power
                  name: Solar
                - entity: sensor.pv_activepower_load_sys
                  name: Verbrauch
                - entity: sensor.pv_battery_power
                  name: Batterie
                - entity: sensor.pv_today_energy_import
                  name: Import
                - entity: sensor.pv_today_energy_export
                  name: Export
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.pv_zeitraum
                state: Jahr
            card:
              type: statistics-graph
              chart_type: line
              days_to_show: 365
              period: day
              stat_types:
                - mean
              entities:
                - entity: sensor.pv_pv_power
                  name: Solar
                - entity: sensor.pv_activepower_load_sys
                  name: Verbrauch
                - entity: sensor.pv_battery_power
                  name: Batterie
                - entity: sensor.pv_today_energy_import
                  name: Import
                - entity: sensor.pv_today_energy_export
                  name: Export
          - type: conditional
            conditions:
