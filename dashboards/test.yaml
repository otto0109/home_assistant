title: Test
views:
  - title: Übersicht
    path: uebersicht
    icon: mdi:home-analytics
    theme: dark
    type: sections
    max_columns: 6
    sections:
      - type: grid
        column_span: 6
        cards:
          - type: horizontal-stack
            cards:
              - type: markdown
                content: >
                  {% set name = user.split(' ')[0] %}

                  # ZUHAUSE

                  <p class="sub">{{ now().strftime('%A, %d. %B') | capitalize }}
                  · Hallo {{ name }}</p>
                card_mod:
                  style: |
                    ha-card {
                      background: transparent !important;
                      box-shadow: none !important;
                      border: none !important;
                      padding: 8px 4px 0 8px;
                    }
                    h1 {
                      font-size: clamp(2rem, 5vw, 3.2rem);
                      font-weight: 200;
                      letter-spacing: 0.12em;
                      margin: 0 0 4px 0;
                      line-height: 1.1;
                    }
                    .sub {
                      margin: 0;
                      opacity: 0.55;
                      font-size: 0.95rem;
                      letter-spacing: 0.04em;
                      text-transform: uppercase;
                    }
              - type: markdown
                content: |
                  <p class="clock">{{ now().strftime('%H:%M') }}</p>
                card_mod:
                  style: |
                    ha-card {
                      background: transparent !important;
                      box-shadow: none !important;
                      border: none !important;
                      text-align: right;
                      padding: 8px 8px 0 0;
                    }
                    .clock {
                      margin: 0;
                      font-size: clamp(2.5rem, 6vw, 4rem);
                      font-weight: 200;
                      letter-spacing: 0.06em;
                      line-height: 1;
                    }
      - type: grid
        column_span: 6
        cards:
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:home
                content: Start
                tap_action:
                  action: navigate
                  navigation_path: uebersicht
              - type: template
                icon: mdi:sofa
                content: Wohnen
                tap_action:
                  action: navigate
                  navigation_path: wohnzimmer
              - type: template
                icon: mdi:stove
                content: Küche
                tap_action:
                  action: navigate
                  navigation_path: kueche
              - type: template
                icon: mdi:bed
                content: Schlafen
                tap_action:
                  action: navigate
                  navigation_path: schlafzimmer
              - type: template
                icon: mdi:door-open
                content: Flur
                tap_action:
                  action: navigate
                  navigation_path: flur
              - type: template
                icon: mdi:flower
                content: Garten
                tap_action:
                  action: navigate
                  navigation_path: garten
              - type: template
                icon: mdi:solar-power
                content: Energie
                tap_action:
                  action: navigate
                  navigation_path: energie
              - type: template
                icon: mdi:calendar-month
                content: Kalender
                tap_action:
                  action: navigate
                  navigation_path: einstellungen
              - type: template
                icon: mdi:cog
                content: Mehr
                tap_action:
                  action: navigate
                  navigation_path: einstellungen
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: person.thorge
              - type: entity
                entity: person.laura
              - type: entity
                entity: weather.wetter_home
              - type: template
                icon: mdi:lightbulb-group
                content: |
                  {% set lights = [
                    'light.licht_wohnzimmer',
                    'light.beleuchtung_bett_leuchte',
                    'switch.flur_licht_shelly',
                    'switch.shelly_1_mini_gen4',
                    'switch.licht_abstellraum_unten_sonoff',
                    'switch.licht_sonoff'
                  ] %} {% set on = namespace(c=0) %} {% for e in lights %}
                    {% if is_state(e, 'on') %}{% set on.c = on.c + 1 %}{% endif %}
                  {% endfor %} {{ on.c }}/{{ lights | count }} Licht
                tap_action:
                  action: navigate
                  navigation_path: wohnzimmer
      - type: grid
        column_span: 3
        cards:
          - type: custom:auto-entities
            show_empty: false
            sort:
              method: friendly_name
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - domain: scene
                  options:
                    type: custom:mushroom-entity-card
                    layout: horizontal
                    fill_container: true
                    icon_color: amber
                    card_mod:
                      style: |
                        ha-card { min-height: 76px; }
                        mushroom-shape-icon { --icon-size: 40px; }
                        .primary {
                          font-size: 1.05rem !important;
                          white-space: normal !important;
                          line-height: 1.25 !important;
                        }
      - type: grid
        column_span: 3
        cards:
          - type: custom:power-flow-card-plus
            clickable_entities: true
            use_new_flow_rate_model: true
            min_flow_rate: 0.75
            max_flow_rate: 6
            min_expected_power: 0.01
            max_expected_power: 11000
            w_decimals: 0
            kw_decimals: 2
            display_zero_lines:
              mode: transparency
              transparency: 70
            entities:
              solar:
                entity: sensor.pv_pv_power
                name: Solar
                icon: mdi:solar-power-variant
                color_icon: true
                display_zero: true
                secondary_info:
                  entity: sensor.pv_kwpeak
                  unit_of_measurement: kWp
                  decimals: 2
              grid:
                entity: sensor.pv_netzleistung
                name: Netz
                icon: mdi:transmission-tower
                display_state: one_way
                color_circle: color_dynamically
              battery:
                entity: sensor.pv_battery_power
                state_of_charge: sensor.pv_battery
                name: Speicher
                display_state: one_way
                color_circle: color_dynamically
                state_of_charge_decimals: 0
              home:
                entity: sensor.pv_activepower_load_sys
                name: Haus
                icon: mdi:home
                color_icon: true
                override_state: true
      - type: grid
        column_span: 6
        cards:
          - type: custom:mushroom-template-card
            primary: Wohnen
            icon: mdi:sofa
            layout: vertical
            fill_container: true
            tap_action:
              action: navigate
              navigation_path: wohnzimmer
            card_mod:
              style: |
                .primary { white-space: normal !important; text-align: center; }
          - type: custom:mushroom-template-card
            primary: Küche
            icon: mdi:stove
            layout: vertical
            fill_container: true
            tap_action:
              action: navigate
              navigation_path: kueche
            card_mod:
              style: |
                .primary { white-space: normal !important; text-align: center; }
          - type: custom:mushroom-template-card
            primary: Schlafen
            icon: mdi:bed
            layout: vertical
            fill_container: true
            tap_action:
              action: navigate
              navigation_path: schlafzimmer
            card_mod:
              style: |
                .primary { white-space: normal !important; text-align: center; }
          - type: custom:mushroom-template-card
            primary: Flur
            icon: mdi:door-open
            layout: vertical
            fill_container: true
            tap_action:
              action: navigate
              navigation_path: flur
            card_mod:
              style: |
                .primary { white-space: normal !important; text-align: center; }
          - type: custom:mushroom-template-card
            primary: Garten
            icon: mdi:flower
            layout: vertical
            fill_container: true
            tap_action:
              action: navigate
              navigation_path: garten
            card_mod:
              style: |
                .primary { white-space: normal !important; text-align: center; }
          - type: custom:mushroom-template-card
            primary: Energie
            icon: mdi:solar-power
            layout: vertical
            fill_container: true
            tap_action:
              action: navigate
              navigation_path: energie
            card_mod:
              style: |
                .primary { white-space: normal !important; text-align: center; }
      - type: grid
        column_span: 6
        cards:
          - type: custom:mushroom-entity-card
            entity: weather.wetter_home
            name: Wetter
            layout: vertical
            fill_container: true
          - type: custom:mushroom-template-card
            entity: sensor.pv_pv_power
            primary: "{{ states('sensor.pv_pv_power') }} W"
            secondary: Speicher {{ states('sensor.pv_battery') }}%
            icon: mdi:solar-power-variant
            icon_color: amber
            layout: vertical
            fill_container: true
            tap_action:
              action: navigate
              navigation_path: energie
          - type: custom:mushroom-entity-card
            entity: vacuum.dreame_bot_d9_max_dreame_bot_d9_max
            name: Rocky
            layout: vertical
            fill_container: true
            tap_action:
              action: navigate
              navigation_path: wohnzimmer
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.pv_activepower_load_sys') }} W"
            secondary: Hausverbrauch
            icon: mdi:home-lightning-bolt
            icon_color: pink
            layout: vertical
            fill_container: true
            tap_action:
              action: navigate
              navigation_path: energie
      - type: grid
        column_span: 6
        cards:
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.pixel_7_pro_battery_level
                below: 20
            card:
              type: custom:mushroom-entity-card
              entity: sensor.pixel_7_pro_battery_level
              name: Laura — Akku niedrig
              icon: mdi:battery-alert
              layout: horizontal
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.pixel_9_pro_xl_battery_level
                below: 20
            card:
              type: custom:mushroom-entity-card
              entity: sensor.pixel_9_pro_xl_battery_level
              name: Thorge — Akku niedrig
              icon: mdi:battery-alert
              layout: horizontal
  - title: Wohnzimmer
    path: wohnzimmer
    icon: mdi:sofa
    theme: dark
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Licht-Szenen
            icon: mdi:palette-swatch
          - type: custom:auto-entities
            show_empty: true
            sort:
              method: friendly_name
            card:
              type: grid
              columns: 2
              square: false
            card_param: cards
            filter:
              include:
                - domain: scene
                  name: "*Wohnzimmer*"
                  options:
                    type: tile
                    vertical: true
                - domain: scene
                  name: "*Esszimmer*"
                  options:
                    type: tile
                    vertical: true
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Beleuchtung
            icon: mdi:lightbulb-group
          - type: grid
            columns: 2
            cards:
              - type: tile
                entity: light.licht_wohnzimmer
                name: Wohnzimmer
                vertical: true
                features_position: bottom
              - type: tile
                entity: light.beleuchtung_bett_leuchte
                name: Esszimmer
                vertical: true
                features_position: bottom
          - type: markdown
            content: >
              _Weitere Lampen erscheinen automatisch, sobald sie in HA
              existieren._
      - type: grid
        cards:
          - type: heading
            heading: Steckdosen
            icon: mdi:power-socket-eu
          - type: markdown
            content: |
              _Platzhalter: `switch.wohnzimmer_*`, `switch.esszimmer_*`_
      - type: grid
        cards:
          - type: heading
            heading: Klima
            icon: mdi:air-conditioner
          - type: tile
            entity: climate.esszimmer_klimaanlage
            name: Esszimmer
            features:
              - type: target-temperature
            features_position: bottom
      - type: grid
        cards:
          - type: heading
            heading: Fenster
            icon: mdi:window-open-variant
          - type: markdown
            content: >
              _Platzhalter: `binary_sensor.fenster_wohnzimmer_*`,
              `binary_sensor.fenster_esszimmer_*`_
      - type: grid
        cards:
          - type: heading
            heading: Türen
            icon: mdi:door
          - type: markdown
            content: |
              _Platzhalter: `binary_sensor.tuer_wohnzimmer_*`_
      - type: grid
        cards:
          - type: heading
            heading: Sensoren
            icon: mdi:thermometer-lines
          - type: markdown
            content: >
              _Platzhalter: `sensor.wohnzimmer_temperatur`,
              `sensor.wohnzimmer_luftfeuchtigkeit`_
      - type: grid
        cards:
          - type: heading
            heading: Bewegungsmelder
            icon: mdi:motion-sensor
          - type: markdown
            content: |
              _Platzhalter: `binary_sensor.bewegung_wohnzimmer_*`_
      - type: grid
        cards:
          - type: heading
            heading: Batteriestände
            icon: mdi:battery-medium
          - type: markdown
            content: |
              _Platzhalter: Zigbee/Matter-Geräte mit `sensor.*_battery`_
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Geräte
            icon: mdi:robot-vacuum
          - type: tile
            entity: vacuum.dreame_bot_d9_max_dreame_bot_d9_max
            name: Staubsauger
            features:
              - type: vacuum-commands
          - type: custom:dreame-vacuum-map-card
            entity: vacuum.dreame_bot_d9_max_dreame_bot_d9_max
            map_entity: camera.dreame_bot_d9_max_map
            theme: dark
