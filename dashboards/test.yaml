  - title: Energie
    path: energie
    icon: mdi:solar-power
    theme: dark
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:power-flow-card-plus
            clickable_entities: true
            use_new_flow_rate_model: true
            min_flow_rate: 0.75
            max_flow_rate: 6
            min_expected_power: 0.01
            max_expected_power: 11000
            w_decimals: 0
            kw_decimals: 2
            display_zero_lines:
              mode: transparency
              transparency: 70
            entities:
              solar:
                entity: sensor.pv_pv_power
                name: Solar
                icon: mdi:solar-power-variant
                color_icon: true
                display_zero: true
                secondary_info:
                  entity: sensor.pv_kwpeak
                  unit_of_measurement: kWp
                  decimals: 2
              grid:
                entity: sensor.pv_netzleistung
                name: Netz
                icon: mdi:transmission-tower
                display_state: one_way
                color_circle: color_dynamically
              battery:
                entity: sensor.pv_battery_power
                state_of_charge: sensor.pv_battery
                name: Speicher
                display_state: one_way
                color_circle: color_dynamically
                state_of_charge_decimals: 0
              home:
                entity: sensor.pv_activepower_load_sys
                name: Haus
                icon: mdi:home
                color_icon: true
                override_state: true
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Heute
            icon: mdi:calendar-today
          - type: grid
            columns: 2
            cards:
              - type: tile
                entity: sensor.pv_today_energy_export
                name: Einspeisung
                icon: mdi:transmission-tower-export
              - type: tile
                entity: sensor.pv_today_energy_import
