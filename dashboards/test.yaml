              type: history-graph
              hours_to_show: 1
              refresh_interval: 5
              show_names: true
              entities:
                - entity: sensor.pv_pv_power
                  name: Solar
                - entity: sensor.pv_activepower_load_sys
                  name: Verbrauch
                - entity: sensor.pv_battery_power
                  name: Batterie
                - entity: sensor.pv_battery
                  name: Ladestand
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.pv_zeitraum
                state: 24h
            card:
              type: statistics-graph
              chart_type: line
              days_to_show: 1
              period: 5minute
              stat_types:
                - mean
              entities:
                - entity: sensor.pv_pv_power
                  name: Solar
                - entity: sensor.pv_activepower_load_sys
                  name: Verbrauch
                - entity: sensor.pv_battery_power
                  name: Batterie
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.pv_zeitraum
                state: Woche
            card:
              type: statistics-graph
              chart_type: line
              days_to_show: 7
              period: hour
              stat_types:
                - mean
              entities:
                - entity: sensor.pv_pv_power
                  name: Solar
                - entity: sensor.pv_activepower_load_sys
                  name: Verbrauch
                - entity: sensor.pv_battery_power
                  name: Batterie
                - entity: sensor.pv_today_energy_import
                  name: Import
                - entity: sensor.pv_today_energy_export
                  name: Export
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.pv_zeitraum
                state: Monat
            card:
              type: statistics-graph
              chart_type: line
              days_to_show: 30
              period: hour
              stat_types:
                - mean
              entities:
                - entity: sensor.pv_pv_power
                  name: Solar
                - entity: sensor.pv_activepower_load_sys
                  name: Verbrauch
                - entity: sensor.pv_battery_power
                  name: Batterie
                - entity: sensor.pv_today_energy_import
                  name: Import
                - entity: sensor.pv_today_energy_export
                  name: Export
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.pv_zeitraum
                state: Jahr
            card:
              type: statistics-graph
              chart_type: line
              days_to_show: 365
              period: day
              stat_types:
                - mean
              entities:
                - entity: sensor.pv_pv_power
                  name: Solar
                - entity: sensor.pv_activepower_load_sys
                  name: Verbrauch
                - entity: sensor.pv_battery_power
                  name: Batterie
                - entity: sensor.pv_today_energy_import
                  name: Import
                - entity: sensor.pv_today_energy_export
                  name: Export
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.pv_zeitraum
                state: Lebenslang
            card:
              type: statistics-graph
              chart_type: line
              days_to_show: 1825
              period: month
              stat_types:
                - mean
              entities:
                - entity: sensor.pv_pv_power
                  name: Solar
                - entity: sensor.pv_activepower_load_sys
                  name: Verbrauch
                - entity: sensor.pv_battery_power
                  name: Batterie
                - entity: sensor.pv_today_energy_import
                  name: Import
                - entity: sensor.pv_today_energy_export
                  name: Export
                - entity: sensor.esszimmer_klimaanlage_energieverbrauch
                  name: Klima Esszimmer
                - entity: sensor.raum_neben_der_kuche_klimaanlage_energieverbrauch
                  name: Klima Küche
                - entity: sensor.schlafzimmer_klimaanlage_energieverbrauch
                  name: Klima Schlafzimmer
